<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heirloom Family Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* ─────────────────────────────────────────────────────────────
   Heirloom — tokens
   Palette: herbarium green on a green-grey paper, brass for unions.
   ───────────────────────────────────────────────────────────── */
:root{
  --paper:#EBEBE3;  --paper-2:#E1E1D7;
  --panel:#FAFAF6;  --panel-2:#F1F1EA;  --panel-3:#E8E8DF;
  --card:#FFFFFF;   --card-2:#F7F7F1;
  --ink:#161E24;    --ink-2:#4B5A62;   --ink-3:#7C8A90;
  --line:#D8D8CC;   --line-2:#C2C2B4;  --hair:#E3E3D9;
  --accent:#3D6A54; --accent-2:#2C5040; --accent-tint:#DFE9E2; --accent-ring:#8FB6A2;
  --brass:#96671F;  --brass-tint:#EFE3CD;
  --danger:#9A3728; --danger-tint:#F3DED9;
  --shade:rgba(22,30,36,.09);
  --lift:0 1px 1px rgba(22,30,36,.05), 0 10px 26px -16px rgba(22,30,36,.4);
  --r:7px;
  --f-disp:"Fraunces",Georgia,"Times New Roman",serif;
  --f-ui:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121618;  --paper-2:#0D1113;
    --panel:#1A2023;  --panel-2:#212A2D;  --panel-3:#293336;
    --card:#222A2D;   --card-2:#1C2427;
    --ink:#E6EAE5;    --ink-2:#A2AFAC;   --ink-3:#73807E;
    --line:#323C3E;   --line-2:#455052;  --hair:#272F31;
    --accent:#7FBF9C; --accent-2:#9CD3B4; --accent-tint:#1F2E27; --accent-ring:#4E7A64;
    --brass:#D2A25E;  --brass-tint:#2E2617;
    --danger:#E28572; --danger-tint:#3A231E;
    --shade:rgba(0,0,0,.5);
    --lift:0 1px 1px rgba(0,0,0,.3), 0 12px 28px -18px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121618;  --paper-2:#0D1113;
  --panel:#1A2023;  --panel-2:#212A2D;  --panel-3:#293336;
  --card:#222A2D;   --card-2:#1C2427;
  --ink:#E6EAE5;    --ink-2:#A2AFAC;   --ink-3:#73807E;
  --line:#323C3E;   --line-2:#455052;  --hair:#272F31;
  --accent:#7FBF9C; --accent-2:#9CD3B4; --accent-tint:#1F2E27; --accent-ring:#4E7A64;
  --brass:#D2A25E;  --brass-tint:#2E2617;
  --danger:#E28572; --danger-tint:#3A231E;
  --shade:rgba(0,0,0,.5);
  --lift:0 1px 1px rgba(0,0,0,.3), 0 12px 28px -18px rgba(0,0,0,.9);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
/* author display rules otherwise beat the UA's [hidden] rule */
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:400 14px/1.45 var(--f-ui);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-tint);color:var(--ink)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ── shell ───────────────────────────────────────────────── */
#app{
  display:grid; height:100dvh;
  grid-template-columns:262px minmax(0,1fr) 0;
  grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"bar bar bar" "rail stage insp";
  transition:grid-template-columns .22s cubic-bezier(.2,.7,.3,1);
}
#app.insp-open{grid-template-columns:262px minmax(0,1fr) 336px}
#app.rail-hidden{grid-template-columns:0 minmax(0,1fr) 0}
#app.rail-hidden.insp-open{grid-template-columns:0 minmax(0,1fr) 336px}

/* ── top bar ─────────────────────────────────────────────── */
.bar{
  grid-area:bar; display:flex; align-items:center; gap:14px;
  padding:0 12px 0 14px; height:54px;
  background:var(--panel); border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:9px;flex:0 0 auto;padding-right:4px}
.brand svg{flex:0 0 auto;align-self:center}
.brand h1{
  font:600 19px/1 var(--f-disp); margin:0; letter-spacing:-.01em;
  font-variation-settings:"SOFT" 20,"WONK" 1;
}
.brand .tag{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
}
.bar-sep{width:1px;height:24px;background:var(--line);flex:0 0 auto}
.bar-spring{flex:1 1 auto;min-width:8px}

.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{
  padding:5px 11px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink-2);
  white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
}
.seg button svg{flex:0 0 auto;opacity:.85}
.seg button[aria-pressed="true"] svg{opacity:1}
@media (max-width:1320px){.seg .lab{display:none}.seg button{padding:6px 9px}}
.selwrap{position:relative;display:inline-flex;flex:0 0 auto}
.selwrap svg{position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-3)}
.selwrap select{
  appearance:none;-webkit-appearance:none;
  padding:7px 26px 7px 11px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel-2);font-size:12.5px;font-weight:500;color:var(--ink);
}
.selwrap select:hover{background:var(--panel-3);border-color:var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px var(--shade);font-weight:600}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink)}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel-2); font-size:13px;font-weight:500;color:var(--ink);
  white-space:nowrap;
}
.btn:hover{background:var(--panel-3);border-color:var(--line-2)}
.btn:active{transform:translateY(.5px)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.primary,
:root:not([data-theme="light"]) .btn.primary{color:#0F1512}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel-2);border-color:var(--line)}
.btn.icon{padding:7px;width:32px;justify-content:center}
.btn.danger{color:var(--danger);border-color:var(--danger-tint);background:transparent}
.btn.danger:hover{background:var(--danger-tint)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}

/* ── people rail ─────────────────────────────────────────── */
.rail{
  grid-area:rail; overflow:hidden; display:flex; flex-direction:column;
  background:var(--panel); border-right:1px solid var(--line); min-width:0;
}
.rail-head{padding:12px 12px 9px;display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--hair)}
.search{position:relative}
.search input{
  width:100%;padding:7px 10px 7px 29px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);font-size:13px;
}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.rail-meta{
  display:flex;align-items:center;justify-content:space-between;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
}
.rail-list{overflow-y:auto;flex:1;padding:6px 8px 16px}
.rail-gen{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);padding:12px 6px 5px;display:flex;align-items:center;gap:8px;
}
.rail-gen::after{content:"";flex:1;height:1px;background:var(--hair)}
.prow{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:6px 7px;border-radius:7px;line-height:1.25;
}
.prow:hover{background:var(--panel-2)}
.prow[aria-current="true"]{background:var(--accent-tint)}
.prow .av{
  width:26px;height:26px;border-radius:50%;flex:0 0 auto;overflow:hidden;
  display:grid;place-items:center;font-size:10px;font-weight:600;letter-spacing:.02em;
}
.prow .av img{width:100%;height:100%;object-fit:cover}
.prow .nm{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .dt{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.prow .txt{min-width:0;flex:1}
.rail-empty{padding:26px 14px;color:var(--ink-3);font-size:12.5px;text-align:center;line-height:1.6}

/* ── stage ───────────────────────────────────────────────── */
.stage{grid-area:stage;position:relative;overflow:hidden;background:var(--paper);min-width:0}
.stage::before{
  /* faint laid-paper grid, sits under the chart */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);
  background-size:96px 96px;
  -webkit-mask-image:radial-gradient(ellipse 90% 80% at 50% 45%,#000 35%,transparent 100%);
          mask-image:radial-gradient(ellipse 90% 80% at 50% 45%,#000 35%,transparent 100%);
}
#chart{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#chart.panning{cursor:grabbing}

.stage-empty{
  position:absolute;inset:0;display:grid;place-items:center;padding:24px;pointer-events:none;
}
.stage-empty .in{
  pointer-events:auto;max-width:400px;text-align:center;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px 28px;box-shadow:var(--lift);
}
.stage-empty h2{font:600 22px/1.2 var(--f-disp);margin:14px 0 8px;font-variation-settings:"SOFT" 24,"WONK" 1}
.stage-empty p{margin:0 0 18px;color:var(--ink-2);font-size:13.5px;line-height:1.6}

/* floating clusters over the stage */
.dock{
  position:absolute;display:flex;align-items:center;gap:2px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:3px;box-shadow:var(--lift);
}
.dock.zoom{left:14px;bottom:14px}
.dock.zoom .z{font-family:var(--f-mono);font-size:11px;padding:0 8px;color:var(--ink-2);min-width:48px;text-align:center}
.dock button{padding:6px;border-radius:7px;color:var(--ink-2);display:grid;place-items:center}
.dock button:hover{background:var(--panel-2);color:var(--ink)}
.dock button[aria-pressed="true"]{background:var(--accent-tint);color:var(--accent-2)}

/* app-chrome attribution — deliberately not on the printed chart,
   which carries the family's own title and footer instead */
.credit{
  position:absolute;left:50%;bottom:17px;transform:translateX(-50%);
  font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;
  color:var(--ink-3);opacity:.75;pointer-events:none;white-space:nowrap;
}
.credit b{font-weight:500;color:var(--ink-2)}
.legend{
  position:absolute;right:14px;bottom:14px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;box-shadow:var(--lift);
  display:flex;gap:14px;align-items:center;
  font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);
}
.legend b{font-weight:500;color:var(--brass);font-size:13px;line-height:1}
.legend span{display:flex;align-items:center;gap:5px}

.sample-flag{
  position:absolute;left:50%;top:12px;transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;
  background:var(--brass-tint);border:1px solid color-mix(in srgb,var(--brass) 34%,transparent);
  color:var(--brass);border-radius:999px;padding:5px 6px 5px 14px;
  font-size:12px;font-weight:500;box-shadow:var(--lift);z-index:3;
}
.sample-flag button{color:var(--brass);text-decoration:underline;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
.sample-flag button:hover{background:color-mix(in srgb,var(--brass) 15%,transparent)}

/* ── inspector ───────────────────────────────────────────── */
.insp{
  grid-area:insp;overflow:hidden;background:var(--panel);
  border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;
}
.insp-head{
  padding:12px 10px 12px 14px;border-bottom:1px solid var(--hair);
  display:flex;align-items:flex-start;gap:10px;
}
.insp-head .av{
  width:44px;height:44px;border-radius:50%;overflow:hidden;flex:0 0 auto;
  display:grid;place-items:center;font-size:15px;font-weight:600;
}
.insp-head .av img{width:100%;height:100%;object-fit:cover}
.insp-head h2{
  font:600 17px/1.2 var(--f-disp);margin:2px 0 3px;font-variation-settings:"SOFT" 20,"WONK" 1;
  overflow-wrap:anywhere;
}
.insp-head .sub{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.insp-body{overflow-y:auto;flex:1;padding:0 14px 24px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px 0 4px}
.quick .btn{justify-content:center;font-size:12.5px;padding:8px 6px}

fieldset{border:0;margin:0;padding:16px 0 0}
legend{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);padding:0 0 8px;width:100%;border-bottom:1px solid var(--hair);margin-bottom:11px;
}
.fgrid{display:grid;gap:9px}
.fgrid.two{grid-template-columns:1fr 1fr}
label.f{display:block}
label.f>span{
  display:block;font-size:10.5px;font-weight:500;letter-spacing:.03em;
  color:var(--ink-3);margin-bottom:3px;
}
label.f input,label.f select,label.f textarea{
  width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--line);
  background:var(--card);font-size:13px;
}
label.f input:focus,label.f select:focus,label.f textarea:focus{
  outline:none;border-color:var(--accent-ring);box-shadow:0 0 0 3px var(--accent-tint);
}
label.f textarea{resize:vertical;min-height:60px;line-height:1.5}
label.f .hint{font-size:10.5px;color:var(--ink-3);margin-top:3px;font-family:var(--f-mono)}

.rel{display:flex;flex-direction:column;gap:5px}
.rel-item{
  display:flex;align-items:center;gap:8px;padding:6px 6px 6px 8px;
  border:1px solid var(--line);border-radius:8px;background:var(--card);
}
.rel-item .txt{flex:1;min-width:0}
.rel-item .nm{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel-item .meta{font-family:var(--f-mono);font-size:10px;color:var(--ink-3)}
.rel-item .go{color:var(--ink-3);padding:4px;border-radius:5px}
.rel-item .go:hover{background:var(--panel-2);color:var(--accent-2)}
.rel-none{font-size:12px;color:var(--ink-3);padding:3px 2px 5px;font-style:italic}
.rel-add{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:7px;border:1px dashed var(--line-2);border-radius:8px;
  font-size:12.5px;color:var(--ink-2);font-weight:500;
}
.rel-add:hover{border-color:var(--accent-ring);color:var(--accent-2);background:var(--accent-tint)}

.photo-row{display:flex;gap:10px;align-items:center}
.photo-prev{
  width:56px;height:56px;border-radius:8px;border:1px solid var(--line);
  background:var(--card-2);overflow:hidden;display:grid;place-items:center;flex:0 0 auto;
}
.photo-prev img{width:100%;height:100%;object-fit:cover}
.photo-prev span{font-size:9px;color:var(--ink-3);font-family:var(--f-mono);text-align:center;padding:2px}

/* ── modal ───────────────────────────────────────────────── */
.scrim{
  position:fixed;inset:0;background:color-mix(in srgb,var(--paper-2) 72%,transparent);
  backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;z-index:60;
}
.scrim[hidden]{display:none}
.modal{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 24px 60px -20px var(--shade),0 0 0 1px var(--shade);
  width:min(100%,540px);max-height:min(86dvh,760px);display:flex;flex-direction:column;overflow:hidden;
}
.modal.wide{width:min(100%,880px)}
.modal-head{
  padding:16px 18px 13px;border-bottom:1px solid var(--hair);
  display:flex;align-items:flex-start;gap:12px;
}
.modal-head h2{font:600 18px/1.2 var(--f-disp);margin:0 0 3px;font-variation-settings:"SOFT" 20,"WONK" 1}
.modal-head p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.modal-body{overflow-y:auto;padding:16px 18px;flex:1}
.modal-foot{
  padding:12px 18px;border-top:1px solid var(--hair);display:flex;gap:8px;
  align-items:center;justify-content:flex-end;background:var(--panel-2);
}
.modal-foot .spring{flex:1}

.picker-list{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow-y:auto;margin-top:10px}
.picker-new{
  display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;
  border:1px dashed var(--accent-ring);color:var(--accent-2);background:var(--accent-tint);
  font-size:13px;font-weight:600;width:100%;text-align:left;margin-top:10px;
}

/* print setup dialog */
.setup{display:grid;grid-template-columns:1fr 300px;gap:20px}
.setup .prev{
  background:var(--paper-2);border:1px solid var(--line);border-radius:10px;
  padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;
  min-height:250px;
}
.sheetprev{position:relative;background:#fff;box-shadow:0 2px 10px var(--shade);overflow:hidden}
.sheetprev .pg{position:absolute;border-right:1px dashed #B03A2E;border-bottom:1px dashed #B03A2E;box-sizing:border-box}
.sheetprev svg{position:absolute;left:0;top:0}
.prev-note{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);text-align:center;line-height:1.6}
.prev-note b{color:var(--ink);font-weight:500}
@media (max-width:760px){.setup{grid-template-columns:1fr}}

.checkline{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.checkline input{width:15px;height:15px;accent-color:var(--accent)}
.notice{
  background:var(--brass-tint);border:1px solid color-mix(in srgb,var(--brass) 30%,transparent);
  color:var(--brass);border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.55;margin-top:12px;
}
.notice b{font-weight:600}

kbd{
  font-family:var(--f-mono);font-size:10.5px;background:var(--panel-3);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-2);
}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;align-items:center;font-size:12.5px}
.keys .k{text-align:right}

/* ── toast ───────────────────────────────────────────────── */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{
  background:var(--ink);color:var(--paper);padding:8px 15px;border-radius:999px;
  font-size:12.5px;font-weight:500;box-shadow:var(--lift);
  animation:pop .22s cubic-bezier(.2,.8,.3,1);
}
.toast.warn{background:var(--danger);color:#fff}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ── chart SVG classes ───────────────────────────────────── */
#chart .card-bg{fill:var(--card);stroke:var(--line-2);stroke-width:1}
#chart .card-bg.dead{fill:var(--card-2)}
#chart .card-sel{fill:none;stroke:var(--accent);stroke-width:2.5}
#chart .stripe{fill:var(--accent);opacity:.34}
#chart .nm{fill:var(--ink);font:600 13px var(--f-ui)}
#chart .nm-sm{fill:var(--ink-2);font:400 10.5px var(--f-ui);font-style:italic}
#chart .dt{fill:var(--ink-2);font:400 10.5px var(--f-mono);letter-spacing:.01em}
#chart .mt{fill:var(--ink-3);font:400 10px var(--f-ui)}
#chart .mono-bg{fill:hsl(var(--h) 26% 85%)}
#chart .mono-tx{fill:hsl(var(--h) 32% 30%);font:600 13px var(--f-ui)}
:root[data-theme="dark"] #chart .mono-bg{fill:hsl(var(--h) 22% 30%)}
:root[data-theme="dark"] #chart .mono-tx{fill:hsl(var(--h) 38% 80%)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #chart .mono-bg{fill:hsl(var(--h) 22% 30%)}
  :root:not([data-theme="light"]) #chart .mono-tx{fill:hsl(var(--h) 38% 80%)}
}
#chart .link{fill:none;stroke:var(--line-2);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
#chart .link.cross{stroke:var(--accent-ring);stroke-dasharray:2 4;stroke-width:1.2;opacity:.85}
#chart .ulink{stroke:var(--brass);stroke-width:1.6;fill:none;opacity:.9}
#chart .ulink.div{stroke-dasharray:5 3}
#chart .uband{fill:var(--brass-tint);stroke:var(--brass);stroke-width:1}
#chart .uglyph{fill:var(--brass);font:400 11px var(--f-ui);text-anchor:middle}
#chart .uyear{fill:var(--brass);font:400 9.5px var(--f-mono);text-anchor:middle;opacity:.95}
#chart .genrule{stroke:var(--line);stroke-width:1;stroke-dasharray:1 5;stroke-linecap:round;opacity:.9}
#chart .genlab{fill:var(--ink-3);font:400 10px var(--f-mono);letter-spacing:.18em}
#chart .node{cursor:pointer}
#chart .node:hover .card-bg{stroke:var(--accent-ring)}
/* the display-list views hit-test through invisible shapes laid over the drawing */
#chart .hit{fill:transparent}
#chart .hit:hover{fill:var(--accent);fill-opacity:.12}
#chart .selring{fill:none;stroke:var(--accent);stroke-width:2.5;pointer-events:none}
#chart .title-main{fill:var(--ink);font:600 34px var(--f-disp)}
#chart .title-sub{fill:var(--ink-2);font:400 14px var(--f-ui)}
#chart .title-rule{stroke:var(--brass);stroke-width:1.5}

/* ── print ───────────────────────────────────────────────── */
#printRoot{display:none}
@media print{
  html,body{overflow:visible !important;height:auto !important;background:#fff !important}
  body>*:not(#printRoot){display:none !important}
  #printRoot{display:block}
}
#printRoot .sheet{
  position:relative;overflow:hidden;background:#fff;color:#111;
  page-break-after:always;break-after:page;
}
#printRoot .sheet:last-child{page-break-after:auto;break-after:auto}
#printRoot .clipbox{position:absolute;overflow:hidden}
#printRoot .ptitle{font:600 1em var(--f-disp);color:#141c22;margin:0;font-variation-settings:"SOFT" 22,"WONK" 1}
#printRoot .psub{font:400 1em var(--f-ui);color:#4b5a62;margin:0}
#printRoot .pfoot{font:400 1em var(--f-mono);color:#6d7a80;display:flex;justify-content:space-between;gap:14px}
#printRoot .rule{height:1px;background:#96671f}
#printRoot .crop{position:absolute;background:#9aa0a4}
/* the print sheet forces the light register palette regardless of screen theme */
#printRoot{
  --card:#fff; --card-2:#F8F8F2; --ink:#141C22; --ink-2:#4B5A62; --ink-3:#79868C;
  --line:#D3D3C6; --line-2:#B4B4A4; --hair:#E6E6DC;
  --accent:#3D6A54; --accent-ring:#8FB6A2; --accent-tint:#DFE9E2;
  --brass:#96671F; --brass-tint:#F0E5CF;
}
#printRoot .card-bg{fill:var(--card);stroke:var(--line-2);stroke-width:1}
#printRoot .card-bg.dead{fill:var(--card-2)}
#printRoot .card-sel{display:none}
#printRoot .stripe{fill:var(--accent);opacity:.34}
#printRoot .nm{fill:var(--ink);font:600 13px var(--f-ui)}
#printRoot .nm-sm{fill:var(--ink-2);font:400 10.5px var(--f-ui);font-style:italic}
#printRoot .dt{fill:var(--ink-2);font:400 10.5px var(--f-mono)}
#printRoot .mt{fill:var(--ink-3);font:400 10px var(--f-ui)}
#printRoot .mono-bg{fill:hsl(var(--h) 26% 85%)}
#printRoot .mono-tx{fill:hsl(var(--h) 32% 30%);font:600 13px var(--f-ui)}
#printRoot .link{fill:none;stroke:var(--line-2);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
#printRoot .link.cross{stroke:var(--accent-ring);stroke-dasharray:2 4;stroke-width:1.2}
#printRoot .ulink{stroke:var(--brass);stroke-width:1.6;fill:none}
#printRoot .ulink.div{stroke-dasharray:5 3}
#printRoot .uband{fill:var(--brass-tint);stroke:var(--brass);stroke-width:1}
#printRoot .uglyph{fill:var(--brass);font:400 11px var(--f-ui);text-anchor:middle}
#printRoot .uyear{fill:var(--brass);font:400 9.5px var(--f-mono);text-anchor:middle}
#printRoot .genrule{stroke:var(--line);stroke-width:1;stroke-dasharray:1 5;stroke-linecap:round}
#printRoot .genlab{fill:var(--ink-3);font:400 10px var(--f-mono);letter-spacing:.18em}
#printRoot .title-main{fill:var(--ink);font:600 34px var(--f-disp)}
#printRoot .title-sub{fill:var(--ink-2);font:400 14px var(--f-ui)}
#printRoot .title-rule{stroke:var(--brass);stroke-width:1.5}
/* the same palette is used inside the on-screen sheet preview */
.sheetprev{--card:#fff;--card-2:#F8F8F2;--ink:#141C22;--ink-2:#4B5A62;--ink-3:#79868C;
  --line:#D3D3C6;--line-2:#B4B4A4;--accent:#3D6A54;--accent-ring:#8FB6A2;--brass:#96671F;--brass-tint:#F0E5CF}
.sheetprev .card-bg{fill:var(--card);stroke:var(--line-2)}
.sheetprev .card-bg.dead{fill:var(--card-2)}
.sheetprev .card-sel{display:none}
.sheetprev .stripe{fill:var(--accent);opacity:.34}
.sheetprev .nm{fill:var(--ink);font:600 13px var(--f-ui)}
.sheetprev .nm-sm{fill:var(--ink-2);font:400 10.5px var(--f-ui);font-style:italic}
.sheetprev .dt{fill:var(--ink-2);font:400 10.5px var(--f-mono)}
.sheetprev .mt{fill:var(--ink-3);font:400 10px var(--f-ui)}
.sheetprev .mono-bg{fill:hsl(var(--h) 26% 85%)}
.sheetprev .mono-tx{fill:hsl(var(--h) 32% 30%);font:600 13px var(--f-ui)}
.sheetprev .link{fill:none;stroke:var(--line-2);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.sheetprev .link.cross{stroke:var(--accent-ring);stroke-dasharray:2 4}
.sheetprev .ulink{stroke:var(--brass);stroke-width:1.6;fill:none}
.sheetprev .ulink.div{stroke-dasharray:5 3}
.sheetprev .uband{fill:var(--brass-tint);stroke:var(--brass)}
.sheetprev .uglyph{fill:var(--brass);font:400 11px var(--f-ui);text-anchor:middle}
.sheetprev .uyear{fill:var(--brass);font:400 9.5px var(--f-mono);text-anchor:middle}
.sheetprev .genrule{stroke:var(--line);stroke-dasharray:1 5}
.sheetprev .genlab{fill:var(--ink-3);font:400 10px var(--f-mono)}
.sheetprev .title-main{fill:var(--ink);font:600 34px var(--f-disp)}
.sheetprev .title-sub{fill:var(--ink-2);font:400 14px var(--f-ui)}
.sheetprev .title-rule{stroke:var(--brass);stroke-width:1.5}

/* ── responsive ──────────────────────────────────────────── */
.only-narrow{display:none}
@media (max-width:1000px){
  #app,#app.insp-open,#app.rail-hidden{grid-template-columns:minmax(0,1fr);grid-template-areas:"bar" "stage"}
  .rail,.insp{
    position:fixed;top:54px;bottom:0;width:min(88vw,320px);z-index:40;
    box-shadow:0 0 40px -8px var(--shade);
  }
  .rail{left:0;transform:translateX(-101%);transition:transform .22s cubic-bezier(.2,.7,.3,1)}
  .insp{right:0;transform:translateX(101%);transition:transform .22s cubic-bezier(.2,.7,.3,1)}
  #app:not(.rail-hidden) .rail{transform:none}
  #app.insp-open .insp{transform:none}
  .only-narrow{display:inline-flex}
  .hide-narrow{display:none !important}
  .legend,.credit{display:none}
}
</style>
</head>
<body>

<div id="app" class="rail-hidden">

  <!-- ── top bar ─────────────────────────────────────────── -->
  <header class="bar">
    <button class="btn icon ghost only-narrow" id="btnRail" title="People" aria-label="People list">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
    </button>
    <div class="brand">
      <!-- lineage sigil: a union bar with three descenders -->
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <circle cx="6.5" cy="4.5" r="2.6" stroke="var(--accent)" stroke-width="1.5"/>
        <circle cx="15.5" cy="4.5" r="2.6" stroke="var(--accent)" stroke-width="1.5"/>
        <path d="M9.1 4.5h3.8M11 4.5v5M3.5 17.5v-3.6a1 1 0 0 1 1-1h13a1 1 0 0 1 1 1v3.6M11 9.5v4.4" stroke="var(--brass)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <h1>Heirloom</h1>
      <span class="tag hide-narrow">Family register</span>
    </div>

    <div class="bar-sep hide-narrow"></div>

    <div class="seg" role="group" aria-label="View">
      <button id="vChart" aria-pressed="true" title="Register chart — the full record">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5.6" y="1.6" width="4.8" height="3.2" rx=".7"/><rect x="1.4" y="11.2" width="4.4" height="3.2" rx=".7"/><rect x="10.2" y="11.2" width="4.4" height="3.2" rx=".7"/><path d="M8 4.8v3.4M3.6 11.2V8.2h8.8v3" stroke-linecap="round"/></svg>
        <span class="lab">Chart</span></button>
      <button id="vTree" aria-pressed="false" title="Tree — names on branches">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 14.5V7M8 7C8 7 5.2 5.9 4 3.4M8 7c0-.1 2.6-1.1 3.9-3.7"/><circle cx="3.4" cy="2.4" r="1.5"/><circle cx="12.5" cy="2.4" r="1.5"/><circle cx="8" cy="6.4" r="1.3"/></svg>
        <span class="lab">Tree</span></button>
      <button id="vFan" aria-pressed="false" title="Fan — a radial chart">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 12.5a6 6 0 0 1 12 0" stroke-linecap="round"/><path d="M5.3 12.5a2.7 2.7 0 0 1 5.4 0" stroke-linecap="round"/><path d="M8 12.5V9.8M5.2 8.1l1.9 1.9M10.8 8.1 8.9 10" stroke-linecap="round"/></svg>
        <span class="lab">Fan</span></button>
      <button id="vTime" aria-pressed="false" title="Timeline — lifespans across the years">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 3.4h9M2 8h12M2 12.6h6.5"/><circle cx="12.6" cy="3.4" r="1.1"/><circle cx="10.4" cy="12.6" r="1.1"/></svg>
        <span class="lab">Timeline</span></button>
      <button id="vList" aria-pressed="false" title="Register — a numbered list to hand round">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M6 3.6h8M6 8h8M6 12.4h8M2.3 3.6h.9M2.3 8h.9M2.3 12.4h.9"/></svg>
        <span class="lab">Register</span></button>
    </div>

    <div class="bar-sep hide-narrow"></div>

    <span class="selwrap hide-narrow">
      <select id="scope" aria-label="Who to include">
        <option value="desc">Descendants of…</option>
        <option value="anc">Ancestors of…</option>
        <option value="all">Everyone</option>
      </select>
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6.5 8 10.5l4-4"/></svg>
    </span>
    <button class="btn hide-narrow" id="btnFocus" title="Choose whose tree to draw">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="5.5" r="2.8"/><path d="M2.8 13.5a5.2 5.2 0 0 1 10.4 0" stroke-linecap="round"/></svg>
      <span id="focusName">—</span>
    </button>

    <div class="bar-spring"></div>

    <button class="btn" id="btnAdd">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      <span class="hide-narrow">Add person</span>
    </button>
    <button class="btn" id="btnFile" title="Save, open, sample data">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2.5 4.2A1.2 1.2 0 0 1 3.7 3h2.4l1.3 1.6h4.9A1.2 1.2 0 0 1 13.5 5.8v6A1.2 1.2 0 0 1 12.3 13H3.7a1.2 1.2 0 0 1-1.2-1.2z"/></svg>
      <span class="hide-narrow">File</span>
    </button>
    <button class="btn primary" id="btnPrint">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4.5 6V2.5h7V6M4.5 11.5H3.2A1.2 1.2 0 0 1 2 10.3V7.2A1.2 1.2 0 0 1 3.2 6h9.6A1.2 1.2 0 0 1 14 7.2v3.1a1.2 1.2 0 0 1-1.2 1.2h-1.3M4.5 9.5h7v4h-7z"/></svg>
      <span class="hide-narrow">Print &amp; export</span>
    </button>
    <div class="bar-sep hide-narrow"></div>
    <button class="btn icon ghost hide-narrow" id="btnTheme" title="Light / dark" aria-label="Toggle light or dark">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.4v1.5M8 13.1v1.5M14.6 8h-1.5M2.9 8H1.4M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1M12.7 12.7l-1.1-1.1M4.4 4.4L3.3 3.3" stroke-linecap="round"/></svg>
    </button>
    <button class="btn icon ghost hide-narrow" id="btnHelp" title="Keyboard shortcuts" aria-label="Help">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.2"/><path d="M6.3 6.2a1.75 1.75 0 1 1 2.4 1.63c-.45.2-.7.6-.7 1.1v.3" stroke-linecap="round"/><circle cx="8" cy="11.4" r=".75" fill="currentColor" stroke="none"/></svg>
    </button>
  </header>

  <!-- ── people rail ─────────────────────────────────────── -->
  <aside class="rail" aria-label="People">
    <div class="rail-head">
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="7" cy="7" r="4.3"/><path d="M10.2 10.2 14 14" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Find a person…" autocomplete="off">
      </div>
      <div class="rail-meta"><span id="railCount">0 people</span><span id="railGens">—</span></div>
    </div>
    <div class="rail-list" id="railList"></div>
  </aside>

  <!-- ── stage ───────────────────────────────────────────── -->
  <main class="stage" id="stage">
    <svg id="chart" role="img" aria-label="Family tree chart"></svg>

    <div class="stage-empty" id="stageEmpty" hidden>
      <div class="in">
        <svg width="40" height="40" viewBox="0 0 22 22" fill="none" style="opacity:.7">
          <circle cx="6.5" cy="4.5" r="2.6" stroke="var(--accent)" stroke-width="1.3"/>
          <circle cx="15.5" cy="4.5" r="2.6" stroke="var(--accent)" stroke-width="1.3"/>
          <path d="M9.1 4.5h3.8M11 4.5v5M3.5 17.5v-3.6a1 1 0 0 1 1-1h13a1 1 0 0 1 1 1v3.6M11 9.5v4.4" stroke="var(--brass)" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <h2>Start with one person</h2>
        <p>Add someone, then hang their partner, children and parents off them. The chart redraws itself as you go.</p>
        <button class="btn primary" id="emptyAdd">Add the first person</button>
        <div style="margin-top:12px"><button class="btn ghost sm" id="emptySample">or load the sample family</button></div>
      </div>
    </div>

    <div class="sample-flag" id="sampleFlag" hidden>
      Showing a sample family
      <button id="flagClear">Start my own</button>
    </div>

    <div class="dock zoom">
      <button id="zOut" title="Zoom out (−)" aria-label="Zoom out"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.5 8h9"/></svg></button>
      <span class="z mono" id="zLabel">100%</span>
      <button id="zIn" title="Zoom in (+)" aria-label="Zoom in"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
      <div class="bar-sep" style="height:18px;margin:0 3px"></div>
      <button id="zFit" title="Fit to screen (F)" aria-label="Fit to screen"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
      <div class="bar-sep" style="height:18px;margin:0 3px"></div>
      <button id="tPhoto" title="Card detail" aria-label="Card detail"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.2" y="3.5" width="11.6" height="9" rx="1.4"/><circle cx="5.6" cy="7" r="1.3"/><path d="M2.6 11.4 6 8.9l2.2 1.7M9.4 6.5h3M9.4 9h3" stroke-linecap="round"/></svg></button>
      <button id="tGens" title="Generation bands" aria-pressed="true" aria-label="Generation bands"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12" stroke-dasharray="1 3"/></svg></button>
    </div>

    <div class="credit">Stunity tech — by Prateek</div>

    <div class="legend" aria-hidden="true">
      <span><b>∗</b> born</span>
      <span><b>†</b> died</span>
      <span><b>⚭</b> married</span>
      <span><b>⚮</b> divorced</span>
    </div>
  </main>

  <!-- ── inspector ───────────────────────────────────────── -->
  <aside class="insp" id="insp" aria-label="Person details">
    <div class="insp-head">
      <div class="av" id="ihAv"></div>
      <div style="flex:1;min-width:0">
        <h2 id="ihName">—</h2>
        <div class="sub" id="ihSub"></div>
      </div>
      <button class="btn icon ghost" id="ihClose" title="Close" aria-label="Close details">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="insp-body" id="inspBody"></div>
  </aside>
</div>

<!-- ── modals ────────────────────────────────────────────── -->
<div class="scrim" id="scrim" hidden><div id="modalMount"></div></div>
<div id="toasts" aria-live="polite"></div>
<div id="printRoot"></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════
   Heirloom — a printable family register
   Stunity tech · by Prateek
   ═══════════════════════════════════════════════════════════ */

/* ── constants ─────────────────────────────────────────── */
const CARD = {
  compact : {w:172, h:50,  photo:false},
  standard: {w:194, h:74,  photo:false},
  portrait: {w:206, h:92,  photo:true }
};
const GAP_SPOUSE = 40;   // room for the union band
const GAP_SIB    = 26;   // between sibling subtrees
const GAP_GROUP  = 44;   // between child groups of different unions
const GAP_TREE   = 90;   // between unrelated trees in "Everyone"
const GEN_V      = 92;   // vertical space between generations
const GUTTER     = 62;   // left gutter for generation numerals
const PAD        = 40;   // padding around the whole chart
const MM         = 96 / 25.4;
const MAX_DEPTH  = 40;

const PAPERS = {
  A4     : [210, 297], A3: [297, 420], A2: [420, 594], A1: [594, 841], A0:[841,1189],
  Letter : [215.9, 279.4], Tabloid: [279.4, 431.8]
};
const ROMAN = [[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],
               [50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
const ANC_LABELS = ["SUBJECT","PARENTS","GRANDPARENTS","GREAT-GRANDPARENTS",
                    "2× GREAT-GRANDPARENTS","3× GREAT-GRANDPARENTS","4× GREAT-GRANDPARENTS"];

/* colours mirrored from the CSS tokens, for the canvas (PNG) renderer */
const PAL = {
  light:{paper:"#FFFFFF",card:"#FFFFFF",card2:"#F8F8F2",ink:"#141C22",ink2:"#4B5A62",ink3:"#79868C",
         line:"#D3D3C6",line2:"#B4B4A4",accent:"#3D6A54",ring:"#8FB6A2",brass:"#96671F",brassT:"#F0E5CF",
         bark:"#8A7350",monoL:85,monoS:26,monoTL:30,monoTS:32},
  dark :{paper:"#121618",card:"#222A2D",card2:"#1C2427",ink:"#E6EAE5",ink2:"#A2AFAC",ink3:"#73807E",
         line:"#323C3E",line2:"#455052",accent:"#7FBF9C",ring:"#4E7A64",brass:"#D2A25E",brassT:"#2E2617",
         bark:"#6E5C42",monoL:30,monoS:22,monoTL:80,monoTS:38}
};
/* type families, shared by the SVG serialiser and the canvas painter */
const FAM = {ui:'"Public Sans",sans-serif', mono:'"IBM Plex Mono",monospace', disp:'"Fraunces",Georgia,serif'};

/* ── state ─────────────────────────────────────────────── */
const KEY = "heirloom.v1";
let S = blankDoc();
let ui = {
  view:"chart", mode:"desc", focus:null, sel:null, style:"standard", gens:true,
  z:1, tx:0, ty:0, query:"", isSample:false, dirty:false
};
let LAY = null;                 // last computed layout
let DL  = null;                 // downloads capability, if the host grants one
const undoStack = [], redoStack = [];

function blankDoc(){
  return {people:{}, unions:{}, meta:{title:"", subtitle:"", note:""}, seq:1};
}
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nid = p => p + (S.seq++);

/* ── model helpers ─────────────────────────────────────── */
function P(id){ return S.people[id] || null; }
function U(id){ return S.unions[id] || null; }
function fullName(p){
  if(!p) return "Unknown";
  const n = [p.first, p.last].filter(Boolean).join(" ").trim();
  return n || "Unnamed";
}
function yearOf(v){
  if(!v) return "";
  const m = String(v).match(/\b(1\d{3}|20\d{2})\b/);
  return m ? m[1] : String(v).trim();
}
function lifeLine(p){
  const b = yearOf(p.birth), d = yearOf(p.death);
  if(b && d) return "∗" + b + "  †" + d;
  if(b) return "∗" + b;
  if(d) return "†" + d;
  return p.dead ? "†" : "";
}
function isDead(p){ return !!(p.death || p.dead); }
function initials(p){
  const a = (p.first||"").trim()[0] || "";
  const b = (p.last ||"").trim()[0] || "";
  return (a + b).toUpperCase() || "?";
}
function hueOf(p){
  const s = (p.last || p.first || p.id || "x").toLowerCase();
  let h = 0; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % 360;
  return (h * 7) % 360;
}
function buildIndex(){
  const idx = {};
  for(const id in S.people) idx[id] = {unions:[], childOf:null, kids:[]};
  for(const uid in S.unions){
    const u = S.unions[uid];
    if(u.a && idx[u.a]) idx[u.a].unions.push(uid);
    if(u.b && idx[u.b]) idx[u.b].unions.push(uid);
    (u.children||[]).forEach(k => { if(idx[k]){ idx[k].childOf = uid; } });
  }
  for(const id in idx){
    const u = idx[id].childOf ? U(idx[id].childOf) : null;
    idx[id].parents = u ? [u.a, u.b].filter(x => x && S.people[x]) : [];
    idx[id].kids = idx[id].unions.flatMap(uid => (U(uid).children||[]).filter(k=>S.people[k]));
  }
  return idx;
}
function partnerOf(u, pid){ return u.a === pid ? u.b : u.a; }

/* ── mutation + undo ───────────────────────────────────── */
function snapshot(){
  undoStack.push(JSON.stringify(S));
  if(undoStack.length > 60) undoStack.shift();
  redoStack.length = 0;
}
function commit(label){
  ui.dirty = true;
  save();
  render();
  if(label) toast(label);
}
function undo(){
  if(!undoStack.length) return toast("Nothing to undo");
  redoStack.push(JSON.stringify(S));
  S = JSON.parse(undoStack.pop());
  if(ui.sel && !P(ui.sel)) ui.sel = null;
  if(ui.focus && !P(ui.focus)) ui.focus = null;
  save(); render(); toast("Undone");
}
function redo(){
  if(!redoStack.length) return toast("Nothing to redo");
  undoStack.push(JSON.stringify(S));
  S = JSON.parse(redoStack.pop());
  save(); render(); toast("Redone");
}

function addPerson(fields){
  const id = nid("p");
  S.people[id] = Object.assign({
    id, first:"", last:"", maiden:"", sex:"", birth:"", death:"", dead:false,
    place:"", occupation:"", notes:"", photo:""
  }, fields||{});
  return id;
}
function addUnion(a, b, fields){
  const id = nid("u");
  S.unions[id] = Object.assign({id, a:a||null, b:b||null, status:"married",
                                date:"", place:"", divorced:false, children:[]}, fields||{});
  return id;
}
function deletePerson(id){
  delete S.people[id];
  for(const uid of Object.keys(S.unions)){
    const u = S.unions[uid];
    if(u.a === id) u.a = null;
    if(u.b === id) u.b = null;
    u.children = (u.children||[]).filter(k => k !== id);
    // a union with neither partner nor children has nothing left to say
    if(!u.a && !u.b && !u.children.length) delete S.unions[uid];
  }
  if(ui.sel === id) ui.sel = null;
  if(ui.focus === id) ui.focus = null;
}
/** Union between a and b, creating one if needed. */
function unionBetween(a, b, create){
  for(const uid in S.unions){
    const u = S.unions[uid];
    if((u.a===a && u.b===b) || (u.a===b && u.b===a)) return uid;
  }
  return create ? addUnion(a, b) : null;
}
/** The union a person is a child of, creating a parent union if asked. */
function parentUnion(id, create){
  for(const uid in S.unions) if((S.unions[uid].children||[]).includes(id)) return uid;
  if(!create) return null;
  const uid = addUnion(null, null);
  S.unions[uid].children.push(id);
  return uid;
}

/* ═══════════════════════════════════════════════════════════
   LAYOUT
   Blocks pack side by side, so subtrees can never collide.
   Each block reports its width and the x of its head person,
   which is what the parent's descent line drops onto.
   ═══════════════════════════════════════════════════════════ */
function layout(cardOverride){
  const idx = buildIndex();
  const C   = cardOverride || CARD[ui.style];
  const ctx = {idx, C, placed:new Set(), usedU:new Set(), nodes:[], links:[], bands:[], cross:[]};
  const ids = Object.keys(S.people);
  if(!ids.length) return null;

  if(ui.mode === "anc" && ui.focus && P(ui.focus)){
    return finish(layoutAncestors(ctx, ui.focus), ctx, true);
  }

  let roots;
  if(ui.mode === "desc" && ui.focus && P(ui.focus)){
    roots = [ui.focus];
  } else {
    roots = ids.filter(id => !idx[id].childOf);
    roots.sort((a,b) => (parseInt(yearOf(P(a).birth)) || 9999) - (parseInt(yearOf(P(b).birth)) || 9999));
    if(!roots.length) roots = [ids[0]];
  }

  let ox = 0, any = false;
  for(const r of roots){
    if(ctx.placed.has(r)) continue;
    const blk = build(r, 0, ctx);
    apply(blk, ox, ctx);
    ox += blk.width + GAP_TREE;
    any = true;
  }
  // anything left over (data with a cycle, or an orphan spouse) still gets drawn
  for(const id of ids){
    if(ctx.placed.has(id)) continue;
    const blk = build(id, 0, ctx);
    apply(blk, ox, ctx);
    ox += blk.width + GAP_TREE;
    any = true;
  }
  if(!any) return null;
  return finish(null, ctx, false);
}

/** Build one subtree, in coordinates local to the block. */
function build(pid, depth, ctx){
  ctx.placed.add(pid);
  const C = ctx.C;
  const members = [{pid, x:0, depth}];
  const umeta   = [];
  let cursor = C.w;

  if(depth < MAX_DEPTH){
    const unions = ctx.idx[pid].unions.filter(uid => !ctx.usedU.has(uid));
    for(const uid of unions){
      ctx.usedU.add(uid);
      const u  = U(uid);
      const sp = partnerOf(u, pid);
      if(sp && S.people[sp] && !ctx.placed.has(sp)){
        ctx.placed.add(sp);
        const x = cursor + GAP_SPOUSE;
        members.push({pid:sp, x, depth});
        umeta.push({uid, mid:(cursor + x)/2, left:cursor, right:x});
        cursor = x + C.w;
      } else if(sp && S.people[sp]){
        // already drawn elsewhere on the chart — link across instead of duplicating
        umeta.push({uid, mid:C.w/2, solo:true});
        ctx.cross.push({kind:"spouse", a:pid, b:sp, uid});
      } else {
        umeta.push({uid, mid:C.w/2, solo:true});   // partner unknown
      }
    }
  }
  const headW = cursor;

  /* child groups, one per union */
  const groups = [];
  for(const m of umeta){
    const u = U(m.uid);
    const kids = (u.children||[]).filter(k => S.people[k] && !ctx.placed.has(k));
    (u.children||[]).forEach(k => {
      if(S.people[k] && ctx.placed.has(k)) ctx.cross.push({kind:"child", uid:m.uid, child:k});
    });
    if(!kids.length || depth >= MAX_DEPTH) continue;
    kids.sort((a,b) => (parseInt(yearOf(P(a).birth)) || 9999) - (parseInt(yearOf(P(b).birth)) || 9999));
    const blocks = [];
    let gw = 0;
    for(const k of kids){
      const b = build(k, depth + 1, ctx);
      b.offset = gw;
      blocks.push(b);
      gw += b.width + GAP_SIB;
    }
    gw -= GAP_SIB;
    const first = blocks[0], last = blocks[blocks.length - 1];
    groups.push({
      uid:m.uid, mid:m.mid, blocks, width:gw,
      anchorCenter: (first.offset + first.anchor + last.offset + last.anchor) / 2
    });
  }

  /* place groups under their union, nudging right to avoid overlap */
  let run = -Infinity;
  for(const g of groups){
    let left = g.mid - g.anchorCenter;
    if(left < run) left = run;
    g.left = left;
    run = left + g.width + GAP_GROUP;
  }

  let minX = 0, maxX = headW;
  for(const g of groups){ minX = Math.min(minX, g.left); maxX = Math.max(maxX, g.left + g.width); }

  const shift = -minX;
  members.forEach(m => m.x += shift);
  umeta.forEach(m => { m.mid += shift; if(m.left!=null){ m.left += shift; m.right += shift; } });
  groups.forEach(g => g.left += shift);

  return {
    pid, depth, members, umeta, groups,
    width: maxX - minX,
    anchor: members[0].x + C.w / 2,
    offset: 0
  };
}

/** Walk a built block and emit absolute nodes and links. */
function apply(blk, ox, ctx){
  const C = ctx.C, row = C.h + GEN_V;
  const y = blk.depth * row;

  blk.members.forEach(m => ctx.nodes.push({pid:m.pid, x:ox + m.x, y, depth:blk.depth}));

  for(const m of blk.umeta){
    const u = U(m.uid);
    if(!m.solo){
      ctx.bands.push({uid:m.uid, x:ox + m.mid, y: y + C.h/2,
                      x1:ox + m.left, x2:ox + m.right, divorced:!!u.divorced,
                      year:yearOf(u.date), status:u.status});
    }
    const g = blk.groups.find(g => g.uid === m.uid);
    if(!g) continue;

    const busY  = y + C.h + GEN_V * 0.55;
    const stemX = ox + m.mid;
    const stemY = m.solo ? y + C.h : y + C.h/2 + 1;
    const anchors = g.blocks.map(b => ox + g.left + b.offset + b.anchor);
    const lo = Math.min(stemX, ...anchors), hi = Math.max(stemX, ...anchors);

    ctx.links.push({d:`M${r1(stemX)} ${r1(stemY)} V${r1(busY)}`});
    if(anchors.length > 1 || Math.abs(anchors[0] - stemX) > 0.5)
      ctx.links.push({d:`M${r1(lo)} ${r1(busY)} H${r1(hi)}`});
    anchors.forEach(ax => ctx.links.push({d:`M${r1(ax)} ${r1(busY)} V${r1(y + row)}`}));

    g.blocks.forEach(b => apply(b, ox + g.left + b.offset, ctx));
  }
}

/** A pedigree chart: the subject at the foot, ancestors fanning upward. */
function layoutAncestors(ctx, rootId){
  const C = ctx.C, row = C.h + GEN_V;
  function up(pid, depth){
    ctx.placed.add(pid);
    const par = depth < 12 ? ctx.idx[pid].parents : [];
    if(!par.length) return {pid, depth, width:C.w, anchor:C.w/2, kids:[]};
    const blocks = [];
    let w = 0;
    for(const q of par){
      const b = up(q, depth + 1);
      b.offset = w; blocks.push(b); w += b.width + GAP_SPOUSE;
    }
    w -= GAP_SPOUSE;
    const mid = (blocks[0].offset + blocks[0].anchor +
                 blocks[blocks.length-1].offset + blocks[blocks.length-1].anchor) / 2;
    let self = mid - C.w/2;
    const minX = Math.min(0, self), maxX = Math.max(w, self + C.w);
    const shift = -minX;
    self += shift; blocks.forEach(b => b.offset += shift);
    return {pid, depth, width:maxX - minX, anchor:self + C.w/2, selfX:self, kids:blocks};
  }
  function emit(b, ox, maxDepth){
    const y = (maxDepth - b.depth) * row;
    const x = ox + (b.selfX != null ? b.selfX : 0);
    ctx.nodes.push({pid:b.pid, x, y, depth:maxDepth - b.depth});
    if(!b.kids.length) return;

    // the parents are a couple: give them their union band
    if(b.kids.length === 2){
      const py = y - row, uid = ctx.idx[b.pid].childOf, u = uid ? U(uid) : null;
      const px = b.kids.map(k => ox + k.offset + (k.selfX != null ? k.selfX : 0)).sort((m, n) => m - n);
      const x1 = px[0] + C.w, x2 = px[1];
      ctx.bands.push({uid, x:(x1 + x2)/2, y:py + C.h/2, x1, x2,
                      divorced:!!(u && u.divorced), year:u ? yearOf(u.date) : "",
                      status:u ? u.status : "married"});
    }
    const busY = y - GEN_V * 0.55;
    const anchors = b.kids.map(k => ox + k.offset + k.anchor);
    const cx = x + C.w/2;
    const lo = Math.min(cx, ...anchors), hi = Math.max(cx, ...anchors);
    ctx.links.push({d:`M${r1(cx)} ${r1(y)} V${r1(busY)}`});
    ctx.links.push({d:`M${r1(lo)} ${r1(busY)} H${r1(hi)}`});
    anchors.forEach(ax => ctx.links.push({d:`M${r1(ax)} ${r1(busY)} V${r1(y - GEN_V)}`}));
    b.kids.forEach(k => emit(k, ox + k.offset, maxDepth));
  }
  const tree = up(rootId, 0);
  let maxD = 0;
  (function scan(b){ maxD = Math.max(maxD, b.depth); b.kids.forEach(scan); })(tree);
  emit(tree, 0, maxD);
  return {maxD};
}

function r1(n){ return Math.round(n * 10) / 10; }

/** Turn raw nodes/links into a finished model with bounds and generation bands. */
function finish(extra, ctx, ancestors){
  const C = ctx.C;
  if(!ctx.nodes.length) return null;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for(const n of ctx.nodes){
    minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x + C.w);
    minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y + C.h);
  }
  const pos = {};
  ctx.nodes.forEach(n => { pos[n.pid] = n; });

  /* cross-family links, resolved now that everything has a position */
  const crossPaths = [];
  for(const c of ctx.cross){
    if(c.kind === "spouse"){
      const A = pos[c.a], B = pos[c.b];
      if(!A || !B) continue;
      const ax = A.x + C.w/2, ay = A.y + C.h/2, bx = B.x + C.w/2, by = B.y + C.h/2;
      crossPaths.push({d:`M${r1(ax)} ${r1(ay)} C${r1((ax+bx)/2)} ${r1(ay)} ${r1((ax+bx)/2)} ${r1(by)} ${r1(bx)} ${r1(by)}`});
    } else {
      const K = pos[c.child]; if(!K) continue;
      const u = U(c.uid);
      const A = u.a ? pos[u.a] : null, B = u.b ? pos[u.b] : null;
      const src = A && B ? {x:(A.x + B.x)/2 + C.w/2, y:Math.max(A.y,B.y) + C.h}
                : (A || B) ? {x:(A||B).x + C.w/2, y:(A||B).y + C.h} : null;
      if(!src) continue;
      const kx = K.x + C.w/2, ky = K.y;
      crossPaths.push({d:`M${r1(src.x)} ${r1(src.y)} C${r1(src.x)} ${r1((src.y+ky)/2)} ${r1(kx)} ${r1((src.y+ky)/2)} ${r1(kx)} ${r1(ky)}`});
    }
  }

  /* generation bands */
  const depths = [...new Set(ctx.nodes.map(n => n.depth))].sort((a,b)=>a-b);
  const deepest = depths[depths.length - 1];
  const rows = depths.map(d => {
    // in a pedigree the subject sits at the foot, so the labels count upward
    const step = ancestors ? deepest - d : d;
    const label = ancestors
      ? (ANC_LABELS[step] || ((step - 2) + "× GREAT-GRANDPARENTS"))
      : roman(d + 1);
    return {depth:d, y:d * (C.h + GEN_V), label, step};
  });

  const x0 = minX - PAD - GUTTER, y0 = minY - PAD;
  ctx.nodes.forEach(n => { n.w = C.w; n.h = C.h; });
  return {
    kind:"chart",
    nodes:ctx.nodes, links:ctx.links, bands:ctx.bands, cross:crossPaths, rows,
    C, ancestors,
    minX, maxX, minY, maxY,
    box:{x:x0, y:y0, w:(maxX + PAD) - x0, h:(maxY + PAD) - y0}
  };
}
function roman(n){
  let out = "", v = n;
  for(const [k, s] of ROMAN) while(v >= k){ out += s; v -= k; }
  return out;
}

/* ═══════════════════════════════════════════════════════════
   SVG RENDER
   ═══════════════════════════════════════════════════════════ */
const CW = {nm:0.545, sm:0.5, mono:0.605, mt:0.5};
function fit(s, maxPx, fs, k){
  s = String(s == null ? "" : s);
  if(!s) return "";
  const max = Math.max(1, Math.floor(maxPx / (fs * k)));
  return s.length <= max ? s : s.slice(0, Math.max(1, max - 1)).trimEnd() + "…";
}

function cardSVG(n, model, opts){
  const p = P(n.pid); if(!p) return "";
  const C = model.C, dead = isDead(p);
  const sel = opts.selectable && ui.sel === n.pid;
  const h = hueOf(p);
  let g = `<g class="node" data-id="${n.pid}" transform="translate(${r1(n.x)},${r1(n.y)})" style="--h:${h}">`;
  g += `<rect class="card-bg${dead ? " dead" : ""}" x="0" y="0" width="${C.w}" height="${C.h}" rx="7"/>`;
  g += `<path class="stripe" d="M0 7a7 7 0 0 1 7-7h0v${C.h}h0a7 7 0 0 1-7-7z" opacity="${(0.5 - Math.min(n.depth,5)*0.07).toFixed(2)}"/>`;
  if(sel) g += `<rect class="card-sel" x="-2.5" y="-2.5" width="${C.w+5}" height="${C.h+5}" rx="9"/>`;

  let tx = 12, tw = C.w - 22;
  if(C.photo){
    const s = C.h - 24, cy = C.h/2, r = s/2;
    if(p.photo){
      g += `<clipPath id="cp_${n.pid}_${opts.ns||"s"}"><circle cx="${12+r}" cy="${cy}" r="${r}"/></clipPath>`;
      g += `<image href="${esc(p.photo)}" x="${12}" y="${cy-r}" width="${s}" height="${s}" `
         + `preserveAspectRatio="xMidYMid slice" clip-path="url(#cp_${n.pid}_${opts.ns||"s"})"/>`;
      g += `<circle cx="${12+r}" cy="${cy}" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="1"/>`;
    } else {
      g += `<circle class="mono-bg" cx="${12+r}" cy="${cy}" r="${r}"/>`;
      g += `<text class="mono-tx" x="${12+r}" y="${cy+5}" text-anchor="middle" style="font-size:${Math.round(r*0.82)}px">${esc(initials(p))}</text>`;
    }
    tx = 12 + s + 12; tw = C.w - tx - 10;
  }

  const name = fullName(p);
  const life = lifeLine(p);
  if(C.h >= 74){
    g += `<text class="nm" x="${tx}" y="${C.photo ? 30 : 25}">${esc(fit(name, tw, 13, CW.nm))}</text>`;
    let cy = C.photo ? 47 : 43;
    if(p.maiden){
      g += `<text class="nm-sm" x="${tx}" y="${cy}">${esc(fit("née " + p.maiden, tw, 10.5, CW.sm))}</text>`;
      cy += 15;
    }
    if(life){ g += `<text class="dt" x="${tx}" y="${cy}">${esc(life)}</text>`; cy += 15; }
    const meta = [p.place, p.occupation].filter(Boolean).join(" · ");
    if(meta && cy <= C.h - 6)
      g += `<text class="mt" x="${tx}" y="${cy}">${esc(fit(meta, tw, 10, CW.mt))}</text>`;
  } else {
    g += `<text class="nm" x="${tx}" y="20">${esc(fit(name, tw, 13, CW.nm))}</text>`;
    if(life) g += `<text class="dt" x="${tx}" y="37">${esc(life)}</text>`;
  }
  g += `</g>`;
  return g;
}

function bandSVG(b){
  const glyph = b.divorced ? "⚮" : (b.status === "partners" ? "◇" : "⚭");
  const w = 20, h = 15;
  let s = `<path class="ulink${b.divorced ? " div" : ""}" d="M${r1(b.x1)} ${r1(b.y)} H${r1(b.x2)}"/>`;
  s += `<rect class="uband" x="${r1(b.x - w/2)}" y="${r1(b.y - h/2)}" width="${w}" height="${h}" rx="4"/>`;
  s += `<text class="uglyph" x="${r1(b.x)}" y="${r1(b.y + 4)}">${glyph}</text>`;
  if(b.year) s += `<text class="uyear" x="${r1(b.x)}" y="${r1(b.y + 22)}">${esc(b.year)}</text>`;
  return s;
}

/**
 * Build the chart's SVG innards.
 * opts: {selectable, gens, ns, title:{main,sub,note}}
 */
function chartSVG(model, opts){
  opts = opts || {};
  const C = model.C;
  let out = "";

  if(opts.gens !== false && ui.gens){
    const x1 = model.minX - 26, x2 = model.maxX + 26;
    for(const r of model.rows){
      const ry = r.y - GEN_V * 0.30;
      out += `<path class="genrule" d="M${r1(x1)} ${r1(ry)} H${r1(x2)}"/>`;
      out += `<text class="genlab" x="${r1(model.minX - 36)}" y="${r1(r.y + C.h/2 + 3)}" text-anchor="end">${esc(r.label)}</text>`;
    }
  }
  model.links.forEach(l => { out += `<path class="link" d="${l.d}"/>`; });
  model.cross.forEach(l => { out += `<path class="link cross" d="${l.d}"/>`; });
  model.bands.forEach(b => { out += bandSVG(b); });
  model.nodes.forEach(n => { out += cardSVG(n, model, opts); });

  return out;
}
/** Every view gets its heading the same way: draw it, then push the art down. */
function withTitle(inner, box, title, pal){
  if(!title || !(title.main || title.sub)) return inner;
  const tx = box.x + 4;
  let head = "";
  if(title.main) head += `<text x="${r1(tx)}" y="${r1(box.y + 34)}" fill="${pal.ink}" `
    + `font-family='${FAM.disp}' font-size="34" font-weight="600">${esc(title.main)}</text>`;
  if(title.sub)  head += `<text x="${r1(tx)}" y="${r1(box.y + 56)}" fill="${pal.ink2}" `
    + `font-family='${FAM.ui}' font-size="14">${esc(title.sub)}</text>`;
  head += `<path d="M${r1(tx)} ${r1(box.y + 68)} H${r1(box.x + box.w - 4)}" stroke="${pal.brass}" stroke-width="1.5" fill="none"/>`;
  return head + `<g transform="translate(0,72)">` + inner + `</g>`;
}
function boxWithTitle(model, hasTitle){
  const b = model.box;
  return hasTitle ? {x:b.x, y:b.y, w:b.w, h:b.h + 72} : b;
}
/** Build the SVG innards for whichever view is active. */
function viewSVG(model, opts){
  opts = opts || {};
  const pal = opts.pal || activePal();
  const inner = model.kind === "chart" ? chartSVG(model, opts) : dlToSVG(model.dl);
  return withTitle(inner, model.box, opts.title, pal);
}

function drawChart(){
  const svg = $("#chart");
  LAY = makeModel(activePal());
  const empty = !LAY;
  $("#stageEmpty").hidden = !empty;
  if(empty){ svg.innerHTML = ""; return; }
  svg.innerHTML = `<g id="vp">${viewSVG(LAY, {selectable:true, ns:"s"})}`
                + `${selRing(LAY)}${hitsSVG(LAY)}</g>`;
  applyTransform();
}
function applyTransform(){
  const vp = $("#vp");
  if(vp) vp.setAttribute("transform", `translate(${r1(ui.tx)},${r1(ui.ty)}) scale(${ui.z.toFixed(4)})`);
  $("#zLabel").textContent = Math.round(ui.z * 100) + "%";
}
function fitView(animate){
  if(!LAY) return;
  const st = $("#stage").getBoundingClientRect();
  const b = LAY.box;
  const z = Math.min((st.width - 24) / b.w, (st.height - 24) / b.h, 1.6);
  ui.z = Math.max(0.06, z);
  ui.tx = (st.width  - b.w * ui.z) / 2 - b.x * ui.z;
  ui.ty = (st.height - b.h * ui.z) / 2 - b.y * ui.z;
  applyTransform();
}
function centerOn(pid){
  if(!LAY) return;
  const n = LAY.nodes.find(n => n.pid === pid); if(!n) return;
  const st = $("#stage").getBoundingClientRect();
  ui.z = Math.max(ui.z, 0.7);
  ui.tx = st.width/2  - (n.x + (n.w || 0)/2) * ui.z;
  ui.ty = st.height/2 - (n.y + (n.h || 0)/2) * ui.z;
  applyTransform();
}

/* ═══════════════════════════════════════════════════════════
   CANVAS RENDER  — used for PNG export, where the page's own
   loaded webfonts are available (an SVG rasterised via <img>
   would silently lose them).
   ═══════════════════════════════════════════════════════════ */
function renderCanvas(model, scale, palName, title){
  const pal = PAL[palName] || PAL.light;
  const C = model.C;
  const titleH = title && (title.main || title.sub) ? 72 : 0;
  const b = model.box;
  const W = Math.max(1, Math.round(b.w * scale));
  const H = Math.max(1, Math.round((b.h + titleH) * scale));
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  x.fillStyle = pal.paper; x.fillRect(0, 0, W, H);
  x.scale(scale, scale);
  x.translate(-b.x, -b.y);

  if(titleH){
    x.fillStyle = pal.ink;
    x.font = '600 34px "Fraunces", Georgia, serif';
    x.textBaseline = "alphabetic";
    if(title.main) x.fillText(title.main, b.x + 4, b.y + 34);
    if(title.sub){
      x.fillStyle = pal.ink2;
      x.font = '400 14px "Public Sans", sans-serif';
      x.fillText(title.sub, b.x + 4, b.y + 56);
    }
    x.strokeStyle = pal.brass; x.lineWidth = 1.5;
    x.beginPath(); x.moveTo(b.x + 4, b.y + 68); x.lineTo(b.x + b.w - 4, b.y + 68); x.stroke();
    x.translate(0, 72);
  }

  if(ui.gens){
    x.strokeStyle = pal.line; x.lineWidth = 1; x.setLineDash([1, 5]); x.lineCap = "round";
    x.fillStyle = pal.ink3;
    x.font = '400 10px "IBM Plex Mono", monospace';
    x.textAlign = "end";
    for(const r of model.rows){
      const ry = r.y - GEN_V * 0.30;
      x.beginPath(); x.moveTo(model.minX - 26, ry); x.lineTo(model.maxX + 26, ry); x.stroke();
      x.fillText(r.label, model.minX - 36, r.y + C.h/2 + 3);
    }
    x.setLineDash([]); x.textAlign = "start";
  }

  x.strokeStyle = pal.line2; x.lineWidth = 1.4; x.lineJoin = "round"; x.lineCap = "round";
  model.links.forEach(l => x.stroke(new Path2D(l.d)));
  x.strokeStyle = pal.ring; x.lineWidth = 1.2; x.setLineDash([2, 4]);
  model.cross.forEach(l => x.stroke(new Path2D(l.d)));
  x.setLineDash([]);

  for(const bn of model.bands){
    x.strokeStyle = pal.brass; x.lineWidth = 1.6;
    x.setLineDash(bn.divorced ? [5, 3] : []);
    x.beginPath(); x.moveTo(bn.x1, bn.y); x.lineTo(bn.x2, bn.y); x.stroke();
    x.setLineDash([]);
    roundRect(x, bn.x - 10, bn.y - 7.5, 20, 15, 4);
    x.fillStyle = pal.brassT; x.fill(); x.strokeStyle = pal.brass; x.lineWidth = 1; x.stroke();
    x.fillStyle = pal.brass; x.textAlign = "center";
    x.font = '400 11px "Public Sans", sans-serif';
    x.fillText(bn.divorced ? "⚮" : (bn.status === "partners" ? "◇" : "⚭"), bn.x, bn.y + 4);
    if(bn.year){
      x.font = '400 9.5px "IBM Plex Mono", monospace';
      x.fillText(bn.year, bn.x, bn.y + 22);
    }
    x.textAlign = "start";
  }

  for(const n of model.nodes){
    const p = P(n.pid); if(!p) continue;
    const dead = isDead(p), h = hueOf(p);
    x.save(); x.translate(n.x, n.y);
    roundRect(x, 0, 0, C.w, C.h, 7);
    x.fillStyle = dead ? pal.card2 : pal.card; x.fill();
    x.strokeStyle = pal.line2; x.lineWidth = 1; x.stroke();

    x.save(); x.beginPath(); roundRect(x, 0, 0, C.w, C.h, 7); x.clip();
    x.globalAlpha = 0.5 - Math.min(n.depth, 5) * 0.07;
    x.fillStyle = pal.accent; x.fillRect(0, 0, 7, C.h);
    x.restore();

    let tx = 12, tw = C.w - 22;
    if(C.photo){
      const s = C.h - 24, cy = C.h/2, r = s/2;
      const img = photoCache[n.pid];
      if(p.photo && img && img.complete && img.naturalWidth){
        x.save(); x.beginPath(); x.arc(12 + r, cy, r, 0, Math.PI*2); x.clip();
        const k = Math.max(s / img.naturalWidth, s / img.naturalHeight);
        const dw = img.naturalWidth * k, dh = img.naturalHeight * k;
        x.drawImage(img, 12 + r - dw/2, cy - dh/2, dw, dh);
        x.restore();
        x.beginPath(); x.arc(12 + r, cy, r, 0, Math.PI*2);
        x.strokeStyle = pal.line2; x.lineWidth = 1; x.stroke();
      } else {
        x.beginPath(); x.arc(12 + r, cy, r, 0, Math.PI*2);
        x.fillStyle = `hsl(${h} ${pal.monoS}% ${pal.monoL}%)`; x.fill();
        x.fillStyle = `hsl(${h} ${pal.monoTS}% ${pal.monoTL}%)`;
        x.font = `600 ${Math.round(r*0.82)}px "Public Sans", sans-serif`;
        x.textAlign = "center"; x.fillText(initials(p), 12 + r, cy + 5); x.textAlign = "start";
      }
      tx = 12 + s + 12; tw = C.w - tx - 10;
    }

    const life = lifeLine(p);
    if(C.h >= 74){
      x.fillStyle = pal.ink; x.font = '600 13px "Public Sans", sans-serif';
      x.fillText(fit(fullName(p), tw, 13, CW.nm), tx, C.photo ? 30 : 25);
      let cy = C.photo ? 47 : 43;
      if(p.maiden){
        x.fillStyle = pal.ink2; x.font = 'italic 400 10.5px "Public Sans", sans-serif';
        x.fillText(fit("née " + p.maiden, tw, 10.5, CW.sm), tx, cy); cy += 15;
      }
      if(life){
        x.fillStyle = pal.ink2; x.font = '400 10.5px "IBM Plex Mono", monospace';
        x.fillText(life, tx, cy); cy += 15;
      }
      const meta = [p.place, p.occupation].filter(Boolean).join(" · ");
      if(meta && cy <= C.h - 6){
        x.fillStyle = pal.ink3; x.font = '400 10px "Public Sans", sans-serif';
        x.fillText(fit(meta, tw, 10, CW.mt), tx, cy);
      }
    } else {
      x.fillStyle = pal.ink; x.font = '600 13px "Public Sans", sans-serif';
      x.fillText(fit(fullName(p), tw, 13, CW.nm), tx, 20);
      if(life){
        x.fillStyle = pal.ink2; x.font = '400 10.5px "IBM Plex Mono", monospace';
        x.fillText(life, tx, 37);
      }
    }
    x.restore();
  }
  return cv;
}
function roundRect(x, px, py, w, h, r){
  x.beginPath();
  x.moveTo(px + r, py);
  x.arcTo(px + w, py,     px + w, py + h, r);
  x.arcTo(px + w, py + h, px,     py + h, r);
  x.arcTo(px,     py + h, px,     py,     r);
  x.arcTo(px,     py,     px + w, py,     r);
  x.closePath();
}
const photoCache = {};
function warmPhotos(){
  for(const id in S.people){
    const p = S.people[id];
    if(p.photo && !photoCache[id]){
      const img = new Image(); img.src = p.photo; photoCache[id] = img;
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   DISPLAY LIST
   The register chart above draws through CSS classes, because
   it wants the live theme. The four other views emit a flat
   list of primitives instead, which both an SVG serialiser and
   a canvas painter consume — so each new view gets print, PDF,
   PNG and SVG export without a renderer of its own.
   ═══════════════════════════════════════════════════════════ */
function activePal(){
  const t = document.documentElement.getAttribute("data-theme");
  const dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme:dark)").matches;
  return dark ? PAL.dark : PAL.light;
}
function mix(a, b, t){
  const rgb = s => {
    s = s.replace("#", "");
    if(s.length === 3) s = s.split("").map(c => c + c).join("");
    return [parseInt(s.slice(0,2),16), parseInt(s.slice(2,4),16), parseInt(s.slice(4,6),16)];
  };
  const A = rgb(a), B = rgb(b), k = clamp(t, 0, 1);
  return "#" + [0,1,2].map(i =>
    Math.round(A[i] + (B[i] - A[i]) * k).toString(16).padStart(2, "0")).join("");
}

/* text measured against the page's own loaded faces, not guessed */
let _mctx = null;
function fontStr(size, fam, weight, italic){
  return `${italic ? "italic " : ""}${weight || 400} ${size}px ${FAM[fam || "ui"]}`;
}
function measure(s, size, fam, weight, italic){
  if(!_mctx) _mctx = document.createElement("canvas").getContext("2d");
  _mctx.font = fontStr(size, fam, weight, italic);
  return _mctx.measureText(String(s == null ? "" : s)).width;
}
function fitTo(s, max, size, fam, weight){
  s = String(s == null ? "" : s);
  if(!s || measure(s, size, fam, weight) <= max) return s;
  let lo = 0, hi = s.length;
  while(lo < hi){
    const mid = (lo + hi + 1) >> 1;
    if(measure(s.slice(0, mid) + "…", size, fam, weight) <= max) lo = mid; else hi = mid - 1;
  }
  return lo <= 0 ? "" : s.slice(0, lo).trimEnd() + "…";
}

function dlToSVG(dl){
  let s = "";
  for(const o of dl){
    const op   = (o.alpha != null && o.alpha !== 1) ? ` opacity="${o.alpha}"` : "";
    const st   = o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 1}"` : "";
    const dash = o.dash ? ` stroke-dasharray="${o.dash}"` : "";
    const cap  = o.cap ? ` stroke-linecap="${o.cap}"` : "";
    const join = o.join ? ` stroke-linejoin="${o.join}"` : "";
    const fill = ` fill="${o.fill || "none"}"`;
    const rot  = o.rot ? ` transform="rotate(${r1(o.rot)} ${r1(o.rx || o.x || 0)} ${r1(o.ry || o.y || 0)})"` : "";
    if(o.t === "rect")
      s += `<rect x="${r1(o.x)}" y="${r1(o.y)}" width="${r1(o.w)}" height="${r1(o.h)}" rx="${o.r || 0}"${fill}${st}${dash}${rot}${op}/>`;
    else if(o.t === "circle")
      s += `<circle cx="${r1(o.cx)}" cy="${r1(o.cy)}" r="${r1(o.r)}"${fill}${st}${op}/>`;
    else if(o.t === "path")
      s += `<path d="${o.d}"${fill}${st}${dash}${cap}${join}${rot}${op}/>`;
    else if(o.t === "text"){
      const an = o.anchor && o.anchor !== "start" ? ` text-anchor="${o.anchor}"` : "";
      const ls = o.ls ? ` letter-spacing="${o.ls}"` : "";
      const it = o.italic ? ` font-style="italic"` : "";
      s += `<text x="${r1(o.x)}" y="${r1(o.y)}" fill="${o.fill}" font-family='${FAM[o.fam || "ui"]}'`
         + ` font-size="${o.size}" font-weight="${o.weight || 400}"${an}${ls}${it}${rot}${op}>${esc(o.s)}</text>`;
    }
  }
  return s;
}
function dlPaint(x, dl){
  for(const o of dl){
    x.save();
    if(o.alpha != null) x.globalAlpha = o.alpha;
    if(o.dash) x.setLineDash(String(o.dash).split(/[\s,]+/).map(Number));
    if(o.cap)  x.lineCap = o.cap;
    if(o.join) x.lineJoin = o.join;
    if(o.rot){
      const rx = o.rx != null ? o.rx : (o.x || 0), ry = o.ry != null ? o.ry : (o.y || 0);
      x.translate(rx, ry); x.rotate(o.rot * Math.PI / 180); x.translate(-rx, -ry);
    }
    if(o.t === "rect"){
      roundRect(x, o.x, o.y, o.w, o.h, o.r || 0);
      if(o.fill){ x.fillStyle = o.fill; x.fill(); }
      if(o.stroke){ x.strokeStyle = o.stroke; x.lineWidth = o.sw || 1; x.stroke(); }
    } else if(o.t === "circle"){
      x.beginPath(); x.arc(o.cx, o.cy, Math.max(0, o.r), 0, Math.PI * 2);
      if(o.fill){ x.fillStyle = o.fill; x.fill(); }
      if(o.stroke){ x.strokeStyle = o.stroke; x.lineWidth = o.sw || 1; x.stroke(); }
    } else if(o.t === "path"){
      const p = new Path2D(o.d);
      if(o.fill){ x.fillStyle = o.fill; x.fill(p); }
      if(o.stroke){ x.strokeStyle = o.stroke; x.lineWidth = o.sw || 1; x.stroke(p); }
    } else if(o.t === "text"){
      x.fillStyle = o.fill;
      x.font = fontStr(o.size, o.fam, o.weight, o.italic);
      x.textAlign = o.anchor === "middle" ? "center" : (o.anchor === "end" ? "right" : "left");
      try { x.letterSpacing = o.ls || "0px"; } catch(e){}
      x.fillText(o.s, o.x, o.y);
    }
    x.restore();
  }
}
function renderCanvasDL(model, scale, palName, title){
  const pal = PAL[palName] || PAL.light;
  const titleH = title && (title.main || title.sub) ? 72 : 0;
  const b = model.box;
  const cv = document.createElement("canvas");
  cv.width  = Math.max(1, Math.round(b.w * scale));
  cv.height = Math.max(1, Math.round((b.h + titleH) * scale));
  const x = cv.getContext("2d");
  x.fillStyle = pal.paper; x.fillRect(0, 0, cv.width, cv.height);
  x.scale(scale, scale);
  x.translate(-b.x, -b.y);
  if(titleH){
    x.fillStyle = pal.ink; x.font = '600 34px ' + FAM.disp;
    if(title.main) x.fillText(title.main, b.x + 4, b.y + 34);
    if(title.sub){ x.fillStyle = pal.ink2; x.font = '400 14px ' + FAM.ui; x.fillText(title.sub, b.x + 4, b.y + 56); }
    x.strokeStyle = pal.brass; x.lineWidth = 1.5;
    x.beginPath(); x.moveTo(b.x + 4, b.y + 68); x.lineTo(b.x + b.w - 4, b.y + 68); x.stroke();
    x.translate(0, 72);
  }
  dlPaint(x, model.dl);
  return cv;
}

/* small shapes the views share */
function taper(x1, y1, x2, y2, w1, w2){
  const m1 = y1 + (y2 - y1) * 0.42, m2 = y1 + (y2 - y1) * 0.74;
  return `M${r1(x1 - w1/2)} ${r1(y1)} C${r1(x1 - w1/2)} ${r1(m1)} ${r1(x2 - w2/2)} ${r1(m2)} ${r1(x2 - w2/2)} ${r1(y2)} `
       + `L${r1(x2 + w2/2)} ${r1(y2)} C${r1(x2 + w2/2)} ${r1(m2)} ${r1(x1 + w1/2)} ${r1(m1)} ${r1(x1 + w1/2)} ${r1(y1)} Z`;
}
function almond(cx, cy, L, W){
  return `M${r1(cx)} ${r1(cy - L/2)} C${r1(cx + W/2)} ${r1(cy - L/6)} ${r1(cx + W/2)} ${r1(cy + L/6)} ${r1(cx)} ${r1(cy + L/2)} `
       + `C${r1(cx - W/2)} ${r1(cy + L/6)} ${r1(cx - W/2)} ${r1(cy - L/6)} ${r1(cx)} ${r1(cy - L/2)} Z`;
}
function sector(cx, cy, ri, ro, a0, a1){
  const pt = (r, a) => [cx + r * Math.cos(a * Math.PI/180), cy + r * Math.sin(a * Math.PI/180)];
  const big = (a1 - a0) > 180 ? 1 : 0;
  const [x1,y1] = pt(ri, a0), [x2,y2] = pt(ri, a1), [x3,y3] = pt(ro, a1), [x4,y4] = pt(ro, a0);
  return `M${r1(x1)} ${r1(y1)} A${r1(ri)} ${r1(ri)} 0 ${big} 1 ${r1(x2)} ${r1(y2)} `
       + `L${r1(x3)} ${r1(y3)} A${r1(ro)} ${r1(ro)} 0 ${big} 0 ${r1(x4)} ${r1(y4)} Z`;
}
const upsideDown = a => { const m = ((a % 360) + 360) % 360; return m > 90 && m < 270; };
const byBirth = (a, b) => (parseInt(yearOf(P(a).birth)) || 9999) - (parseInt(yearOf(P(b).birth)) || 9999);

/* ── TREE ──────────────────────────────────────────────────
   The same layout engine, drawn as a thing that grew: the
   founding couple at the root, branches thickening in
   proportion to how many descendants they carry.
   ──────────────────────────────────────────────────────── */
const TREE_CARD = {w:172, h:32, photo:false};
const TREE_ROW  = 152;

function treeView(pal){
  const base = layout(TREE_CARD);
  if(!base) return null;
  const idx = buildIndex(), C = TREE_CARD;
  const pos = {}; base.nodes.forEach(n => { pos[n.pid] = n; });
  const maxD = base.nodes.reduce((m, n) => Math.max(m, n.depth), 0);
  const rowY = d => (maxD - d) * TREE_ROW;

  const mate = {};
  for(const b of base.bands){
    const u = U(b.uid);
    if(!u || !u.a || !u.b || !pos[u.a] || !pos[u.b]) continue;
    (mate[u.a] = mate[u.a] || []).push({pid:u.b, u});
    (mate[u.b] = mate[u.b] || []).push({pid:u.a, u});
  }

  /* one pill per person and whoever they married — the hub of a
     remarriage claims its cell first, so nobody is drawn twice */
  const cellOf = {}, cells = [];
  const order = base.nodes.slice().sort((a, b) =>
    ((mate[b.pid] || []).length - (mate[a.pid] || []).length) || (a.x - b.x));
  for(const n of order){
    if(cellOf[n.pid]) continue;
    const members = [n.pid];
    for(const m of (mate[n.pid] || [])) if(!cellOf[m.pid]) members.push(m.pid);
    members.sort((p, q) => pos[p].x - pos[q].x);
    const cell = {members, depth:n.depth, y:rowY(n.depth), h:30,
                  x: members.reduce((s, p) => s + pos[p].x + C.w/2, 0) / members.length};
    members.forEach(p => { cellOf[p] = cell; });
    cells.push(cell);
  }

  const NSZ = 13, SSZ = 12;
  const runWidth = r => measure(r.s, r.sep ? SSZ : NSZ, "ui", r.sep ? 400 : 600);
  for(const cell of cells){
    const runs = [];
    cell.members.forEach((pid, i) => {
      if(i){
        const prev = cell.members[i-1];
        const rel = (mate[prev] || []).find(m => m.pid === pid);
        const u = rel && rel.u;
        runs.push({sep:true, s: u && u.divorced ? "⚮" : (u && u.status === "partners" ? "◇" : "⚭")});
      }
      runs.push({pid, s: fullName(P(pid))});
    });
    const total = rs => rs.reduce((t, r) => t + runWidth(r) + 9, 0) + 6;
    if(total(runs) > 330)                       // trim to first names before it sprawls
      runs.forEach((r, i) => { if(!r.sep && i > 0) r.s = P(r.pid).first || r.s; });
    cell.runs = runs;
    cell.w = Math.max(74, total(runs));
    let rx = cell.x - cell.w/2 + 6;
    for(const r of runs){ r.w = runWidth(r); r.x = rx; rx += r.w + 9; }
  }

  const dcount = {};
  function desc(pid){
    if(dcount[pid] != null) return dcount[pid];
    dcount[pid] = 0;                               // also guards against a data loop
    let n = 0;
    for(const uid of idx[pid].unions)
      for(const k of (U(uid).children || [])) if(S.people[k]) n += 1 + desc(k);
    dcount[pid] = n;
    return n;
  }
  const weight = c => clamp(3 + Math.sqrt(Math.max.apply(null, c.members.map(desc))) * 2.9, 3, 30);

  const edges = [], hasKids = new Set();
  for(const uid in S.unions){
    const u = S.unions[uid];
    const src = cellOf[u.a] || cellOf[u.b];
    if(!src) continue;
    for(const k of (u.children || [])){
      const dst = cellOf[k];
      if(dst && dst !== src && dst.depth > src.depth){ edges.push({src, dst}); hasKids.add(src); }
    }
  }

  const dl = [], hits = [];
  for(const c of cells.filter(c => c.depth === 0)){          // trunk, roots, ground
    const w = weight(c) * 1.3, gy = c.y + TREE_ROW * 0.58;
    dl.push({t:"path", d:taper(c.x, c.y + c.h/2 - 2, c.x, gy, w, w * 1.55), fill:pal.bark, alpha:.95});
    for(const k of [-1, 1])
      dl.push({t:"path", stroke:pal.bark, sw:Math.max(2, w * 0.34), cap:"round", alpha:.5,
               d:`M${r1(c.x)} ${r1(gy - 7)} Q${r1(c.x + k * w * 1.7)} ${r1(gy + 7)} ${r1(c.x + k * (w * 2.7 + 24))} ${r1(gy + 16)}`});
    dl.push({t:"path", stroke:pal.line2, sw:1.2, cap:"round", alpha:.55,
             d:`M${r1(c.x - w * 4 - 30)} ${r1(gy + 18)} H${r1(c.x + w * 4 + 30)}`});
  }
  for(const e of edges){
    const w = weight(e.dst);
    dl.push({t:"path", fill:pal.bark, alpha:.9,
             d:taper(e.src.x, e.src.y - e.src.h/2 + 2, e.dst.x, e.dst.y + e.dst.h/2 - 2, w * 1.15, w * 0.85)});
  }
  for(const c of cells){                                     // new growth at the tips
    if(hasKids.has(c)) continue;
    const ly = c.y - c.h/2 - 11;
    dl.push({t:"path", d:almond(c.x - 10, ly, 21, 9), fill:pal.accent, alpha:.55, rot:-26, rx:c.x - 10, ry:ly});
    dl.push({t:"path", d:almond(c.x + 10, ly, 18, 8), fill:pal.accent, alpha:.38, rot: 28, rx:c.x + 10, ry:ly});
  }
  for(const c of cells){
    dl.push({t:"rect", x:c.x - c.w/2, y:c.y - c.h/2, w:c.w, h:c.h, r:15,
             fill:pal.card, stroke:pal.line2, sw:1});
    for(const r of c.runs){
      dl.push({t:"text", x:r.x, y:c.y + 4.5, s:r.s, size:r.sep ? SSZ : NSZ,
               weight:r.sep ? 400 : 600, fill:r.sep ? pal.brass : pal.ink});
      if(!r.sep) hits.push({pid:r.pid, x:r.x - 4, y:c.y - c.h/2, w:r.w + 8, h:c.h, depth:c.depth});
    }
  }

  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for(const c of cells){
    x0 = Math.min(x0, c.x - c.w/2); x1 = Math.max(x1, c.x + c.w/2);
    y0 = Math.min(y0, c.y - c.h/2 - 34); y1 = Math.max(y1, c.y + c.h/2);
  }
  y1 += TREE_ROW * 0.58 + 26;
  return {kind:"tree", dl, hits, nodes:hits, rows:base.rows, ancestors:base.ancestors,
          box:{x:x0 - PAD, y:y0 - PAD, w:(x1 - x0) + PAD*2, h:(y1 - y0) + PAD*2}};
}

/* ── FAN ───────────────────────────────────────────────────
   Generations as concentric rings, each person's slice sized
   by how much of the family sits behind them.
   ──────────────────────────────────────────────────────── */
function fanView(pal){
  const idx = buildIndex();
  const anc = ui.mode === "anc";
  let rootId = ui.focus && P(ui.focus) ? ui.focus : null;
  if(!rootId){
    const ids = Object.keys(S.people);
