    if(!ids.length) return null;
    rootId = anc ? ids.slice().sort((a,b) => byBirth(b, a))[0]
                 : ids.filter(id => !idx[id].childOf).sort(byBirth)[0] || ids[0];
  }
  const MAXD = 7;
  const seen = new Set();
  function node(pid, d){
    const n = {pid, d, kids:[], spouses:[]};
    if(!seen.has(pid) && d < MAXD){
      seen.add(pid);
      if(anc){
        n.kids = idx[pid].parents.map(q => node(q, d + 1));
      } else {
        for(const uid of idx[pid].unions){
          const u = U(uid), sp = partnerOf(u, pid);
          if(sp && S.people[sp]) n.spouses.push(sp);
          for(const k of (u.children || []).slice().sort(byBirth))
            if(S.people[k]) n.kids.push(node(k, d + 1));
        }
      }
    }
    n.leaves = n.kids.length ? n.kids.reduce((a, k) => a + k.leaves, 0) : 1;
    return n;
  }
  const root = node(rootId, 0);

  const R0 = 86, RW = 80;
  /* descendants close to a near-full ring, leaving a hairline seam at the foot */
  const SPAN = anc ? 180 : 356, A0 = anc ? 180 : -90 - SPAN/2;
  (function assign(n, a0, a1){
    n.a0 = a0; n.a1 = a1;
    let a = a0;
    for(const k of n.kids){ const w = (a1 - a0) * (k.leaves / n.leaves); assign(k, a, a + w); a += w; }
  })(root, A0, A0 + SPAN);

  const dl = [], hits = [];
  let maxD = 0;
  (function scan(n){ maxD = Math.max(maxD, n.d); n.kids.forEach(scan); })(root);
  const Rmax = R0 + maxD * RW;

  for(let d = 1; d <= maxD; d++)                                   // ring hairlines
    dl.push({t:"circle", cx:0, cy:0, r:R0 + d * RW, stroke:pal.line, sw:1, alpha:.5});

  (function draw(n){
    if(n.d > 0){
      const ri = R0 + (n.d - 1) * RW, ro = ri + RW - 5;
      const span = n.a1 - n.a0, am = (n.a0 + n.a1) / 2, rm = (ri + ro) / 2;
      const d = sector(0, 0, ri, ro, n.a0, n.a1);
      dl.push({t:"path", d, fill:mix(pal.card, pal.accent, Math.min(.40, .05 + n.d * .085)),
               stroke:pal.line2, sw:.9});

      const p = P(n.pid);
      const nameSz = n.d >= 4 ? 11 : 12.5;
      const arcLen = span * Math.PI / 180 * rm;
      let name = fullName(p);
      const yrs = lifeLine(p);
      if(arcLen >= measure(name, nameSz, "ui", 600) + 14){
        let rot = am + 90; if(upsideDown(rot)) rot = am - 90;
        const px = rm * Math.cos(am * Math.PI/180), py = rm * Math.sin(am * Math.PI/180);
        dl.push({t:"text", x:px, y:py + (yrs ? -1 : 4), s:fitTo(name, arcLen - 12, nameSz, "ui", 600),
                 size:nameSz, weight:600, fill:pal.ink, anchor:"middle", rot, rx:px, ry:py});
        if(yrs && arcLen > 88)
          dl.push({t:"text", x:px, y:py + 11, s:yrs, size:9, fam:"mono", fill:pal.ink2,
                   anchor:"middle", rot, rx:px, ry:py});
      } else {
        const flip = upsideDown(am);
        const at = flip ? ro - 8 : ri + 8, rot = flip ? am + 180 : am;
        const px = at * Math.cos(am * Math.PI/180), py = at * Math.sin(am * Math.PI/180);
        dl.push({t:"text", x:px, y:py + 3.5, s:fitTo(name, ro - ri - 16, nameSz, "ui", 600),
                 size:nameSz, weight:600, fill:pal.ink, anchor:"start", rot, rx:px, ry:py});
      }
      const hx = rm * Math.cos(am * Math.PI/180), hy = rm * Math.sin(am * Math.PI/180);
      hits.push({pid:n.pid, d, x:hx - 26, y:hy - 14, w:52, h:28, depth:n.d});
    }
    n.kids.forEach(draw);
  })(root);

  /* the middle: whoever the fan is drawn around */
  dl.push({t:"circle", cx:0, cy:0, r:R0 - 6, fill:pal.card, stroke:pal.brass, sw:1.4});
  const rp = P(root.pid);
  const maxW = (R0 - 12) * 1.7;                 // stays inside the disc at these heights
  const l1 = rp.first || fullName(rp), l2 = rp.last || "";
  const mid = {size:17, fam:"disp", weight:600, fill:pal.ink, anchor:"middle"};
  if(l2){
    dl.push(Object.assign({t:"text", x:0, y:-5, s:fitTo(l1, maxW, 17, "disp", 600)}, mid));
    dl.push(Object.assign({t:"text", x:0, y:14, s:fitTo(l2, maxW, 17, "disp", 600)}, mid));
  } else {
    dl.push(Object.assign({t:"text", x:0, y:4, s:fitTo(l1, maxW, 17, "disp", 600)}, mid));
  }
  const sub = lifeLine(rp);
  if(sub) dl.push({t:"text", x:0, y:l2 ? 32 : 22, s:sub, size:10, fam:"mono",
                   fill:pal.ink2, anchor:"middle"});
  dl.push({t:"text", x:0, y:-R0 + 22, s:anc ? "ANCESTORS OF" : "DESCENDANTS OF", size:8,
           fam:"mono", fill:pal.ink3, anchor:"middle", ls:"1.4px"});
  hits.push({pid:root.pid, x:-R0 + 6, y:-R0 + 6, w:(R0 - 6) * 2, h:(R0 - 6) * 2, depth:0});

  const box = anc
    ? {x:-Rmax - 24, y:-Rmax - 24, w:(Rmax + 24) * 2, h:Rmax + R0 + 48}
    : {x:-Rmax - 24, y:-Rmax - 24, w:(Rmax + 24) * 2, h:(Rmax + 24) * 2};
  const rows = Array.from({length:maxD + 1}, (_, d) => ({depth:d, label:roman(d + 1)}));
  return {kind:"fan", dl, hits, nodes:hits, rows, box};
}

/* ── TIMELINE ──────────────────────────────────────────────
   One bar per life. Brass ties mark the year two of them met.
   ──────────────────────────────────────────────────────── */
function timeView(pal){
  const base = layout(CARD.compact);
  if(!base) return null;
  const depth = {}; base.nodes.forEach(n => { depth[n.pid] = n.depth; });
  const NOW = new Date().getFullYear();
  const rows = [], undated = [];
  for(const id in S.people){
    if(depth[id] == null) continue;
    const p = P(id);
    const b = parseInt(yearOf(p.birth)), d = parseInt(yearOf(p.death));
    if(!b && !d){ undated.push(id); continue; }
    rows.push({pid:id, b: b || (d - 65), d: d || NOW, est: !b,
               living: !d && !p.dead, depth: depth[id]});
  }
  if(!rows.length) return null;
  rows.sort((a, b) => (a.depth - b.depth) || (a.b - b.b));

  const lo = rows.reduce((m, r) => Math.min(m, r.b), 9999) - 3;
  const hi = rows.reduce((m, r) => Math.max(m, r.d), 0) + 3;
  const PPY = 9, LW = 200, RH = 26, HH = 26;
  const X = y => (y - lo) * PPY;
  const W = X(hi);

  const dl = [], hits = [];
  let y = 0;
  const bands = [];
  let cur = null;
  for(const r of rows){
    if(!cur || cur.depth !== r.depth){
      if(cur) y += 16;
      cur = {depth:r.depth, y};
      bands.push(cur);
      y += HH;
    }
    r.y = y; y += RH;
  }
  const H = y;

  for(let yr = Math.ceil(lo / 10) * 10; yr <= hi; yr += 10){     // decade rules
    const gx = X(yr), century = yr % 100 === 0;
    dl.push({t:"path", d:`M${r1(gx)} -22 V${r1(H)}`, stroke:pal.line,
             sw:century ? 1.2 : 1, dash:century ? null : "1 5", cap:"round", alpha:century ? .8 : .55});
    dl.push({t:"text", x:gx, y:-28, s:String(yr), size:10, fam:"mono",
             fill:century ? pal.ink2 : pal.ink3, anchor:"middle"});
  }
  for(const b of bands){
    dl.push({t:"text", x:-LW, y:b.y + 15, s:"GENERATION " + roman(b.depth + 1), size:9.5,
             fam:"mono", fill:pal.ink3, ls:"1.5px"});
    dl.push({t:"path", d:`M${r1(-LW)} ${r1(b.y + 21)} H${r1(W)}`, stroke:pal.line, sw:1, alpha:.6});
  }
  for(const r of rows){
    const p = P(r.pid), x0 = X(r.b), x1 = X(r.d), bh = 15, by = r.y + 4;
    const w = Math.max(4, x1 - x0);
    dl.push({t:"rect", x:x0, y:by, w, h:bh, r:bh/2,
             fill:mix(pal.card, pal.accent, .10 + Math.min(r.depth, 5) * .055),
             stroke:r.living ? pal.accent : pal.line2, sw:1, dash:r.est ? "4 3" : null});
    dl.push({t:"text", x:-14, y:by + 11.5, s:fitTo(fullName(p), LW - 24, 11.5, "ui", 500),
             size:11.5, weight:500, fill:pal.ink, anchor:"end"});
    const label = (r.est ? "c." : "") + r.b + (r.living ? "–" : "–" + r.d);
    if(w > measure(label, 9.5, "mono") + 16)
      dl.push({t:"text", x:x0 + 8, y:by + 11, s:label, size:9.5, fam:"mono", fill:pal.ink2});
    if(r.living)
      dl.push({t:"path", d:`M${r1(x1 + 5)} ${r1(by + 3)} l6 4.5 -6 4.5`, stroke:pal.accent,
               sw:1.6, cap:"round", join:"round"});
    hits.push({pid:r.pid, x:-LW, y:r.y, w:LW + Math.max(w, 40), h:RH - 3, depth:r.depth});
  }
  const at = {}; rows.forEach(r => { at[r.pid] = r; });
  for(const uid in S.unions){                                     // brass marriage ties
    const u = S.unions[uid], yr = parseInt(yearOf(u.date));
    const A = at[u.a], B = at[u.b];
    if(!yr || !A || !B || yr < lo || yr > hi) continue;
    const mx = X(yr), y1 = Math.min(A.y, B.y) + 11.5, y2 = Math.max(A.y, B.y) + 11.5;
    dl.push({t:"path", d:`M${r1(mx)} ${r1(y1)} V${r1(y2)}`, stroke:pal.brass, sw:1.4,
             cap:"round", alpha:.85, dash:u.divorced ? "4 3" : null});
    dl.push({t:"circle", cx:mx, cy:(y1 + y2) / 2, r:7, fill:pal.brassT, stroke:pal.brass, sw:1});
    dl.push({t:"text", x:mx, y:(y1 + y2) / 2 + 3.5, s:u.divorced ? "⚮" : "⚭", size:10,
             fill:pal.brass, anchor:"middle"});
  }
  let bottom = H;
  if(undated.length){
    bottom += 20;
    dl.push({t:"text", x:-LW, y:bottom, s:"DATES NOT RECORDED", size:9.5, fam:"mono",
             fill:pal.ink3, ls:"1.5px"});
    bottom += 16;
    dl.push({t:"text", x:-LW, y:bottom,
             s:fitTo(undated.map(id => fullName(P(id))).join(" · "), W + LW, 11, "ui", 400),
             size:11, fill:pal.ink2});
  }
  return {kind:"time", dl, hits, nodes:hits,
          rows:bands.map(b => ({depth:b.depth, label:roman(b.depth + 1)})),
          box:{x:-LW - PAD, y:-52 - PAD, w:W + LW + PAD * 2, h:(bottom + 52) + PAD * 2}};
}

/* ── REGISTER ──────────────────────────────────────────────
   The list you hand round the table: d'Aboville numbering, so
   1.2.1 tells you exactly where someone sits without a chart.
   ──────────────────────────────────────────────────────── */
function registerView(pal){
  const base = layout(CARD.compact);
  if(!base) return null;
  const idx = buildIndex();
  const onChart = new Set(base.nodes.map(n => n.pid));
  const roots = base.nodes.filter(n => n.depth === 0).sort((a, b) => a.x - b.x).map(n => n.pid);

  const entries = [], seen = new Set(), married = new Set();
  (function seed(){
    let i = 0;
    /* a spouse is listed against their partner, never given a number of
       their own — otherwise the founding couple reads as two families */
    for(const r of roots){ if(!seen.has(r) && !married.has(r)) walk(r, String(++i), 0); }
  })();
  function walk(pid, num, d){
    if(seen.has(pid)) return;
    seen.add(pid);
    const p = P(pid);
    const spouses = [];
    const kids = [];
    for(const uid of idx[pid].unions){
      const u = U(uid), sp = partnerOf(u, pid);
      if(sp && P(sp)){ spouses.push({p:P(sp), u}); married.add(sp); }
      for(const k of (u.children || []).slice().sort(byBirth)) if(onChart.has(k)) kids.push(k);
    }
    const line1 = num + "  " + fullName(p) + (lifeLine(p) ? "   " + lifeLine(p) : "");
    const extra = [];
    for(const s of spouses)
      extra.push((s.u.divorced ? "⚮" : s.u.status === "partners" ? "◇" : "⚭")
        + (yearOf(s.u.date) ? " " + yearOf(s.u.date) : "") + " " + fullName(s.p));
    const meta = [p.place, p.occupation].filter(Boolean).join(" · ");
    if(meta) extra.push(meta);
    entries.push({pid, d, line1, line2:extra.join("   ·   ")});
    let i = 0;
    for(const k of kids) walk(k, num + "." + (++i), d + 1);
  }
  if(!entries.length) return null;

  const LH = 15, GAP = 5, CWID = 330, CGAP = 38;
  entries.forEach(e => { e.h = (e.line2 ? LH * 2 : LH) + GAP; });
  const totalH = entries.reduce((t, e) => t + e.h, 0);
  const N = clamp(Math.round(Math.sqrt(totalH / (CWID * 1.25))), 1, 5);
  const perCol = totalH / N;

  const dl = [], hits = [];
  let col = 0, cy = 0, maxH = 0;
  for(const e of entries){
    if(cy > perCol && col < N - 1){ col++; cy = 0; }
    const cx = col * (CWID + CGAP), ind = Math.min(e.d, 5) * 11;
    dl.push({t:"text", x:cx + ind, y:cy + 11, s:fitTo(e.line1, CWID - ind, 11.5, "ui", 600),
             size:11.5, weight:600, fill:pal.ink});
    if(e.line2)
      dl.push({t:"text", x:cx + ind + 10, y:cy + 11 + LH,
               s:fitTo(e.line2, CWID - ind - 10, 10.5, "ui", 400),
               size:10.5, fill:pal.ink2});
    hits.push({pid:e.pid, x:cx + ind - 3, y:cy, w:CWID - ind, h:e.h, depth:e.d});
    cy += e.h;
    maxH = Math.max(maxH, cy);
  }
  for(let c = 1; c < N; c++)                                   // column rules
    dl.push({t:"path", d:`M${r1(c * (CWID + CGAP) - CGAP/2)} -6 V${r1(maxH)}`,
             stroke:pal.line, sw:1, alpha:.7});
  const W = N * CWID + (N - 1) * CGAP;
  return {kind:"register", dl, hits, nodes:hits, rows:base.rows,
          box:{x:-PAD, y:-PAD - 6, w:W + PAD * 2, h:maxH + PAD * 2 + 6}};
}

/* ── view dispatch ─────────────────────────────────────── */
function makeModel(pal){
  pal = pal || activePal();
  try {
    if(ui.view === "tree")     return treeView(pal);
    if(ui.view === "fan")      return fanView(pal);
    if(ui.view === "time")     return timeView(pal);
    if(ui.view === "register") return registerView(pal);
    return layout();
  } catch(err){
    console.error("view failed", err);
    return layout();
  }
}
function viewPaint(model, scale, palName, title){
  return model.kind === "chart"
    ? renderCanvas(model, scale, palName, title)
    : renderCanvasDL(model, scale, palName, title);
}
function hitsSVG(model){
  if(!model.hits) return "";
  return model.hits.map(h => `<rect class="node hit" data-id="${h.pid}" x="${r1(h.x)}" y="${r1(h.y)}"`
    + ` width="${r1(h.w)}" height="${r1(h.h)}" rx="4"/>`).join("");
}
function selRing(model){
  if(model.kind === "chart" || !ui.sel || !model.hits) return "";
  const h = model.hits.find(h => h.pid === ui.sel);
  if(!h) return "";
  return `<rect class="selring" x="${r1(h.x - 2)}" y="${r1(h.y - 2)}" width="${r1(h.w + 4)}"`
       + ` height="${r1(h.h + 4)}" rx="6"/>`;
}

/* ═══════════════════════════════════════════════════════════
   UI — rail, inspector, forms
   ═══════════════════════════════════════════════════════════ */
function render(){
  warmPhotos();
  drawChart();
  renderRail();
  renderInspector();
  $("#focusName").textContent = ui.focus && P(ui.focus) ? fullName(P(ui.focus)) : "Whole family";
  $("#sampleFlag").hidden = !ui.isSample;
  $("#btnFocus").disabled = ui.mode === "all";
}

function renderRail(){
  const list = $("#railList");
  const idx = buildIndex();
  const ids = Object.keys(S.people);
  $("#railCount").textContent = ids.length + (ids.length === 1 ? " person" : " people");
  const gens = LAY ? LAY.rows.length : 0;
  $("#railGens").textContent = gens ? gens + " generations" : "—";

  const q = ui.query.trim().toLowerCase();
  const match = ids.filter(id => {
    if(!q) return true;
    const p = P(id);
    return (fullName(p) + " " + (p.maiden||"") + " " + (p.place||"") + " " + (p.occupation||""))
      .toLowerCase().includes(q);
  });
  if(!match.length){
    list.innerHTML = `<div class="rail-empty">${ids.length ? "No one matches that search." : "No one here yet.<br>Add the first person to begin."}</div>`;
    return;
  }
  /* group by the depth the chart gave them, so the rail mirrors the chart */
  const depth = {};
  if(LAY) LAY.nodes.forEach(n => { depth[n.pid] = n.depth; });
  const groups = new Map();
  match.forEach(id => {
    const d = depth[id] == null ? 999 : depth[id];
    if(!groups.has(d)) groups.set(d, []);
    groups.get(d).push(id);
  });
  const keys = [...groups.keys()].sort((a,b) => a - b);
  let html = "";
  for(const d of keys){
    const rows = groups.get(d).sort((a,b) =>
      (parseInt(yearOf(P(a).birth)) || 9999) - (parseInt(yearOf(P(b).birth)) || 9999) ||
      fullName(P(a)).localeCompare(fullName(P(b))));
    const label = d === 999 ? "Not on this chart"
      : (LAY && LAY.ancestors ? (ANC_LABELS[d] || "Earlier") : "Generation " + roman(d + 1));
    html += `<div class="rail-gen">${esc(label)}</div>`;
    for(const id of rows){
      const p = P(id), h = hueOf(p);
      const av = p.photo
        ? `<img src="${esc(p.photo)}" alt="">`
        : esc(initials(p));
      html += `<button class="prow" data-id="${id}" aria-current="${ui.sel === id}">`
        + `<span class="av" style="background:hsl(${h} 26% 85%);color:hsl(${h} 32% 30%)">${av}</span>`
        + `<span class="txt"><span class="nm">${esc(fullName(p))}</span></span>`
        + `<span class="dt">${esc(lifeLine(p) || "—")}</span></button>`;
    }
  }
  list.innerHTML = html;
}

function renderInspector(){
  const app = $("#app");
  const p = ui.sel ? P(ui.sel) : null;
  if(!p){ app.classList.remove("insp-open"); return; }
  app.classList.add("insp-open");
  const idx = buildIndex();
  const h = hueOf(p);
  $("#ihAv").style.background = `hsl(${h} 26% 85%)`;
  $("#ihAv").style.color = `hsl(${h} 32% 30%)`;
  $("#ihAv").innerHTML = p.photo ? `<img src="${esc(p.photo)}" alt="">` : esc(initials(p));
  $("#ihName").textContent = fullName(p);
  $("#ihSub").textContent = lifeLine(p) || "dates unknown";

  const info = idx[p.id] || {unions:[], parents:[], childOf:null};
  const pu = info.childOf ? U(info.childOf) : null;
  const parents = info.parents;

  let html = `
  <div class="quick">
    <button class="btn" data-act="add-partner">＋ Partner</button>
    <button class="btn" data-act="add-child">＋ Child</button>
    <button class="btn" data-act="add-parent">＋ Parent</button>
    <button class="btn" data-act="add-sibling">＋ Sibling</button>
  </div>

  <fieldset><legend>Name</legend>
    <div class="fgrid two">
      <label class="f"><span>First name</span><input data-fld="first" value="${esc(p.first)}" autocomplete="off"></label>
      <label class="f"><span>Family name</span><input data-fld="last" value="${esc(p.last)}" autocomplete="off"></label>
    </div>
    <div class="fgrid two" style="margin-top:9px">
      <label class="f"><span>Née / birth name</span><input data-fld="maiden" value="${esc(p.maiden)}" autocomplete="off"></label>
      <label class="f"><span>Sex</span><select data-fld="sex">
        <option value=""${p.sex===""?" selected":""}>—</option>
        <option value="F"${p.sex==="F"?" selected":""}>Female</option>
        <option value="M"${p.sex==="M"?" selected":""}>Male</option>
        <option value="X"${p.sex==="X"?" selected":""}>Other</option>
      </select></label>
    </div>
  </fieldset>

  <fieldset><legend>Life</legend>
    <div class="fgrid two">
      <label class="f"><span>Born</span><input data-fld="birth" value="${esc(p.birth)}" placeholder="1948" autocomplete="off"></label>
      <label class="f"><span>Died</span><input data-fld="death" value="${esc(p.death)}" placeholder="2011" autocomplete="off"></label>
    </div>
    <div class="fgrid" style="margin-top:9px">
      <label class="f"><span>Place</span><input data-fld="place" value="${esc(p.place)}" placeholder="Nagpur" autocomplete="off"></label>
      <label class="f"><span>Occupation</span><input data-fld="occupation" value="${esc(p.occupation)}" placeholder="Schoolteacher" autocomplete="off"></label>
      <label class="f"><span>Notes</span><textarea data-fld="notes" placeholder="Stories, anecdotes, anything worth keeping.">${esc(p.notes)}</textarea></label>
    </div>
    <div class="hint mono" style="font-size:10.5px;color:var(--ink-3);margin-top:5px">Dates can be anything — “1948”, “Mar 1948”, “c. 1910”.</div>
  </fieldset>

  <fieldset><legend>Photo</legend>
    <div class="photo-row">
      <div class="photo-prev">${p.photo ? `<img src="${esc(p.photo)}" alt="">` : `<span>no<br>photo</span>`}</div>
      <div style="display:flex;flex-direction:column;gap:6px;flex:1">
        <button class="btn sm" data-act="photo">${p.photo ? "Replace photo" : "Choose photo…"}</button>
        ${p.photo ? `<button class="btn sm danger" data-act="photo-clear">Remove</button>` : ""}
        <div class="mono" style="font-size:10px;color:var(--ink-3)">Stored inside your file. Scaled to 260px.</div>
      </div>
    </div>
  </fieldset>

  <fieldset><legend>Parents</legend><div class="rel">`;

  if(parents.length){
    for(const q of parents) html += relRow(q, "parent", pu ? pu.id : "");
  } else {
    html += `<div class="rel-none">No parents recorded.</div>`;
  }
  if(parents.length < 2)
    html += `<button class="rel-add" data-act="add-parent">＋ Add a parent</button>`;
  html += `</div></fieldset>`;

  html += `<fieldset><legend>Partners</legend><div class="rel">`;
  if(info.unions.length){
    for(const uid of info.unions){
      const u = U(uid), sp = partnerOf(u, p.id);
      const kids = (u.children||[]).filter(k => S.people[k]).length;
      const bits = [u.divorced ? "divorced" : (u.status === "partners" ? "partners" : "married"),
                    yearOf(u.date), kids ? kids + (kids===1?" child":" children") : ""].filter(Boolean);
      html += `<div class="rel-item">
        <span class="txt"><span class="nm">${sp && P(sp) ? esc(fullName(P(sp))) : "<em>partner unknown</em>"}</span>
        <span class="meta">${esc(bits.join(" · "))}</span></span>
        <button class="go" data-act="edit-union" data-uid="${uid}" title="Edit this union" aria-label="Edit union">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11.2 2.6l2.2 2.2L5.6 12.6 2.6 13.4l.8-3z" stroke-linejoin="round"/></svg></button>
        ${sp && P(sp) ? `<button class="go" data-act="goto" data-id="${sp}" title="Open" aria-label="Open person">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 3.5l4.5 4.5L6 12.5"/></svg></button>` : ""}
      </div>`;
    }
  } else {
    html += `<div class="rel-none">No partners recorded.</div>`;
  }
  html += `<button class="rel-add" data-act="add-partner">＋ Add a partner</button></div></fieldset>`;

  html += `<fieldset><legend>Children</legend><div class="rel">`;
  const kids = info.kids;
  if(kids.length){
    kids.sort((a,b) => (parseInt(yearOf(P(a).birth)) || 9999) - (parseInt(yearOf(P(b).birth)) || 9999));
    for(const k of kids) html += relRow(k, "child");
  } else {
    html += `<div class="rel-none">No children recorded.</div>`;
  }
  html += `<button class="rel-add" data-act="add-child">＋ Add a child</button></div></fieldset>`;

  html += `<fieldset><legend>This person</legend>
    <div style="display:flex;gap:7px;flex-wrap:wrap">
      <button class="btn sm" data-act="focus">Draw their tree</button>
      <button class="btn sm" data-act="center">Find on chart</button>
      <button class="btn sm danger" data-act="delete">Delete</button>
    </div></fieldset>`;

  $("#inspBody").innerHTML = html;
}
function relRow(id, kind, uid){
  const p = P(id); if(!p) return "";
  return `<div class="rel-item">
    <span class="txt"><span class="nm">${esc(fullName(p))}</span>
    <span class="meta">${esc(lifeLine(p) || "dates unknown")}</span></span>
    <button class="go" data-act="unlink" data-kind="${kind}" data-id="${id}" data-uid="${esc(uid||"")}" title="Unlink" aria-label="Unlink">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    <button class="go" data-act="goto" data-id="${id}" title="Open" aria-label="Open person">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 3.5l4.5 4.5L6 12.5"/></svg></button>
  </div>`;
}

/* ── inspector events ──────────────────────────────────── */
let fldTimer = null;
$("#inspBody").addEventListener("input", e => {
  const f = e.target.dataset.fld; if(!f || !ui.sel) return;
  const p = P(ui.sel); if(!p) return;
  if(fldTimer === null) snapshot();
  clearTimeout(fldTimer);
  p[f] = e.target.value;
  fldTimer = setTimeout(() => { fldTimer = null; }, 900);
  ui.dirty = true;
  save();
  scheduleRedraw();
  $("#ihName").textContent = fullName(p);
  $("#ihSub").textContent = lifeLine(p) || "dates unknown";
});
/** Typing should feel instant, so the chart catches up a beat later. */
let redrawTimer = null;
function scheduleRedraw(){
  clearTimeout(redrawTimer);
  redrawTimer = setTimeout(() => { drawChart(); renderRail(); }, 180);
}
$("#inspBody").addEventListener("click", e => {
  const btn = e.target.closest("[data-act]"); if(!btn) return;
  const act = btn.dataset.act;
  const p = ui.sel ? P(ui.sel) : null; if(!p) return;

  if(act === "goto"){ select(btn.dataset.id); centerOn(btn.dataset.id); return; }
  if(act === "focus"){ ui.focus = p.id; ui.mode = ui.mode === "all" ? "desc" : ui.mode; setMode(ui.mode); render(); fitView(); return; }
  if(act === "center"){ centerOn(p.id); return; }
  if(act === "photo"){ pickPhoto(p.id); return; }
  if(act === "photo-clear"){ snapshot(); p.photo = ""; delete photoCache[p.id]; commit("Photo removed"); return; }
  if(act === "delete"){ confirmDelete(p); return; }
  if(act === "edit-union"){ unionDialog(btn.dataset.uid); return; }

  if(act === "add-partner"){
    choosePerson({title:"Add a partner", subtitle:"Pick someone already on the chart, or create a new person.",
      exclude:[p.id], seed:p.last}, id => {
      snapshot();
      if(!unionBetween(p.id, id, false)) addUnion(p.id, id);
      commit("Partner added"); select(id);
    });
    return;
  }
  if(act === "add-child"){
    const idx = buildIndex();
    const unions = idx[p.id].unions;
    const place = (uid) => {
      choosePerson({title:"Add a child", subtitle:"Pick someone already on the chart, or create a new person.",
        exclude:[p.id], seed:p.last}, id => {
        snapshot();
        const u = U(uid) || U(addUnion(p.id, null));
        if(!u.children.includes(id)) u.children.push(id);
        commit("Child added"); select(id);
      });
    };
    if(unions.length <= 1) place(unions[0] || addUnion(p.id, null));
    else chooseUnion(p, unions, place);
    return;
  }
  if(act === "add-parent"){
    choosePerson({title:"Add a parent", subtitle:"Pick someone already on the chart, or create a new person.",
      exclude:[p.id], seed:p.last}, id => {
      snapshot();
      const uid = parentUnion(p.id, true);
      const u = U(uid);
      if(u.a === id || u.b === id){ /* already there */ }
      else if(!u.a) u.a = id;
      else if(!u.b) u.b = id;
      else { toast("Two parents already recorded", true); return; }
      if(!u.children.includes(p.id)) u.children.push(p.id);
      commit("Parent added"); select(id);
    });
    return;
  }
  if(act === "add-sibling"){
    const uid = parentUnion(p.id, true);
    choosePerson({title:"Add a sibling", subtitle:"They will share this person’s parents.",
      exclude:[p.id], seed:p.last}, id => {
      snapshot();
      const u = U(uid);
      if(!u.children.includes(id)) u.children.push(id);
      commit("Sibling added"); select(id);
    });
    return;
  }
  if(act === "unlink"){
    snapshot();
    const other = btn.dataset.id, kind = btn.dataset.kind;
    if(kind === "parent"){
      const u = U(parentUnion(p.id, false));
      if(u){ if(u.a === other) u.a = null; if(u.b === other) u.b = null; }
    } else if(kind === "child"){
      for(const uid in S.unions) S.unions[uid].children = S.unions[uid].children.filter(k => k !== other);
    }
    commit("Unlinked");
    return;
  }
});

function select(id){
  ui.sel = id;
  renderRail(); renderInspector(); drawChart();
}

/* ── person picker ─────────────────────────────────────── */
function choosePerson(opts, done){
  const ids = Object.keys(S.people).filter(id => !(opts.exclude||[]).includes(id));
  openModal(`
    <div class="modal">
      <div class="modal-head"><div style="flex:1">
        <h2>${esc(opts.title)}</h2><p>${esc(opts.subtitle||"")}</p>
      </div></div>
      <div class="modal-body">
        <label class="f"><span>Name</span><input id="pkQ" placeholder="Type a name…" autocomplete="off"></label>
        <button class="picker-new" id="pkNew">＋ Create “<span id="pkNewName">new person</span>”</button>
        <div class="picker-list" id="pkList"></div>
      </div>
      <div class="modal-foot"><button class="btn" data-close>Cancel</button></div>
    </div>`);

  const q = $("#pkQ"), list = $("#pkList");
  function paint(){
    const t = q.value.trim().toLowerCase();
    $("#pkNewName").textContent = q.value.trim() || "new person";
    const hits = ids.filter(id => !t || fullName(P(id)).toLowerCase().includes(t)).slice(0, 60);
    list.innerHTML = hits.length
      ? hits.map(id => {
          const p = P(id), h = hueOf(p);
          return `<button class="prow" data-id="${id}">
            <span class="av" style="background:hsl(${h} 26% 85%);color:hsl(${h} 32% 30%)">${p.photo?`<img src="${esc(p.photo)}" alt="">`:esc(initials(p))}</span>
            <span class="txt"><span class="nm">${esc(fullName(p))}</span></span>
            <span class="dt">${esc(lifeLine(p)||"—")}</span></button>`;
        }).join("")
      : `<div class="rail-empty">${ids.length ? "No match — create them instead." : "No one else on the chart yet."}</div>`;
  }
  paint();
  q.addEventListener("input", paint);
  q.focus();
  list.addEventListener("click", e => {
    const b = e.target.closest("[data-id]"); if(!b) return;
    closeModal(); done(b.dataset.id);
  });
  const create = () => {
    const raw = q.value.trim();
    if(!raw){ q.focus(); return toast("Type a name first", true); }
    const bits = raw.split(/\s+/);
    const first = bits.shift();
    const last = bits.join(" ") || (opts.seed || "");
    snapshot();
    const id = addPerson({first, last});
    closeModal(); done(id);
  };
  $("#pkNew").addEventListener("click", create);
  q.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); create(); } });
}

function chooseUnion(p, unions, done){
  openModal(`
    <div class="modal">
      <div class="modal-head"><div><h2>Which family?</h2>
        <p>${esc(fullName(p))} has more than one partner. Choose whose child this is.</p></div></div>
      <div class="modal-body"><div class="rel">
        ${unions.map(uid => {
          const u = U(uid), sp = partnerOf(u, p.id);
          return `<button class="rel-item" style="width:100%;text-align:left" data-uid="${uid}">
            <span class="txt"><span class="nm">with ${sp && P(sp) ? esc(fullName(P(sp))) : "an unknown partner"}</span>
            <span class="meta">${esc([yearOf(u.date), (u.children||[]).length + " children"].filter(Boolean).join(" · "))}</span></span></button>`;
        }).join("")}
        <button class="rel-add" data-uid="new">＋ A new, separate union</button>
      </div></div>
      <div class="modal-foot"><button class="btn" data-close>Cancel</button></div>
    </div>`);
  $("#modalMount").addEventListener("click", e => {
    const b = e.target.closest("[data-uid]"); if(!b) return;
    const uid = b.dataset.uid;
    closeModal();
    done(uid === "new" ? addUnion(p.id, null) : uid);
  });
}

function unionDialog(uid){
  const u = U(uid); if(!u) return;
  const a = u.a ? fullName(P(u.a)) : "—", b = u.b ? fullName(P(u.b)) : "—";
  openModal(`
    <div class="modal">
      <div class="modal-head"><div><h2>${esc(a)} &amp; ${esc(b)}</h2>
        <p>How this union is shown on the chart.</p></div></div>
      <div class="modal-body">
        <div class="fgrid two">
          <label class="f"><span>Kind</span><select id="uSt">
            <option value="married"${u.status==="married"?" selected":""}>Married ⚭</option>
            <option value="partners"${u.status==="partners"?" selected":""}>Partners ◇</option>
          </select></label>
          <label class="f"><span>Year</span><input id="uDt" value="${esc(u.date)}" placeholder="1968" autocomplete="off"></label>
        </div>
        <label class="f" style="margin-top:9px"><span>Place</span><input id="uPl" value="${esc(u.place)}" placeholder="Nagpur" autocomplete="off"></label>
        <label class="checkline" style="margin-top:12px"><input type="checkbox" id="uDv"${u.divorced?" checked":""}> Separated or divorced ⚮</label>
      </div>
      <div class="modal-foot">
        <button class="btn danger" id="uDel">Remove this union</button>
        <span class="spring"></span>
        <button class="btn" data-close>Cancel</button>
        <button class="btn primary" id="uOk">Save</button>
      </div>
    </div>`);
  $("#uOk").addEventListener("click", () => {
    snapshot();
    u.status = $("#uSt").value; u.date = $("#uDt").value;
    u.place = $("#uPl").value; u.divorced = $("#uDv").checked;
    closeModal(); commit("Union updated");
  });
  $("#uDel").addEventListener("click", () => {
    snapshot();
    const kids = (u.children || []).slice();
    const stays = u.a || u.b;          // children keep whichever parent remains
    delete S.unions[uid];
    if(kids.length && stays) addUnion(stays, null, {children:kids});
    closeModal(); commit("Union removed");
  });
}

function confirmDelete(p){
  openModal(`
    <div class="modal" style="width:min(100%,420px)">
      <div class="modal-head"><div><h2>Delete ${esc(fullName(p))}?</h2>
        <p>Their card and every link to them is removed. Children stay on the chart, but lose this parent.</p></div></div>
      <div class="modal-foot"><span class="spring"></span>
        <button class="btn" data-close>Keep</button>
        <button class="btn danger" id="dOk">Delete</button></div>
    </div>`);
  $("#dOk").addEventListener("click", () => {
    snapshot(); deletePerson(p.id); closeModal(); commit("Deleted");
  });
}

function pickPhoto(pid){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.addEventListener("change", () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const M = 260;
        const k = Math.min(1, M / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        snapshot();
        P(pid).photo = cv.toDataURL("image/jpeg", 0.82);
        delete photoCache[pid];
        commit("Photo added");
      };
      img.onerror = () => toast("That image could not be read", true);
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  });
  inp.click();
}

        <button class="btn primary" id="pGo">Print</button>
      </div>
    </div>`);

  const read = () => {
    printOpts.paper   = $("#pPaper").value;
    printOpts.orient  = $("#pOrient").value;
    printOpts.margin  = clamp(+$("#pMargin").value || 0, 0, 40);
    printOpts.fitMode = $("#pFit").value;
    printOpts.scale   = clamp(+$("#pScale").value || 100, 10, 400);
    printOpts.overlap = clamp(+$("#pOverlap").value || 0, 0, 20);
    printOpts.crop    = $("#pCrop").checked;
    printOpts.title   = $("#pTitle").value;
    printOpts.subtitle= $("#pSub").value;
    printOpts.note    = $("#pNote").value;
    S.meta = {title:printOpts.title, subtitle:printOpts.subtitle, note:printOpts.note};
    save();
    $("#pTileRow").style.display = printOpts.fitMode === "tile" ? "" : "none";
    paintPreview();
  };
  $$("#modalMount input, #modalMount select").forEach(el => {
    el.addEventListener("input", read); el.addEventListener("change", read);
  });
  $("#pGo").addEventListener("click", () => { read(); doPrint(); });
  $("#pPNG").addEventListener("click", () => { read(); exportPNG(); });
  $("#pSVG").addEventListener("click", () => { read(); exportSVG(); });
  $("#pJSON").addEventListener("click", () => { read(); exportJSON(); });
  read();
}
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function guessTitle(){
  const counts = {};
  for(const id in S.people){ const l = (P(id).last||"").trim(); if(l) counts[l] = (counts[l]||0) + 1; }
  const top = Object.keys(counts).sort((a,b) => counts[b] - counts[a])[0];
  return top ? "The " + top + " Family" : "Our Family";
}
function guessSubtitle(){
  const ys = [];
  for(const id in S.people){
    const b = parseInt(yearOf(P(id).birth)); if(b) ys.push(b);
    const d = parseInt(yearOf(P(id).death)); if(d) ys.push(d);
  }
  const gens = LAY ? LAY.rows.length : 0;
  if(!ys.length) return gens ? gens + " generations" : "";
  const lo = Math.min(...ys), hi = Math.max(...ys);
  return (gens ? gens + " generations, " : "") + lo + "–" + hi;
}

/** Work out the sheet grid for the current options. */
function planSheets(){
  const [pw0, ph0] = PAPERS[printOpts.paper];
  const land = printOpts.orient === "landscape";
  const pageW = (land ? Math.max(pw0, ph0) : Math.min(pw0, ph0)) * MM;
  const pageH = (land ? Math.min(pw0, ph0) : Math.max(pw0, ph0)) * MM;
  const m     = printOpts.margin * MM;
  const hasTitle = !!(printOpts.title || printOpts.subtitle);
  const footH = printOpts.note || printOpts.crop ? 7 * MM : 0;
  /* the sheet is always drawn in the register's light palette,
     whatever the screen is showing */
  const model = makeModel(PAL.light) || LAY;
  const box   = boxWithTitle(model, hasTitle);

  if(printOpts.fitMode === "fit"){
    const availW = pageW - 2*m, availH = pageH - 2*m - footH;
    const scale  = Math.min(availW / box.w, availH / box.h);
    return {pageW, pageH, m, footH, hasTitle, box, model, scale, cols:1, rows:1, tiled:false,
            availW, availH, over:0};
  }
  const scale = printOpts.scale / 100;
  const over  = printOpts.overlap * MM;
  const availW = pageW - 2*m, availH = pageH - 2*m - footH;
  const stepW = Math.max(40, availW - over), stepH = Math.max(40, availH - over);
  const cols = Math.max(1, Math.ceil((box.w * scale - over) / stepW));
  const rows = Math.max(1, Math.ceil((box.h * scale - over) / stepH));
  return {pageW, pageH, m, footH, hasTitle, box, model, scale, cols, rows, tiled:true,
          availW, availH, stepW, stepH, over};
}

function paintPreview(){
  const plan = planSheets();
  const mount = $("#prevMount");
  const maxW = 268, maxH = 200;
  const gw = plan.pageW * plan.cols, gh = plan.pageH * plan.rows;
  const k = Math.min(maxW / gw, maxH / gh);
  const svgInner = viewSVG(plan.model, {selectable:false, ns:"pv", pal:PAL.light,
    title: plan.hasTitle ? {main:printOpts.title, sub:printOpts.subtitle} : null});
  const b = plan.box;

  mount.innerHTML = `<div class="sheetprev" style="width:${(gw*k).toFixed(1)}px;height:${(gh*k).toFixed(1)}px">
    <div style="position:absolute;left:${(plan.m*k).toFixed(1)}px;top:${(plan.m*k).toFixed(1)}px;
                width:${((gw - 2*plan.m)*k).toFixed(1)}px;height:${((gh - 2*plan.m)*k).toFixed(1)}px;overflow:hidden">
      <svg width="${(b.w*plan.scale*k).toFixed(1)}" height="${(b.h*plan.scale*k).toFixed(1)}"
           viewBox="${r1(b.x)} ${r1(b.y)} ${r1(b.w)} ${r1(b.h)}">${svgInner}</svg>
    </div>
    ${Array.from({length:plan.cols*plan.rows}, (_,i) => {
      const c = i % plan.cols, r = Math.floor(i / plan.cols);
      return `<div class="pg" style="left:${(c*plan.pageW*k).toFixed(1)}px;top:${(r*plan.pageH*k).toFixed(1)}px;
        width:${(plan.pageW*k).toFixed(1)}px;height:${(plan.pageH*k).toFixed(1)}px"></div>`;
    }).join("")}
  </div>`;

  const n = plan.cols * plan.rows;
  const cm = (v) => (v / MM / 10).toFixed(0);
  $("#prevNote").innerHTML = plan.tiled
    ? `<b>${n} sheet${n>1?"s":""}</b> — ${plan.cols} across × ${plan.rows} down<br>`
      + `assembled: <b>${cm(plan.cols*plan.pageW)} × ${cm(plan.rows*plan.pageH)} cm</b>`
    : `<b>1 sheet</b> — chart drawn at <b>${Math.round(plan.scale*100)}%</b><br>`
      + (plan.scale < 0.34 ? `<span style="color:var(--danger)">names will be very small — try a poster tile</span>`
                           : `names stay legible`);
}

function buildPrintSheets(){
  const plan = planSheets();
  const root = $("#printRoot");
  const b = plan.box;
  const svgInner = viewSVG(plan.model, {selectable:false, ns:"pr", pal:PAL.light,
    title: plan.hasTitle ? {main:printOpts.title, sub:printOpts.subtitle} : null});
  const svgFor = (w, h) =>
    `<svg width="${w.toFixed(1)}" height="${h.toFixed(1)}" viewBox="${r1(b.x)} ${r1(b.y)} ${r1(b.w)} ${r1(b.h)}"
      xmlns="http://www.w3.org/2000/svg">${svgInner}</svg>`;

  let css = `@page{size:${(plan.pageW/MM).toFixed(1)}mm ${(plan.pageH/MM).toFixed(1)}mm;margin:0}`;
  let html = `<style>${css}</style>`;
  const drawnW = b.w * plan.scale, drawnH = b.h * plan.scale;

  const foot = (left, right) => plan.footH ? `
    <div style="position:absolute;left:${plan.m}px;right:${plan.m}px;bottom:${(plan.m*0.55).toFixed(1)}px">
      <div class="pfoot" style="font-size:8.5px"><span>${esc(left)}</span><span>${esc(right)}</span></div>
    </div>` : "";

  if(!plan.tiled){
    const ox = plan.m + (plan.availW - drawnW) / 2;
    const oy = plan.m + (plan.availH - drawnH) / 2;
    html += `<div class="sheet" style="width:${plan.pageW}px;height:${plan.pageH}px">
      <div style="position:absolute;left:${ox.toFixed(1)}px;top:${oy.toFixed(1)}px">${svgFor(drawnW, drawnH)}</div>
      ${foot(printOpts.note, dateStamp())}
    </div>`;
  } else {
    for(let r = 0; r < plan.rows; r++){
      for(let c = 0; c < plan.cols; c++){
        const offX = c * plan.stepW, offY = r * plan.stepH;
        const marks = printOpts.crop ? cropMarks(plan) : "";
        html += `<div class="sheet" style="width:${plan.pageW}px;height:${plan.pageH}px">
          <div class="clipbox" style="left:${plan.m}px;top:${plan.m}px;width:${plan.availW.toFixed(1)}px;height:${plan.availH.toFixed(1)}px">
            <div style="position:absolute;left:${(-offX).toFixed(1)}px;top:${(-offY).toFixed(1)}px">${svgFor(drawnW, drawnH)}</div>
          </div>
          ${marks}
          ${foot((printOpts.note ? printOpts.note + "  ·  " : "") + printOpts.title,
                 `row ${r+1} · col ${c+1}   (sheet ${r*plan.cols+c+1} of ${plan.cols*plan.rows})`)}
        </div>`;
      }
    }
  }
  root.innerHTML = html;
  return plan;
}
function cropMarks(plan){
  const L = 5 * MM, T = 0.4 * MM, m = plan.m;
  const pts = [[m, m, 1, 1], [plan.pageW - m, m, -1, 1],
               [m, plan.pageH - m, 1, -1], [plan.pageW - m, plan.pageH - m, -1, -1]];
  return pts.map(([x, y, sx, sy]) =>
    `<div class="crop" style="left:${(sx>0?x:x-L).toFixed(1)}px;top:${(y-T/2).toFixed(1)}px;width:${L}px;height:${T}px"></div>`
  + `<div class="crop" style="left:${(x-T/2).toFixed(1)}px;top:${(sy>0?y:y-L).toFixed(1)}px;width:${T}px;height:${L}px"></div>`
  ).join("");
}
function dateStamp(){
  return new Date().toLocaleDateString(undefined, {day:"numeric", month:"long", year:"numeric"});
}
function doPrint(){
  buildPrintSheets();
  closeModal();
  setTimeout(() => {
    window.print();
    setTimeout(() => { $("#printRoot").innerHTML = ""; }, 1200);
  }, 120);
}

/* ── file out ──────────────────────────────────────────── */
async function offer(filename, data, mime){
  if(DL){
    try { await DL.save({filename, data}); return true; }
    catch(err){
      if(err && err.code === "declined") return false;
      toast("Could not save that file", true); return false;
    }
  }
  const blob = data instanceof Blob ? data : new Blob([data], {type:mime || "application/octet-stream"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return true;
}
function slug(){
  const base = (printOpts.title || guessTitle())
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "family-tree";
  return ui.view === "chart" ? base : base + "-" + ui.view;
}
async function exportPNG(){
  const model = makeModel(PAL.light);
  if(!model) return;
  const hasTitle = !!(printOpts.title || printOpts.subtitle);
  const box = boxWithTitle(model, hasTitle);
  const target = 3800;                      // a comfortable poster raster
  const MAXPX = 11000;                      // stay inside the browser's canvas limit
  const scale = Math.max(0.35, Math.min(clamp(target / box.w, 1, 4),
                                        MAXPX / box.w, MAXPX / (box.h + 72)));
  const cv = viewPaint(model, scale, "light",
                       hasTitle ? {main:printOpts.title, sub:printOpts.subtitle} : null);
  cv.toBlob(async blob => {
    if(!blob) return toast("Could not build the image", true);
    const ok = await offer(slug() + ".png", blob, "image/png");
    if(ok) toast("PNG saved · " + cv.width + "×" + cv.height);
  }, "image/png");
}

async function exportJSON(){
  const doc = JSON.stringify({app:"heirloom", version:1, saved:new Date().toISOString(), data:S}, null, 1);
  const ok = await offer(slug() + ".json", doc, "application/json");
  if(ok){ ui.dirty = false; toast("Family data saved"); }

function importJSON(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.addEventListener("change", () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const j = JSON.parse(fr.result);
        const d = j && j.data ? j.data : j;
        if(!d || !d.people) throw new Error("no people");
        snapshot();
        S = normalise(d);
        ui.isSample = false; ui.sel = null; ui.focus = null;
        save(); render(); fitView();
        toast("Opened " + Object.keys(S.people).length + " people");
      } catch(err){ toast("That file isn’t an Heirloom family file", true); }
    };
    fr.readAsText(f);
  });
  inp.click();
}
function normalise(d){
  const out = blankDoc();
  out.meta = Object.assign({title:"", subtitle:"", note:""}, d.meta || {});
  let max = 0;
  for(const id in (d.people||{})){
    const p = d.people[id];
    out.people[id] = Object.assign({id, first:"", last:"", maiden:"", sex:"", birth:"", death:"",
                                    dead:false, place:"", occupation:"", notes:"", photo:""}, p, {id});
    const n = parseInt(String(id).replace(/\D/g, "")); if(n > max) max = n;
  }
  for(const id in (d.unions||{})){
    const u = d.unions[id];
    out.unions[id] = Object.assign({id, a:null, b:null, status:"married", date:"", place:"",
                                    divorced:false, children:[]}, u, {id});
    out.unions[id].children = (out.unions[id].children||[]).filter(k => out.people[k]);
    if(out.unions[id].a && !out.people[out.unions[id].a]) out.unions[id].a = null;
    if(out.unions[id].b && !out.people[out.unions[id].b]) out.unions[id].b = null;
    const n = parseInt(String(id).replace(/\D/g, "")); if(n > max) max = n;
  }
  out.seq = Math.max(d.seq || 1, max + 1);
  return out;
}

/* ── storage ───────────────────────────────────────────── */
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(KEY, JSON.stringify({data:S, ui:{
        view:ui.view, mode:ui.mode, focus:ui.focus, style:ui.style,
        gens:ui.gens, isSample:ui.isSample
      }}));
    } catch(e){
      toast("Browser storage is full — save a family file", true);
    }
  }, 400);
}
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if(!raw) return false;
    const j = JSON.parse(raw);
    if(!j || !j.data || !j.data.people) return false;
    S = normalise(j.data);
    Object.assign(ui, j.ui || {});
    if(ui.focus && !P(ui.focus)) ui.focus = null;
    if(!CARD[ui.style]) ui.style = "standard";
    return Object.keys(S.people).length > 0;
  } catch(e){ return false; }
}

  const stage = $("#stage"), svg = $("#chart");
  let drag = null;
  const pointers = new Map();
  let pinch = null;

  svg.addEventListener("pointerdown", e => {
    svg.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size === 2){
      const [a, b] = [...pointers.values()];
      pinch = {d:Math.hypot(a.x-b.x, a.y-b.y), z:ui.z,
               cx:(a.x+b.x)/2, cy:(a.y+b.y)/2, tx:ui.tx, ty:ui.ty};
      drag = null; return;
    }
    const node = e.target.closest(".node");
    drag = {x:e.clientX, y:e.clientY, tx:ui.tx, ty:ui.ty, moved:false, node};
  });
  svg.addEventListener("pointermove", e => {
    if(pointers.has(e.pointerId)) pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinch && pointers.size === 2){
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      const k = clamp(pinch.z * (d / pinch.d), 0.06, 4);
      const r = stage.getBoundingClientRect();
      const px = pinch.cx - r.left, py = pinch.cy - r.top;
      ui.tx = px - (px - pinch.tx) * (k / pinch.z);
      ui.ty = py - (py - pinch.ty) * (k / pinch.z);
      ui.z = k; applyTransform(); return;
    }
    if(!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if(!drag.moved && Math.hypot(dx, dy) > 4){ drag.moved = true; svg.classList.add("panning"); }
    if(drag.moved){ ui.tx = drag.tx + dx; ui.ty = drag.ty + dy; applyTransform(); }
  });
  const end = e => {
    pointers.delete(e.pointerId);
    if(pointers.size < 2) pinch = null;
    if(drag && !drag.moved){
      if(drag.node) select(drag.node.dataset.id);
      else if(ui.sel){ ui.sel = null; renderRail(); renderInspector(); drawChart(); }
    }
    drag = null; svg.classList.remove("panning");
  };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);
  svg.addEventListener("dblclick", e => {
    const n = e.target.closest(".node");
    if(n){ select(n.dataset.id); ui.focus = n.dataset.id; if(ui.mode === "all") setMode("desc"); render(); fitView(); }
  });
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    const k = clamp(ui.z * Math.pow(0.9987, e.deltaY * (e.ctrlKey ? 3 : 1)), 0.06, 4);
    ui.tx = px - (px - ui.tx) * (k / ui.z);
    ui.ty = py - (py - ui.ty) * (k / ui.z);
    ui.z = k; applyTransform();
  }, {passive:false});
})();

function zoomBy(f){
  const r = $("#stage").getBoundingClientRect();
  const px = r.width/2, py = r.height/2;
  const k = clamp(ui.z * f, 0.06, 4);
  ui.tx = px - (px - ui.tx) * (k / ui.z);
  ui.ty = py - (py - ui.ty) * (k / ui.z);
  ui.z = k; applyTransform();
}

/* ── chrome events ─────────────────────────────────────── */
const VIEWS = {chart:"vChart", tree:"vTree", fan:"vFan", time:"vTime", register:"vList"};
const VIEW_NAME = {chart:"Register chart", tree:"Tree", fan:"Fan chart",
                   time:"Timeline", register:"Register list"};
function setView(v){
  if(!VIEWS[v]) v = "chart";
  ui.view = v;
  for(const k in VIEWS) $("#" + VIEWS[k]).setAttribute("aria-pressed", k === v);
  /* card detail and generation bands only mean anything on the chart */
  const chart = v === "chart";
  $("#tPhoto").disabled = !chart;
  $("#tGens").disabled  = !chart;
  $("#tPhoto").style.opacity = $("#tGens").style.opacity = chart ? "" : ".35";
  $(".legend").style.display = chart ? "" : "none";
  save();
}
function setMode(m){
  ui.mode = m;
  const sel = $("#scope");
  if(sel) sel.value = m;
  if((m === "desc" || m === "anc") && !ui.focus){
    const idx = buildIndex(), ids = Object.keys(S.people);
    if(ids.length){
      ui.focus = m === "anc"
        ? ids.slice().sort((a,b) => (parseInt(yearOf(P(b).birth))||0) - (parseInt(yearOf(P(a).birth))||0))[0]
        : ids.filter(id => !idx[id].childOf).sort((a,b) =>
            (parseInt(yearOf(P(a).birth))||9999) - (parseInt(yearOf(P(b).birth))||9999))[0] || ids[0];
    }
  }
  save();
}
for(const k in VIEWS)
  $("#" + VIEWS[k]).addEventListener("click", () => {
    setView(k); render(); fitView(); toast(VIEW_NAME[k]);
  });
$("#scope").addEventListener("change", e => { setMode(e.target.value); render(); fitView(); });

function addFlow(){
  snapshot();
  const id = addPerson({first:"", last:guessSurname()});
  ui.sel = id;
  if(!ui.focus) ui.focus = id;
  commit();
  const f = $("#inspBody").querySelector('[data-fld="first"]');
  if(f){ f.focus(); f.select(); }
}
function guessSurname(){
  const counts = {};
  for(const id in S.people){ const l = (P(id).last||"").trim(); if(l) counts[l] = (counts[l]||0)+1; }
  return Object.keys(counts).sort((a,b) => counts[b]-counts[a])[0] || "";
}

document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    if(!$("#scrim").hidden) return closeModal();
    if(ui.sel){ ui.sel = null; renderRail(); renderInspector(); drawChart(); }
    return;
  }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ""));
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){
    e.preventDefault(); e.shiftKey ? redo() : undo(); return;
  }
  if(typing || !$("#scrim").hidden) return;
  const k = e.key.toLowerCase();
  if(/^[1-5]$/.test(k)){
    e.preventDefault();
    const v = Object.keys(VIEWS)[+k - 1];
    setView(v); render(); fitView(); toast(VIEW_NAME[v]);
  }
  else if(k === "n"){ e.preventDefault(); addFlow(); }
  else if(k === "f"){ e.preventDefault(); fitView(); }
  else if(k === "p"){ e.preventDefault(); printDialog(); }
  else if(k === "/"){ e.preventDefault(); $("#app").classList.remove("rail-hidden"); $("#q").focus(); }
  else if(k === "+" || k === "="){ zoomBy(1.25); }
  else if(k === "-"){ zoomBy(0.8); }
});
window.addEventListener("beforeunload", e => {

});

/* ── boot ──────────────────────────────────────────────── */
(function boot(){
  try {
    const t = localStorage.getItem(KEY + ".theme");
    if(t) document.documentElement.setAttribute("data-theme", t);
  } catch(e){}

  const had = load();
  /* ?view=tree — so a link can open straight into the picture you meant */
  try {
    const want = new URLSearchParams(location.search).get("view");
    if(want && VIEWS[want]) ui.view = want;
  } catch(e){}

  if(!had) loadSample();
  else {
    setView(ui.view || "chart");
    setMode(ui.mode || "desc");
    printOpts.title = S.meta.title || ""; printOpts.subtitle = S.meta.subtitle || "";
    printOpts.note = S.meta.note || "";
    $("#tGens").setAttribute("aria-pressed", !!ui.gens);
    render();
    requestAnimationFrame(() => fitView());
  }
  $("#tGens").setAttribute("aria-pressed", !!ui.gens);

  /* redraw once the register faces land, so text measurement is right */
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(() => { drawChart(); });
  }
  /* the claude.ai viewer hands files to the reader through this; a plain
     file:// copy falls back to an ordinary download link */
  if(window.claude && window.claude.use){
    window.claude.use("downloads").then(d => { DL = d; }).catch(() => {});
  }
})();
