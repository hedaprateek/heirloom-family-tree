/* ═══════════════════════════════════════════════════════════
   SPREADSHEETS
   One row per person, with parents and partners named in their
   own columns — the shape a family actually fills in around a
   table. The same columns are written on export, so a sheet
   round-trips: export, edit in Excel, import back.

   .xlsx is read and written here rather than through a library:
   the format is a zip of XML, and the browser already has
   deflate (CompressionStream) and an XML parser.
   ═══════════════════════════════════════════════════════════ */
const SHEET_COLS = [
  {k:"id",         h:"ID",          w:9},
  {k:"first",      h:"First name",  w:16},
  {k:"last",       h:"Family name", w:16},
  {k:"maiden",     h:"Née",         w:14},
  {k:"sex",        h:"Sex",         w:6},
  {k:"birth",      h:"Born",        w:11},
  {k:"death",      h:"Died",        w:11},
  {k:"place",      h:"Place",       w:16},
  {k:"occupation", h:"Occupation",  w:18},
  {k:"father",     h:"Father",      w:20},
  {k:"mother",     h:"Mother",      w:20},
  {k:"partner",    h:"Partner",     w:20},
  {k:"married",    h:"Married",     w:10},
  {k:"divorced",   h:"Divorced",    w:9},
  {k:"notes",      h:"Notes",       w:34}
];
const COL_ALIASES = {
  fullname:  ["name","full name","person","who"],
  id:        ["id","ref","key","no","#"],
  first:     ["first name","first","given name","given","forename","firstname"],
  last:      ["family name","last name","last","surname","family","lastname"],
  maiden:    ["née","nee","maiden","maiden name","birth name","born as"],
  sex:       ["sex","gender","m/f"],
  birth:     ["born","birth","birth year","year born","dob","date of birth"],
  death:     ["died","death","death year","year died","dod","date of death"],
  place:     ["place","birthplace","city","town","village","from","location","lives in","native place"],
  occupation:["occupation","job","work","profession","role","business"],
  father:    ["father","dad","papa","parent 1","parent1"],
  mother:    ["mother","mum","mom","mother's name","parent 2","parent2"],
  partner:   ["partner","spouse","husband","wife","married to","partner name"],
  married:   ["married","marriage","marriage year","year married","wedding"],
  divorced:  ["divorced","separated","divorce"],
  notes:     ["notes","note","comments","remarks","story","about","details"]
};
const norm = s => String(s == null ? "" : s).trim().toLowerCase().replace(/[\s_.]+/g, " ");
function mapHeaders(row){
  const map = {};
  (row || []).forEach((cell, i) => {
    const t = norm(cell);
    if(!t) return;
    for(const k in COL_ALIASES)
      if(map[k] == null && COL_ALIASES[k].indexOf(t) >= 0){ map[k] = i; return; }
  });
  return map;
}

/* ── zip, just enough of it ─────────────────────────────── */
function crc32(buf){
  let t = crc32.t;
  if(!t){
    t = crc32.t = new Uint32Array(256);
    for(let n = 0; n < 256; n++){
      let c = n;
      for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
  }
  let crc = 0xFFFFFFFF;
  for(let i = 0; i < buf.length; i++) crc = (crc >>> 8) ^ t[(crc ^ buf[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
async function deflateRaw(bytes){
  if(typeof CompressionStream !== "function") return null;
  try {
    const cs = new CompressionStream("deflate-raw");
    return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer());
  } catch(e){ return null; }
}
async function inflateRaw(bytes){
  const ds = new DecompressionStream("deflate-raw");
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer());
}
async function zipBlob(entries){
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  for(const e of entries){
    const nameB = enc.encode(e.name);
    const data = typeof e.data === "string" ? enc.encode(e.data) : e.data;
    const crc = crc32(data);
    let comp = await deflateRaw(data), method = 8;
    if(!comp || comp.length >= data.length){ comp = data; method = 0; }
    const lh = new Uint8Array(30 + nameB.length), dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true);
    dv.setUint16(8, method, true); dv.setUint16(12, 0x2821, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, comp.length, true);
    dv.setUint32(22, data.length, true); dv.setUint16(26, nameB.length, true);
    lh.set(nameB, 30);
    parts.push(lh, comp);
    central.push({nameB, crc, csize:comp.length, size:data.length, method, offset});
    offset += lh.length + comp.length;
  }
  const cdStart = offset;
  for(const c of central){
    const ch = new Uint8Array(46 + c.nameB.length), dv = new DataView(ch.buffer);
    dv.setUint32(0, 0x02014b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 20, true);
    dv.setUint16(10, c.method, true); dv.setUint16(14, 0x2821, true);
    dv.setUint32(16, c.crc, true); dv.setUint32(20, c.csize, true); dv.setUint32(24, c.size, true);
    dv.setUint16(28, c.nameB.length, true); dv.setUint32(42, c.offset, true);
    ch.set(c.nameB, 46);
    parts.push(ch);
    offset += ch.length;
  }
  const end = new Uint8Array(22), dv = new DataView(end.buffer);
  dv.setUint32(0, 0x06054b50, true);
  dv.setUint16(8, central.length, true); dv.setUint16(10, central.length, true);
  dv.setUint32(12, offset - cdStart, true); dv.setUint32(16, cdStart, true);
  parts.push(end);
  return new Blob(parts, {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
async function zipRead(buffer){
  const u = new Uint8Array(buffer), dv = new DataView(buffer);
  let eo = -1;
  for(let i = u.length - 22; i >= 0 && i > u.length - 66000; i--)
    if(dv.getUint32(i, true) === 0x06054b50){ eo = i; break; }
  if(eo < 0) throw new Error("not a zip");
  const n = dv.getUint16(eo + 10, true);
  let p = dv.getUint32(eo + 16, true);
  const dec = new TextDecoder(), out = {};
  for(let i = 0; i < n; i++){
    const method  = dv.getUint16(p + 10, true);
    const csize   = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const exLen   = dv.getUint16(p + 30, true);
    const cmLen   = dv.getUint16(p + 32, true);
    const lho     = dv.getUint32(p + 42, true);
    const name    = dec.decode(u.subarray(p + 46, p + 46 + nameLen));
    const start   = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
    const raw     = u.subarray(start, start + csize);
    out[name] = method === 8 ? await inflateRaw(raw) : raw;
    p += 46 + nameLen + exLen + cmLen;
  }
  return out;
}

/* ── xlsx ───────────────────────────────────────────────── */
const xesc = s => String(s == null ? "" : s)
  .replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))
  .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");
function colLetter(i){
  let s = "";
  for(i += 1; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s;
  return s;
}
function sheetXML(rows, widths){
  let body = "";
  rows.forEach((row, r) => {
    let cells = "";
    (row || []).forEach((v, c) => {
      if(v == null || v === "") return;
      cells += `<c r="${colLetter(c)}${r+1}" t="inlineStr"${r === 0 ? ' s="1"' : ""}>`
             + `<is><t xml:space="preserve">${xesc(v)}</t></is></c>`;
    });
    body += `<row r="${r+1}">${cells}</row>`;
  });
  const cols = widths ? `<cols>${widths.map((w, i) =>
    `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols>` : "";
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
    + `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`
    + `<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`
    + cols + `<sheetData>${body}</sheetData></worksheet>`;
}
function xlsxBlob(sheets){
  const n = sheets.length;
  const files = [
    {name:"[Content_Types].xml", data:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`
      + `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`
      + `<Default Extension="xml" ContentType="application/xml"/>`
      + `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>`
      + `<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>`
      + sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")
      + `</Types>`},
    {name:"_rels/.rels", data:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
      + `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>`
      + `</Relationships>`},
    {name:"xl/workbook.xml", data:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"`
      + ` xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>`
      + sheets.map((s, i) => `<sheet name="${xesc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")
      + `</sheets></workbook>`},
    {name:"xl/_rels/workbook.xml.rels", data:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
      + sheets.map((_, i) => `<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")
      + `<Relationship Id="rId${n+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`
      + `</Relationships>`},
    {name:"xl/styles.xml", data:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`
      + `<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>`
      + `<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>`
      + `<fills count="2"><fill><patternFill patternType="none"/></fill>`
      + `<fill><patternFill patternType="gray125"/></fill></fills>`
      + `<borders count="1"><border/></borders>`
      + `<cellStyleXfs count="1"><xf/></cellStyleXfs>`
      + `<cellXfs count="2"><xf xfId="0"/><xf fontId="1" applyFont="1" xfId="0"/></cellXfs>`
      + `</styleSheet>`}
  ];
  sheets.forEach((s, i) => files.push(
    {name:`xl/worksheets/sheet${i+1}.xml`, data:sheetXML(s.rows, s.widths)}));
  return zipBlob(files);
}
/** Excel keeps dates as days since 1899-12-30; turn one back into something readable. */
function fromSerial(n){
  const d = new Date(Date.UTC(1899, 11, 30) + n * 86400000);
  if(isNaN(d)) return String(n);
  return d.getUTCDate() + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()]
       + " " + d.getUTCFullYear();
}
async function xlsxRead(buffer){
  const files = await zipRead(buffer);
  const dec = new TextDecoder();
  const shared = [];
  if(files["xl/sharedStrings.xml"]){
    const doc = new DOMParser().parseFromString(dec.decode(files["xl/sharedStrings.xml"]), "application/xml");
    for(const si of doc.getElementsByTagName("si")){
      let s = "";
      for(const t of si.getElementsByTagName("t")) s += t.textContent;
      shared.push(s);
    }
  }
  const name = files["xl/worksheets/sheet1.xml"] ? "xl/worksheets/sheet1.xml"
    : Object.keys(files).filter(k => /^xl\/worksheets\/.+\.xml$/.test(k)).sort()[0];
  if(!name) throw new Error("no worksheet");
  const doc = new DOMParser().parseFromString(dec.decode(files[name]), "application/xml");
  const rows = [];
  for(const row of doc.getElementsByTagName("row")){
    const cells = [];
    for(const c of row.getElementsByTagName("c")){
      const ref = c.getAttribute("r") || "";
      const letters = ref.replace(/[^A-Z]/g, "");
      let ci = 0;
      for(let i = 0; i < letters.length; i++) ci = ci * 26 + (letters.charCodeAt(i) - 64);
      ci = Math.max(0, ci - 1);
      const t = c.getAttribute("t");
      let v = "";
      if(t === "inlineStr"){
        for(const tt of c.getElementsByTagName("t")) v += tt.textContent;
      } else {
        const vs = c.getElementsByTagName("v");
        const raw = vs.length ? vs[0].textContent : "";
        v = t === "s" ? (shared[+raw] || "") : raw;
      }
      cells[ci] = v;
    }
    rows.push(cells);
  }
  return rows;
}

/* ── csv ────────────────────────────────────────────────── */
function csvParse(text){
  text = text.replace(/^﻿/, "");
  const first = text.slice(0, text.indexOf("\n") + 1 || text.length);
  const sep = (first.split("\t").length > first.split(",").length) ? "\t" : ",";
  const rows = [];
  let row = [], cur = "", q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    }
    else if(c === '"') q = true;
    else if(c === sep){ row.push(cur); cur = ""; }
    else if(c === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
    else if(c !== "\r") cur += c;
  }
  if(cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function csvBuild(rows){
  const cell = v => {
    const s = String(v == null ? "" : v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return "﻿" + rows.map(r => (r || []).map(cell).join(",")).join("\r\n");
}

/* ── the family as rows, and back again ─────────────────── */
function docToRows(){
  const idx = buildIndex();
  const rows = [SHEET_COLS.map(c => c.h)];
  for(const id in S.people){
    const p = P(id), i = idx[id];
    const partners = [], married = [], divorced = [];
    for(const uid of i.unions){
      const u = U(uid), sp = partnerOf(u, id);
      if(!sp || !P(sp)) continue;
      partners.push(fullName(P(sp)));
      married.push(u.date || "");
      divorced.push(u.divorced ? "yes" : "");
    }
    const par = {};
    i.parents.forEach(q => {
      const s = P(q).sex;
      if(s === "M" && !par.f) par.f = fullName(P(q));
      else if(s === "F" && !par.m) par.m = fullName(P(q));
      else if(!par.f) par.f = fullName(P(q));
      else par.m = fullName(P(q));
    });
    const v = {
      id, first:p.first, last:p.last, maiden:p.maiden, sex:p.sex,
      birth:p.birth, death:p.death, place:p.place, occupation:p.occupation,
      father:par.f || "", mother:par.m || "",
      partner:partners.join("; "), married:married.join("; "),
      divorced:divorced.some(Boolean) ? divorced.join("; ") : "",
      notes:p.notes
    };
    rows.push(SHEET_COLS.map(c => v[c.k] == null ? "" : v[c.k]));
  }
  return rows;
}

const TRUEISH = /^(y|yes|true|1|divorced|separated|d)$/i;
function rowsToDoc(rows){
  const warn = [];
  let hi = -1, map = null;
  for(let i = 0; i < Math.min(rows.length, 15); i++){
    const m = mapHeaders(rows[i]);
    const named = m.first != null || m.last != null || m.fullname != null;
    if(named && Object.keys(m).length >= 2){ hi = i; map = m; break; }
  }
  if(hi < 0) return {error:"No header row found. The top row should name the columns — First name, Born, Father, and so on."};

  const people = {}, unions = {}, recs = [];
  let seq = 1, useq = 1;
  const get = (r, k) => {
    const c = map[k];
    return c == null ? "" : String(r[c] == null ? "" : r[c]).trim();
  };
  /* a bare number in a date column is a year; a big one is an Excel date */
  const dateish = v => {
    if(/^\d+(\.\d+)?$/.test(v)){
      const n = +v;
      if(n > 20000 && n < 80000) return fromSerial(n);
      if(n >= 1000 && n <= 2200) return String(Math.round(n));
    }
    return v;
  };
  for(let i = hi + 1; i < rows.length; i++){
    const r = rows[i] || [];
    let first = get(r, "first"), last = get(r, "last");
    if(!first && !last && map.fullname != null){
      const parts = get(r, "fullname").split(/\s+/).filter(Boolean);
      if(parts.length){ last = parts.length > 1 ? parts.pop() : ""; first = parts.join(" "); }
    }
    if(!first && !last) continue;                       // blank or spacer row
    const id = get(r, "id") || ("s" + (seq++));
    if(people[id]){ warn.push(`Two rows share the ID “${id}” — the second was skipped.`); continue; }
    const sexRaw = get(r, "sex").toUpperCase()[0] || "";
    people[id] = {
      id, first, last, maiden:get(r, "maiden"),
      sex:"MF".indexOf(sexRaw) >= 0 ? sexRaw : (sexRaw ? "X" : ""),
      birth:dateish(get(r, "birth")), death:dateish(get(r, "death")),
      dead:false, place:get(r, "place"), occupation:get(r, "occupation"),
      notes:get(r, "notes"), photo:""
    };
    recs.push({id, row:i + 1,
      father:get(r, "father"), mother:get(r, "mother"),
      partners:get(r, "partner").split(/\s*[;|]\s*/).filter(Boolean),
      married :get(r, "married").split(/\s*[;|]\s*/),
      divorced:get(r, "divorced").split(/\s*[;|]\s*/)});
  }
  if(!recs.length) return {error:"The header row was found, but no rows had a name in them."};

  const byId = {}, byName = {};
  const index = pid => {
    const p = people[pid];
    byId[pid.toLowerCase()] = pid;
    const full = (p.first + " " + p.last).trim().toLowerCase();
    if(full) (byName[full] = byName[full] || []).push(pid);
    const f = (p.first || "").trim().toLowerCase();
    if(f && f !== full) (byName[f] = byName[f] || []).push(pid);
  };
  Object.keys(people).forEach(index);

  let invented = 0;
  function resolve(ref, role, row){
    const t = String(ref || "").trim();
    if(!t) return null;
    const key = t.toLowerCase();
    if(byId[key]) return byId[key];
    const hit = byName[key];
    if(hit && hit.length === 1) return hit[0];
    if(hit && hit.length > 1){
      warn.push(`Row ${row}: “${t}” matches ${hit.length} people, so the ${role} link was left off.`);
      return null;
    }
    /* named as someone's parent or partner but with no row of their own —
       give them a card so the link is not lost */
    const parts = t.split(/\s+/);
    const last = parts.length > 1 ? parts.pop() : "";
    const id = "s" + (seq++);
    people[id] = {id, first:parts.join(" "), last, maiden:"", sex:"", birth:"", death:"",
                  dead:false, place:"", occupation:"", notes:"", photo:""};
    index(id);
    invented++;
    return id;
  }
  function unionOf(a, b){
    for(const uid in unions){
      const u = unions[uid];
      if(a && b && ((u.a === a && u.b === b) || (u.a === b && u.b === a))) return uid;
      if(a && !b && u.a === a && !u.b) return uid;
      if(!a && b && u.b === b && !u.a) return uid;
    }
    const uid = "sv" + (useq++);
    unions[uid] = {id:uid, a:a || null, b:b || null, status:"married",
                   date:"", place:"", divorced:false, children:[]};
    return uid;
  }

  for(const rc of recs)                                  // partners first, so the
    rc.partners.forEach((name, j) => {                   // union carries its year
      const pid = resolve(name, "partner", rc.row);
      if(!pid || pid === rc.id) return;
      const u = unions[unionOf(rc.id, pid)];
      if(!u.date && rc.married[j]) u.date = dateish(String(rc.married[j]).trim());
      if(TRUEISH.test(String(rc.divorced[j] || "").trim())) u.divorced = true;
    });
  for(const rc of recs){
    const f = resolve(rc.father, "father", rc.row);
    const m = resolve(rc.mother, "mother", rc.row);
    if(!f && !m) continue;
    const u = unions[unionOf(f, m)];
    if(!u.children.includes(rc.id)) u.children.push(rc.id);
  }
  if(invented)
    warn.push(`${invented} ${invented === 1 ? "person was" : "people were"} named as a parent or partner without a row of their own — cards were made for them.`);

  const unknown = (rows[hi] || []).filter((c, i) =>
    norm(c) && !Object.keys(map).some(k => map[k] === i));
  if(unknown.length)
    warn.push(`Ignored ${unknown.length} column${unknown.length > 1 ? "s" : ""}: ${unknown.slice(0, 6).join(", ")}.`);

  return {doc:{people, unions, meta:Object.assign({}, S.meta), seq:seq + useq + 1},
          count:Object.keys(people).length, unions:Object.keys(unions).length, warn};
}

function importSheet(){

  inp.accept = ".xlsx,.csv,.tsv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv";
  inp.addEventListener("change", async () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    try {
      let rows;
      if(/\.xlsx$/i.test(f.name)) rows = await xlsxRead(await f.arrayBuffer());

}

/* ═══════════════════════════════════════════════════════════
   SHARING
   The whole family goes in the URL's fragment, so it never
   reaches a server — no account, no backend, nothing to run.
   Everyone who opens the link gets their own copy to explore
   and add to; changes come back as a link or a file.
   ═══════════════════════════════════════════════════════════ */
const HOSTED_URL = "https://hedaprateek.github.io/heirloom-family-tree/";

function b64url(bytes){
  let s = "";
  for(let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function unb64url(s){
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while(s.length % 4) s += "=";
  const bin = atob(s), out = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function pack(str){
  const bytes = new TextEncoder().encode(str);
  if(typeof CompressionStream === "function"){
    try {
      const cs = new CompressionStream("deflate-raw");
      const buf = await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer();
      return "z" + b64url(new Uint8Array(buf));
    } catch(e){ /* fall through to plain */ }
  }
  return "u" + b64url(bytes);
}
async function unpack(s){
  const bytes = unb64url(s.slice(1));
  if(s[0] === "z"){
    const ds = new DecompressionStream("deflate-raw");
    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
    return new TextDecoder().decode(buf);
  }
  return new TextDecoder().decode(bytes);
}
function linkBase(){
  if(location.protocol === "file:") return HOSTED_URL;
  return location.origin + location.pathname;
}
async function shareURL(o){
  o = o || {};
  const people = {};
  for(const id in S.people){
    const p = Object.assign({}, S.people[id]);
    if(!o.photos) p.photo = "";
    for(const k in p) if(p[k] === "" || p[k] === false) delete p[k];
    p.id = id;
    people[id] = p;
  }
  const meta = Object.assign({}, S.meta);
  if(o.by) meta.sharedBy = o.by;
  if(o.contributor){ meta.contributedBy = o.contributor; delete meta.sharedBy; }
  const doc = {app:"heirloom", version:1, data:{people, unions:S.unions, meta, seq:S.seq}};
  const packed = await pack(JSON.stringify(doc));
  const q = o.view && o.view !== "chart" ? "?view=" + o.view : "";
  return (o.base || linkBase()) + q + "#f=" + packed;
}
/** Pull a family out of a pasted Heirloom link. */
async function docFromLink(text){
  const m = String(text || "").match(/#f=([A-Za-z0-9\-_]+)/);
  if(!m) return null;
  try {
    const j = JSON.parse(await unpack(m[1]));
    const d = j && j.data ? j.data : j;
    return d && d.people ? d : null;
  } catch(e){ return null; }
}
/** How many people this copy has gained since it arrived. */
function addedSince(){
  if(!ORIGIN || !ORIGIN.baseIds) return 0;
  const had = new Set(ORIGIN.baseIds);
  return Object.keys(S.people).filter(id => !had.has(id)).length;
}

/** Fold another copy of the family into this one, matching on name + birth year. */
function mergeDoc(inc){
  const keyOf = p => (fullName(p) + "|" + yearOf(p.birth)).toLowerCase();
  const mine = {};
  for(const id in S.people) mine[keyOf(S.people[id])] = id;
  const map = {};
  let added = 0, matched = 0, filled = 0;
  for(const id in inc.people){
    const p = inc.people[id], k = keyOf(p);
    if(mine[k]){
      map[id] = mine[k];
      matched++;
      const t = S.people[mine[k]];
      for(const f of ["maiden","sex","death","place","occupation","notes","photo"])
        if(!t[f] && p[f]){ t[f] = p[f]; filled++; }
    } else {
      const copy = Object.assign({}, p);
      delete copy.id;
      map[id] = addPerson(copy);
      added++;
    }
  }
  let links = 0;
  for(const uid in inc.unions){
    const u = inc.unions[uid];
    const a = u.a ? map[u.a] : null, b = u.b ? map[u.b] : null;
    if(!a && !b) continue;
    let tid = (a && b) ? unionBetween(a, b, false) : null;
    if(!tid){
      tid = addUnion(a, b, {status:u.status || "married", date:u.date || "",
                            place:u.place || "", divorced:!!u.divorced});
      links++;
    }
    const t = U(tid);
    for(const k of (u.children || [])){
      const lk = map[k];
      if(lk && !t.children.includes(lk) && !parentUnion(lk, false)){ t.children.push(lk); links++; }
    }
  }
  return {added, matched, filled, links};
}
function mergeReport(r){
  const bits = [];
  bits.push(r.added ? r.added + (r.added === 1 ? " person added" : " people added") : "nobody new");
  if(r.matched) bits.push(r.matched + " already here");
  if(r.filled)  bits.push(r.filled + " blank details filled in");
  if(r.links)   bits.push(r.links + " links joined up");
  return bits.join(" · ");
}
function importDoc(d, mode, fromShare){
  snapshot();
  if(mode === "merge"){
    const r = mergeDoc(normalise(d));
    save(); render();
    toast(mergeReport(r));
  } else {
    S = normalise(d);
    if(!d.meta || !d.meta.title) resetHeading();
    ui.isSample = false; ui.sel = null; ui.focus = null;
    /* remember this arrived from someone, so additions can go back to them */
    ORIGIN = fromShare
      ? {by:(d.meta && d.meta.sharedBy) || "", at:Date.now(), baseIds:Object.keys(S.people)}
      : null;
    save(); render(); fitView();
    toast("Opened " + Object.keys(S.people).length + " people");
  }
}

/* ── stage interaction ─────────────────────────────────── */
let userMoved = false;             // has the reader panned or zoomed yet
(function stageEvents(){
  const stage = $("#stage"), svg = $("#chart");
  let drag = null;
  const pointers = new Map();
  let pinch = null;

  svg.addEventListener("pointerdown", e => {
    svg.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size === 2){
      const [a, b] = [...pointers.values()];
      pinch = {d:Math.hypot(a.x-b.x, a.y-b.y), z:ui.z,
               cx:(a.x+b.x)/2, cy:(a.y+b.y)/2, tx:ui.tx, ty:ui.ty};
      drag = null; return;
    }
    const node = e.target.closest(".node");
    drag = {x:e.clientX, y:e.clientY, tx:ui.tx, ty:ui.ty, moved:false, node};
  });
  svg.addEventListener("pointermove", e => {
    if(pointers.has(e.pointerId)) pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinch && pointers.size === 2){
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      const k = clamp(pinch.z * (d / pinch.d), 0.06, 4);
      const r = stage.getBoundingClientRect();
      const px = pinch.cx - r.left, py = pinch.cy - r.top;
      ui.tx = px - (px - pinch.tx) * (k / pinch.z);
      ui.ty = py - (py - pinch.ty) * (k / pinch.z);
      ui.z = k; userMoved = true; applyTransform(); return;
    }
    if(!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if(!drag.moved && Math.hypot(dx, dy) > 4){ drag.moved = true; svg.classList.add("panning"); }
    if(drag.moved){ userMoved = true; ui.tx = drag.tx + dx; ui.ty = drag.ty + dy; applyTransform(); }
  });
  const end = e => {
    pointers.delete(e.pointerId);
    if(pointers.size < 2) pinch = null;
    if(drag && !drag.moved){
      if(drag.node) select(drag.node.dataset.id);
      else if(ui.sel){ ui.sel = null; renderRail(); renderInspector(); drawChart(); }
    }
    drag = null; svg.classList.remove("panning");
  };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);
  svg.addEventListener("dblclick", e => {
    const n = e.target.closest(".node");
    if(n){ select(n.dataset.id); ui.focus = n.dataset.id; if(ui.mode === "all") setMode("desc"); render(); fitView(); }
  });
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    const k = clamp(ui.z * Math.pow(0.9987, e.deltaY * (e.ctrlKey ? 3 : 1)), 0.06, 4);
    ui.tx = px - (px - ui.tx) * (k / ui.z);
    ui.ty = py - (py - ui.ty) * (k / ui.z);
    ui.z = k; userMoved = true; applyTransform();
  }, {passive:false});
})();

function zoomBy(f){
  userMoved = true;
  const r = $("#stage").getBoundingClientRect();
  const px = r.width/2, py = r.height/2;
  const k = clamp(ui.z * f, 0.06, 4);
  ui.tx = px - (px - ui.tx) * (k / ui.z);
  ui.ty = py - (py - ui.ty) * (k / ui.z);
  ui.z = k; applyTransform();
}

document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    if(!$("#scrim").hidden) return closeModal();
    if(ui.sel){ ui.sel = null; renderRail(); renderInspector(); drawChart(); }
    return;
  }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ""));
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){
    e.preventDefault(); e.shiftKey ? redo() : undo(); return;
  }
  if(typing || !$("#scrim").hidden) return;
  const k = e.key.toLowerCase();
  if(/^[1-6]$/.test(k)){
    e.preventDefault();
    const v = Object.keys(VIEWS)[+k - 1];
    setView(v); render(); fitView(); toast(VIEW_NAME[v]);
  }
  else if(k === "n"){ e.preventDefault(); addFlow(); }
  else if(k === "f"){ e.preventDefault(); fitView(); }
  else if(k === "p"){ e.preventDefault(); printDialog(); }
  else if(k === "/"){ e.preventDefault(); $("#app").classList.remove("rail-hidden"); $("#q").focus(); }
  else if(k === "+" || k === "="){ zoomBy(1.25); }
  else if(k === "-"){ zoomBy(0.8); }
});

/* ── boot ──────────────────────────────────────────────── */
(function boot(){
  try {
    const t = localStorage.getItem(KEY + ".theme");
    if(t) document.documentElement.setAttribute("data-theme", t);
  } catch(e){}

  const had = load();
  /* ?view=tree — so a link can open straight into the picture you meant */
  try {
    const q = new URLSearchParams(location.search);
    const want = q.get("view");
    if(want && VIEWS[want]) ui.view = want;
    const shape = q.get("shape");
    if(shape === "rows" || shape === "canopy") ui.treeStyle = shape;
  } catch(e){}

  if(!had) loadSample();
  else {
    setView(ui.view || "chart");
    setMode(ui.mode || "desc");
    printOpts.title = S.meta.title || ""; printOpts.subtitle = S.meta.subtitle || "";
    printOpts.note = S.meta.note || "";
    $("#tGens").setAttribute("aria-pressed", !!ui.gens);
    render();
    requestAnimationFrame(() => fitView());
  }
  $("#tGens").setAttribute("aria-pressed", !!ui.gens);
  $("#tInlaw").setAttribute("aria-pressed", !!ui.softInlaw);
  $("#tDates").setAttribute("aria-pressed", ui.dates === "full");

  /* Redraw once the register faces land — text measures wider then, so the
     first fit was against the fallback metrics. Re-fit unless the reader has
     already taken hold of the chart. */
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(() => { drawChart(); if(!userMoved) fitView(); });
  }
  /* the claude.ai viewer hands files to the reader through this; a plain
     file:// copy falls back to an ordinary download link */
  if(window.claude && window.claude.use){
    window.claude.use("downloads").then(d => { DL = d; }).catch(() => {});
  }

  /* #f= carries a whole family; the fragment never leaves the browser */
  const frag = location.hash.match(/^#f=(.+)$/);
  if(frag){
    try { history.replaceState(null, "", location.pathname + location.search); } catch(e){}
    unpack(frag[1])
      .then(txt => {
        const j = JSON.parse(txt);
        const d = j && j.data ? j.data : j;
        if(!d || !d.people) throw new Error("empty");
        offerIncoming(d);
      })
      .catch(() => toast("That shared link could not be read", true));
  }
})();
