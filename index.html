    dl.push({t:"rect", x:c.x - c.w/2, y:c.y - c.h/2, w:c.w, h:c.h, r:PILL_H/2.6,
             fill:pal.card, stroke:pal.line2, sw:1});
    c.members.forEach((pid, i) => {
      const p = P(pid), nx = pos[pid].x, nw = personW(pid);
      if(i){                                                     // union glyph in the gap
        const prev = c.members[i-1];
        const rel = (mate[prev] || []).find(m => m.pid === pid);
        const u = rel && rel.u;
        const gx = (pos[prev].x + personW(prev) + nx) / 2;
        dl.push({t:"text", x:gx, y:c.y + 4.5, anchor:"middle", size:SSZ, fill:pal.brass,
                 s:u && u.divorced ? "⚮" : (u && u.status === "partners" ? "◇" : "⚭")});
      }
      let tx = nx + 11, tw = nw - 22;
      if(showPhoto){
        const r = PHOTO/2, cx = nx + 8 + r;
        if(p.photo) dl.push({t:"image", pid, href:p.photo, x:nx + 8, y:c.y - r, w:PHOTO, h:PHOTO,
                             clip:{cx, cy:c.y, r}});
        else {
          dl.push({t:"circle", cx, cy:c.y, r, fill:mix(pal.card, pal.accent, .18)});
          dl.push({t:"text", x:cx, y:c.y + 5, s:initials(p), size:Math.round(r * .85),
                   weight:600, fill:pal.ink2, anchor:"middle"});
        }
        dl.push({t:"circle", cx, cy:c.y, r, stroke:pal.line2, sw:1});
        tx = nx + 8 + PHOTO + 9; tw = nw - (tx - nx) - 10;
      }
      const yr = showYear ? lifeLine(p) : "";
      const soft = softly(pid), nsz = sizeOf(pid), wt = soft ? 500 : 600;
      dl.push({t:"text", x:tx, y:c.y + (yr ? -2 : 4.5), s:fitTo(nameOf(pid), tw, nsz, "ui", wt),
               size:nsz, weight:wt, fill:soft ? pal.ink2 : pal.ink});
      if(yr) dl.push({t:"text", x:tx, y:c.y + 14, s:yr, size:YSZ, fam:"mono",
                      fill:soft ? pal.ink3 : pal.ink2});
      const sire = (pos[pid] || {}).sire;
      if(sire) dl.push({t:"text", x:nx + nw/2, y:c.y + c.h/2 + 14, anchor:"middle",
                        s:fitTo(sire, nw + 44, 9.5, "ui"), size:9.5, fill:pal.ink3});
      hits.push({pid, x:nx - 3, y:c.y - c.h/2, w:nw + 6, h:c.h, depth:c.depth});
    });
  }

  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for(const c of cells){
    x0 = Math.min(x0, c.x - c.w/2); x1 = Math.max(x1, c.x + c.w/2);
    y0 = Math.min(y0, c.y - c.h/2 - 64); y1 = Math.max(y1, c.y + c.h/2);
  }
  if(ui.gens) x0 -= 56;
  y1 += ROW * 0.55 + 30;
  return {kind:"tree", dl, hits, nodes:hits, rows:base.rows, ancestors:base.ancestors,
          box:{x:x0 - PAD, y:y0 - PAD, w:(x1 - x0) + PAD*2, h:(y1 - y0) + PAD*2}};
}

function treeCanopyView(pal){
  /* three densities, driven by the same card-detail button as the chart */
  const showYear  = ui.style !== "compact";
  const showPhoto = ui.style === "portrait";
  const TAG_H = showPhoto ? 54 : (showYear ? 44 : 32);
  const PHOTO = TAG_H - 16;
  const SPAN  = 152;                 // how wide the crown opens, in degrees
  const RING  = TAG_H + 96;          // shortest reach from one generation to the next
  const RAD   = Math.PI / 180;
  const YSZ2  = 9.5;                 // dates sit smaller here than on the chart

  const base = layout();             // for structure, marriages and who married in
  if(!base) return null;
  const idx = buildIndex();
  const seat = {}; base.nodes.forEach(n => { seat[n.pid] = n; });

  const mate = {};
  for(const b of base.bands){
    const u = U(b.uid);
    if(!u || !u.a || !u.b || !seat[u.a] || !seat[u.b]) continue;
    (mate[u.a] = mate[u.a] || []).push({pid:u.b, u});
    (mate[u.b] = mate[u.b] || []).push({pid:u.a, u});
  }

  /* one label per person and whoever they married; the hub of a remarriage
     claims its label first, so nobody is written twice */
  const cellOf = {}, cells = [];
  const order = base.nodes.slice().sort((a, b) =>
    ((mate[b.pid] || []).length - (mate[a.pid] || []).length) || (a.x - b.x));
  for(const n of order){
    if(cellOf[n.pid]) continue;
    const members = [n.pid];
    for(const m of (mate[n.pid] || [])) if(!cellOf[m.pid]) members.push(m.pid);
    members.sort((p, q) => seat[p].x - seat[q].x);
    const cell = {members, seatX:seat[n.pid].x, h:TAG_H};
    members.forEach(p => { cellOf[p] = cell; });
    cells.push(cell);
  }

  /* measure each label so the crown can be opened wide enough to fit them */
  const runW = r => measure(r.s, r.sep ? SSZ : (softly(r.pid) ? NSZ - 1.5 : NSZ),
                            "ui", r.sep ? 400 : (softly(r.pid) ? 500 : 600));
  for(const c of cells){
    const runs = [];
    c.members.forEach((pid, i) => {
      if(i){
        const rel = (mate[c.members[i-1]] || []).find(m => m.pid === pid);
        const u = rel && rel.u;
        runs.push({sep:true, s:u && u.divorced ? "⚮" : (u && u.status === "partners" ? "◇" : "⚭")});
      }
      runs.push({pid, s:fullName(P(pid))});
    });
    const total = rs => rs.reduce((t, r) => t + runW(r) + 10, 0)
                      + 12 + (showPhoto ? c.members.length * (PHOTO + 8) : 0);
    if(total(runs) > 330)
      runs.forEach((r, i) => { if(!r.sep && i > 0) r.s = P(r.pid).first || r.s; });
    c.runs = runs;
    c.w = Math.max(80, Math.min(360, total(runs)));
  }

  /* who grows out of whom */
  const kids = new Map(); cells.forEach(c => kids.set(c, []));
  for(const uid in S.unions){
    const u = S.unions[uid];
    const src = cellOf[u.a] || cellOf[u.b];
    if(!src) continue;
    for(const k of (u.children || [])){
      const dst = cellOf[k];
      if(dst && dst !== src && !kids.get(src).includes(dst)){ kids.get(src).push(dst); dst.parent = src; }
    }
  }
  cells.forEach(c => kids.get(c).sort((a, b) => a.seatX - b.seatX));
  const isChild = new Set();
  kids.forEach(ks => ks.forEach(k => isChild.add(k)));
  const roots = cells.filter(c => !isChild.has(c));
  if(!roots.length) return null;

  const leafW = c => {
    if(c._lv != null) return c._lv;
    c._lv = 1;                                    // guards a cycle
    const k = kids.get(c);
    return (c._lv = k.length ? k.reduce((t, x) => t + leafW(x), 0) : 1);
  };
  const grown = {};
  function descOf(pid){
    if(grown[pid] != null) return grown[pid];
    grown[pid] = 0;
    let n = 0;
    for(const uid of idx[pid].unions)
      for(const k of (U(uid).children || [])) if(S.people[k]) n += 1 + descOf(k);
    return (grown[pid] = n);
  }
  const limbW = c => clamp(8 + Math.sqrt(Math.max.apply(null, c.members.map(descOf))) * 5.4, 8, 62);

  /* Grow one tree: the crown opens into a fan, and each ring is pushed out
     until the labels on it stop touching. */
  function grow(root){
    (function allot(c, a0, a1){
      c.a0 = a0; c.a1 = a1;
      const ks = kids.get(c);
      let a = a0;
      for(const k of ks){ const w = (a1 - a0) * (leafW(k) / leafW(c)); allot(k, a, a + w); a += w; }
    })(root, -90 - SPAN/2, -90 + SPAN/2);

    const all = [];
    (function walk(c, d){ c.gen = d; all.push(c); kids.get(c).forEach(k => walk(k, d + 1)); })(root, 0);
    for(const c of all){
      if(c === root){ c.ang = -90; continue; }
      const r = rng(hash32(c.members[0] + "ang"));
      c.ang = c.a0 + (c.a1 - c.a0) * (0.5 + (r() - 0.5) * 0.2);   // a little wander
    }

    /* Push each ring out until its labels clear both each other and every
       label already hung — a low branch curls back near an inner one, so
       same-ring checking alone is not enough. */
    const deep = all.reduce((m, c) => Math.max(m, c.gen), 0);
    const reach = [0];
    root.x = 0; root.y = 0;
    const hung = [root];
    const clashes = (ax, ay, aw, b) =>
      Math.abs(ax - b.x) < (aw + b.w) / 2 + 18 && Math.abs(ay - b.y) < TAG_H + 15;
    for(let d = 1; d <= deep; d++){
      const ring = all.filter(c => c.gen === d).sort((p, q) => p.ang - q.ang);
      let r = reach[d-1] + RING;
      for(let i = 0; i < 90; i++){
        const pts = ring.map(c => [r * Math.cos(c.ang * RAD), r * Math.sin(c.ang * RAD)]);
        let clash = false;
        for(let j = 0; j < ring.length && !clash; j++){
          for(let k = j + 1; k < ring.length && !clash; k++)
            if(clashes(pts[j][0], pts[j][1], ring[j].w, {x:pts[k][0], y:pts[k][1], w:ring[k].w})) clash = true;
          for(let k = 0; k < hung.length && !clash; k++)
            if(clashes(pts[j][0], pts[j][1], ring[j].w, hung[k])) clash = true;
        }
        if(!clash) break;
        r *= 1.05;
      }
      reach[d] = r;
      ring.forEach(c => {
        c.x = r * Math.cos(c.ang * RAD);
        c.y = r * Math.sin(c.ang * RAD);
        hung.push(c);
      });
    }
    return all;
  }

  /* a filled limb that leaves the parent along its own growth and arrives
     along the child's, tapering as it goes */
  function limb(c, w1, w2){
    const p = c.parent;
    const px = p.x, py = p.y, cx = c.x, cy = c.y;
    const L = Math.hypot(cx - px, cy - py);
    /* a short limb carrying a wide line would bulge into a blob */
    const cap = Math.max(6, L * 0.6);
    w1 = Math.min(w1, cap); w2 = Math.min(w2, cap);
    const pd = p.parent ? p.ang : -90;
    const k1 = L * 0.46, k2 = L * 0.34;
    const c1 = [px + Math.cos(pd * RAD) * k1, py + Math.sin(pd * RAD) * k1];
    const c2 = [cx - Math.cos(c.ang * RAD) * k2, cy - Math.sin(c.ang * RAD) * k2];
    const unit = (ax, ay) => { const m = Math.hypot(ax, ay) || 1; return [-ay / m, ax / m]; };
    const n1 = unit(c1[0] - px, c1[1] - py), n2 = unit(cx - c2[0], cy - c2[1]);
    const off = (pt, n, w, s) => `${r1(pt[0] + n[0] * w / 2 * s)} ${r1(pt[1] + n[1] * w / 2 * s)}`;
    return `M${off([px,py], n1, w1, 1)} C${off(c1, n1, w1, 1)} ${off(c2, n2, w2, 1)} ${off([cx,cy], n2, w2, 1)} `
         + `L${off([cx,cy], n2, w2, -1)} C${off(c2, n2, w2, -1)} ${off(c1, n1, w1, -1)} ${off([px,py], n1, w1, -1)} Z`;
  }

  const dl = [], hits = [];
  const GREENS = [pal.accent, mix(pal.accent, pal.ink, .26), mix(pal.accent, pal.card, .3),
                  mix(pal.accent, pal.brass, .22)];
  function foliage(cx, cy, seed, count, big){
    const r = rng(seed);
    for(let i = 0; i < count; i++){
      const a  = -180 + r() * 360;
      const rad = (big ? 8 : 6) + r() * r() * (big ? 52 : 22);
      const L  = (big ? 17 : 12) + r() * (big ? 17 : 9);
      const px = cx + Math.cos(a * RAD) * rad;
      const py = cy + Math.sin(a * RAD) * rad * .82;
      dl.push({t:"path", d:almond(px, py, L, L * .46), fill:GREENS[(i * 3 + seed) % 4],
               alpha:.26 + r() * .32, rot:a + 90, rx:px, ry:py});
    }
  }

  /* grow each unconnected tree, then stand them side by side */
  const trees = roots.map(grow);
  let shift = 0;
  trees.forEach(all => {
    let lo = Infinity, hi = -Infinity;
    all.forEach(c => { lo = Math.min(lo, c.x - c.w/2 - 60); hi = Math.max(hi, c.x + c.w/2 + 60); });
    all.forEach(c => { c.x += shift - lo; });
    shift += (hi - lo) + 90;
  });

  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for(const all of trees){
    const root = all[0];
    const trunkTop = root.y + TAG_H/2 - 2;
    const ground = trunkTop + RING * 0.82;
    const tw = limbW(root) * 1.75;

    dl.push({t:"path", fill:pal.bark, alpha:.95,
             d:taper(root.x, trunkTop, root.x, ground, tw, tw * 1.7)});
    for(const k of [-1, 1]){
      dl.push({t:"path", stroke:pal.bark, sw:Math.max(2.5, tw * 0.36), cap:"round", alpha:.55,
               d:`M${r1(root.x)} ${r1(ground - 10)} Q${r1(root.x + k * tw * 1.9)} ${r1(ground + 8)} ${r1(root.x + k * (tw * 3.2 + 28))} ${r1(ground + 18)}`});
      dl.push({t:"path", stroke:pal.bark, sw:Math.max(1.6, tw * 0.2), cap:"round", alpha:.34,
               d:`M${r1(root.x)} ${r1(ground - 5)} Q${r1(root.x + k * tw * 1.1)} ${r1(ground + 13)} ${r1(root.x + k * (tw * 1.8 + 13))} ${r1(ground + 23)}`});
    }
    dl.push({t:"path", stroke:pal.line2, sw:1.3, cap:"round", alpha:.5,
             d:`M${r1(root.x - tw * 4.8 - 36)} ${r1(ground + 21)} H${r1(root.x + tw * 4.8 + 36)}`});
    y1 = Math.max(y1, ground + 30);

    /* limbs, thickest first so the forks sit cleanly on top of each other */
    const limbs = all.filter(c => c.parent).sort((a, b) => limbW(b) - limbW(a));
    for(const c of limbs){
      const w = limbW(c);
      dl.push({t:"path", d:limb(c, w * 1.25, w * 0.8), fill:pal.bark, alpha:.93});
    }
    /* new growth at the tips, a scatter of it further in */
    for(const c of all){
      const tip = !kids.get(c).length;
      const out = tip ? 42 : 20;
      const fx = c.x + Math.cos(c.ang * RAD) * out;
      const fy = c.y + Math.sin(c.ang * RAD) * out - (tip ? 6 : 0);
      foliage(fx, fy, hash32(c.members[0]), tip ? 13 : 4, tip);
    }
  }

  /* the labels go on last so nothing grows over a name */
  for(const all of trees){
    for(const c of all){
      const left = c.x - c.w/2, top = c.y - c.h/2;
      dl.push({t:"rect", x:left, y:top + 2.5, w:c.w, h:c.h, r:c.h/2.6, fill:pal.line2, alpha:.3});
      dl.push({t:"rect", x:left, y:top, w:c.w, h:c.h, r:c.h/2.6,
               fill:pal.card, stroke:pal.line2, sw:1});
      let cx = left + 8;
      c.runs.forEach(r => {
        if(r.sep){
          dl.push({t:"text", x:cx + runW(r)/2, y:c.y + 4.5, s:r.s, size:SSZ,
                   fill:pal.brass, anchor:"middle"});
          cx += runW(r) + 10;
          return;
        }
        const p = P(r.pid), soft = softly(r.pid);
        if(showPhoto){
          const rr = PHOTO/2, pcx = cx + rr;
          if(p.photo) dl.push({t:"image", pid:r.pid, href:p.photo, x:cx, y:c.y - rr,
                               w:PHOTO, h:PHOTO, clip:{cx:pcx, cy:c.y, r:rr}});
          else {
            dl.push({t:"circle", cx:pcx, cy:c.y, r:rr, fill:mix(pal.card, pal.accent, .18)});
            dl.push({t:"text", x:pcx, y:c.y + 5, s:initials(p), size:Math.round(rr * .85),
                     weight:600, fill:pal.ink2, anchor:"middle"});
          }
          dl.push({t:"circle", cx:pcx, cy:c.y, r:rr, stroke:pal.line2, sw:1});
          cx += PHOTO + 8;
        }
        const yr = showYear ? lifeLine(p) : "";
        const nsz = soft ? NSZ - 1.5 : NSZ, wt = soft ? 500 : 600;
        dl.push({t:"text", x:cx, y:c.y + (yr ? -2 : 4.5), s:r.s, size:nsz, weight:wt,
                 fill:soft ? pal.ink2 : pal.ink});
        if(yr) dl.push({t:"text", x:cx, y:c.y + 14, s:yr, size:YSZ2, fam:"mono",
                        fill:soft ? pal.ink3 : pal.ink2});
        const sire = (seat[r.pid] || {}).sire;
        if(sire) dl.push({t:"text", x:cx, y:c.y + c.h/2 + 13,
                          s:fitTo(sire, c.w, 9.5, "ui"), size:9.5, fill:pal.ink3});
        hits.push({pid:r.pid, x:cx - 6, y:top, w:runW(r) + 12, h:c.h, depth:c.gen});
        cx += runW(r) + 10;
      });
      x0 = Math.min(x0, left - 56); x1 = Math.max(x1, left + c.w + 56);
      y0 = Math.min(y0, top - 62);  y1 = Math.max(y1, top + c.h + 16);
    }
  }

  return {kind:"tree", dl, hits, nodes:hits, rows:base.rows, ancestors:base.ancestors,
          box:{x:x0 - PAD, y:y0 - PAD, w:(x1 - x0) + PAD*2, h:(y1 - y0) + PAD*2}};
}
/* ── FAN ───────────────────────────────────────────────────
   Generations as concentric rings, each person's slice sized
   by how much of the family sits behind them.
   ──────────────────────────────────────────────────────── */
function fanView(pal){
  const idx = buildIndex();
  const anc = ui.mode === "anc";
  let rootId = ui.focus && P(ui.focus) ? ui.focus : null;
  if(!rootId){
    const ids = Object.keys(S.people);
    if(!ids.length) return null;
    rootId = anc ? ids.slice().sort((a,b) => byBirth(b, a))[0]
                 : ids.filter(id => !idx[id].childOf).sort(byBirth)[0] || ids[0];
  }
  const MAXD = 7;
  const seen = new Set();
  function node(pid, d){
    const n = {pid, d, kids:[], spouses:[]};
    if(!seen.has(pid) && d < MAXD){
      seen.add(pid);
      if(anc){
        n.kids = idx[pid].parents.map(q => node(q, d + 1));
      } else {
        for(const uid of idx[pid].unions){
          const u = U(uid), sp = partnerOf(u, pid);
          if(sp && S.people[sp]) n.spouses.push(sp);
          for(const k of (u.children || []).slice().sort(byBirth))
            if(S.people[k]) n.kids.push(node(k, d + 1));
        }
      }
    }
    n.leaves = n.kids.length ? n.kids.reduce((a, k) => a + k.leaves, 0) : 1;
    return n;
  }
  const root = node(rootId, 0);

  const R0 = 86, RW = 80;
  /* descendants close to a near-full ring, leaving a hairline seam at the foot */
  const SPAN = anc ? 180 : 356, A0 = anc ? 180 : -90 - SPAN/2;
  (function assign(n, a0, a1){
    n.a0 = a0; n.a1 = a1;
    let a = a0;
    for(const k of n.kids){ const w = (a1 - a0) * (k.leaves / n.leaves); assign(k, a, a + w); a += w; }
  })(root, A0, A0 + SPAN);

  const dl = [], hits = [];
  let maxD = 0;
  (function scan(n){ maxD = Math.max(maxD, n.d); n.kids.forEach(scan); })(root);
  const Rmax = R0 + maxD * RW;

  for(let d = 1; d <= maxD; d++)                                   // ring hairlines
    dl.push({t:"circle", cx:0, cy:0, r:R0 + d * RW, stroke:pal.line, sw:1, alpha:.5});

  (function draw(n){
    if(n.d > 0){
      const ri = R0 + (n.d - 1) * RW, ro = ri + RW - 5;
      const span = n.a1 - n.a0, am = (n.a0 + n.a1) / 2, rm = (ri + ro) / 2;
      const d = sector(0, 0, ri, ro, n.a0, n.a1);
      dl.push({t:"path", d, fill:mix(pal.card, pal.accent, Math.min(.40, .05 + n.d * .085)),
               stroke:pal.line2, sw:.9});

      const p = P(n.pid);
      const nameSz = n.d >= 4 ? 11 : 12.5;
      const arcLen = span * Math.PI / 180 * rm;
      let name = fullName(p);
      const yrs = lifeLine(p);
      if(arcLen >= measure(name, nameSz, "ui", 600) + 14){
        let rot = am + 90; if(upsideDown(rot)) rot = am - 90;
        const px = rm * Math.cos(am * Math.PI/180), py = rm * Math.sin(am * Math.PI/180);
        dl.push({t:"text", x:px, y:py + (yrs ? -1 : 4), s:fitTo(name, arcLen - 12, nameSz, "ui", 600),
                 size:nameSz, weight:600, fill:pal.ink, anchor:"middle", rot, rx:px, ry:py});
        if(yrs && arcLen > 88)
          dl.push({t:"text", x:px, y:py + 11, s:yrs, size:9, fam:"mono", fill:pal.ink2,
                   anchor:"middle", rot, rx:px, ry:py});
      } else {
        const flip = upsideDown(am);
        const at = flip ? ro - 8 : ri + 8, rot = flip ? am + 180 : am;
        const px = at * Math.cos(am * Math.PI/180), py = at * Math.sin(am * Math.PI/180);
        dl.push({t:"text", x:px, y:py + 3.5, s:fitTo(name, ro - ri - 16, nameSz, "ui", 600),
                 size:nameSz, weight:600, fill:pal.ink, anchor:"start", rot, rx:px, ry:py});
      }
      const hx = rm * Math.cos(am * Math.PI/180), hy = rm * Math.sin(am * Math.PI/180);
      hits.push({pid:n.pid, d, x:hx - 26, y:hy - 14, w:52, h:28, depth:n.d});
    }
    n.kids.forEach(draw);
  })(root);

  /* the middle: whoever the fan is drawn around */
  dl.push({t:"circle", cx:0, cy:0, r:R0 - 6, fill:pal.card, stroke:pal.brass, sw:1.4});
  const rp = P(root.pid);
  const maxW = (R0 - 12) * 1.7;                 // stays inside the disc at these heights
  const l1 = rp.first || fullName(rp), l2 = rp.last || "";
  const mid = {size:17, fam:"disp", weight:600, fill:pal.ink, anchor:"middle"};
  if(l2){
    dl.push(Object.assign({t:"text", x:0, y:-5, s:fitTo(l1, maxW, 17, "disp", 600)}, mid));
    dl.push(Object.assign({t:"text", x:0, y:14, s:fitTo(l2, maxW, 17, "disp", 600)}, mid));
  } else {
    dl.push(Object.assign({t:"text", x:0, y:4, s:fitTo(l1, maxW, 17, "disp", 600)}, mid));
  }
  const sub = lifeLine(rp);
  if(sub) dl.push({t:"text", x:0, y:l2 ? 32 : 22, s:sub, size:10, fam:"mono",
                   fill:pal.ink2, anchor:"middle"});
  dl.push({t:"text", x:0, y:-R0 + 22, s:anc ? "ANCESTORS OF" : "DESCENDANTS OF", size:8,
           fam:"mono", fill:pal.ink3, anchor:"middle", ls:"1.4px"});
  hits.push({pid:root.pid, x:-R0 + 6, y:-R0 + 6, w:(R0 - 6) * 2, h:(R0 - 6) * 2, depth:0});

  const box = anc
    ? {x:-Rmax - 24, y:-Rmax - 24, w:(Rmax + 24) * 2, h:Rmax + R0 + 48}
    : {x:-Rmax - 24, y:-Rmax - 24, w:(Rmax + 24) * 2, h:(Rmax + 24) * 2};
  const rows = Array.from({length:maxD + 1}, (_, d) => ({depth:d, label:roman(d + 1)}));
  return {kind:"fan", dl, hits, nodes:hits, rows, box};
}

/* ── TIMELINE ──────────────────────────────────────────────
   One bar per life. Brass ties mark the year two of them met.
   ──────────────────────────────────────────────────────── */
function timeView(pal){
  const base = layout({C:CARD.compact});
  if(!base) return null;
  const depth = {};
  base.nodes.forEach(n => { depth[n.pid] = n.depth; });
  const NOW = new Date().getFullYear();
  const rows = [], undated = [];
  for(const id in S.people){
    if(depth[id] == null) continue;
    const p = P(id);
    const bd = parseDate(p.birth), dd = parseDate(p.death);
    const b = bd ? bd.y + (bd.m ? (bd.m - 1) / 12 : 0) : 0;   // months nudge the bar
    const d = dd ? dd.y + (dd.m ? (dd.m - 1) / 12 : 0) : 0;
    if(!b && !d){ undated.push(id); continue; }
    rows.push({pid:id, b: b || (d - 65), d: d || NOW, est: !b,
               living: !d && !p.dead, depth: depth[id], soft: softly(id)});
  }
  if(!rows.length) return null;
  rows.sort((a, b) => (a.depth - b.depth) || (a.b - b.b));

  const lo = rows.reduce((m, r) => Math.min(m, r.b), 9999) - 3;
  const hi = rows.reduce((m, r) => Math.max(m, r.d), 0) + 3;
  const PPY = 9, LW = 200, RH = 26, HH = 26;
  const X = y => (y - lo) * PPY;
  const W = X(hi);

  const dl = [], hits = [];
  let y = 0;
  const bands = [];
  let cur = null;
  for(const r of rows){
    if(!cur || cur.depth !== r.depth){
      if(cur) y += 16;
      cur = {depth:r.depth, y};
      bands.push(cur);
      y += HH;
    }
    r.y = y; y += RH;
  }
  const H = y;

  for(let yr = Math.ceil(lo / 10) * 10; yr <= hi; yr += 10){     // decade rules
    const gx = X(yr), century = yr % 100 === 0;
    dl.push({t:"path", d:`M${r1(gx)} -22 V${r1(H)}`, stroke:pal.line,
             sw:century ? 1.2 : 1, dash:century ? null : "1 5", cap:"round", alpha:century ? .8 : .55});
    dl.push({t:"text", x:gx, y:-28, s:String(yr), size:10, fam:"mono",
             fill:century ? pal.ink2 : pal.ink3, anchor:"middle"});
  }
  for(const b of bands){
    dl.push({t:"text", x:-LW, y:b.y + 15, s:"GENERATION " + roman(b.depth + 1), size:9.5,
             fam:"mono", fill:pal.ink3, ls:"1.5px"});
    dl.push({t:"path", d:`M${r1(-LW)} ${r1(b.y + 21)} H${r1(W)}`, stroke:pal.line, sw:1, alpha:.6});
  }
  for(const r of rows){
    const p = P(r.pid), x0 = X(r.b), x1 = X(r.d), bh = 15, by = r.y + 4;
    const w = Math.max(4, x1 - x0);
    dl.push({t:"rect", x:x0, y:by, w, h:bh, r:bh/2,
             fill:mix(pal.card, pal.accent, r.soft ? .04 : .10 + Math.min(r.depth, 5) * .055),
             stroke:r.living ? pal.accent : (r.soft ? pal.line : pal.line2), sw:1,
             dash:r.est ? "4 3" : null});
    const nsz = r.soft ? 10.5 : 11.5;
    dl.push({t:"text", x:-14, y:by + 11.5, s:fitTo(fullName(p), LW - 24, nsz, "ui", r.soft ? 400 : 500),
             size:nsz, weight:r.soft ? 400 : 500, fill:r.soft ? pal.ink2 : pal.ink, anchor:"end"});
    const label = (r.est ? "c." : "") + Math.floor(r.b) + (r.living ? "–" : "–" + Math.floor(r.d));
    if(w > measure(label, 9.5, "mono") + 16)
      dl.push({t:"text", x:x0 + 8, y:by + 11, s:label, size:9.5, fam:"mono", fill:pal.ink2});
    if(r.living)
      dl.push({t:"path", d:`M${r1(x1 + 5)} ${r1(by + 3)} l6 4.5 -6 4.5`, stroke:pal.accent,
               sw:1.6, cap:"round", join:"round"});
    hits.push({pid:r.pid, x:-LW, y:r.y, w:LW + Math.max(w, 40), h:RH - 3, depth:r.depth});
  }
  const at = {}; rows.forEach(r => { at[r.pid] = r; });
  for(const uid in S.unions){                                     // brass marriage ties
    const u = S.unions[uid], yr = parseInt(yearOf(u.date));
    const A = at[u.a], B = at[u.b];
    if(!yr || !A || !B || yr < lo || yr > hi) continue;
    const mx = X(yr), y1 = Math.min(A.y, B.y) + 11.5, y2 = Math.max(A.y, B.y) + 11.5;
    dl.push({t:"path", d:`M${r1(mx)} ${r1(y1)} V${r1(y2)}`, stroke:pal.brass, sw:1.4,
             cap:"round", alpha:.85, dash:u.divorced ? "4 3" : null});
    dl.push({t:"circle", cx:mx, cy:(y1 + y2) / 2, r:7, fill:pal.brassT, stroke:pal.brass, sw:1});
    dl.push({t:"text", x:mx, y:(y1 + y2) / 2 + 3.5, s:u.divorced ? "⚮" : "⚭", size:10,
             fill:pal.brass, anchor:"middle"});
  }
  let bottom = H;
  if(undated.length){
    bottom += 20;
    dl.push({t:"text", x:-LW, y:bottom, s:"DATES NOT RECORDED", size:9.5, fam:"mono",
             fill:pal.ink3, ls:"1.5px"});
    bottom += 16;
    dl.push({t:"text", x:-LW, y:bottom,
             s:fitTo(undated.map(id => fullName(P(id))).join(" · "), W + LW, 11, "ui", 400),
             size:11, fill:pal.ink2});
  }
  return {kind:"time", dl, hits, nodes:hits,
          rows:bands.map(b => ({depth:b.depth, label:roman(b.depth + 1)})),
          box:{x:-LW - PAD, y:-52 - PAD, w:W + LW + PAD * 2, h:(bottom + 52) + PAD * 2}};
}

/* ── REGISTER ──────────────────────────────────────────────
   The list you hand round the table: d'Aboville numbering, so
   1.2.1 tells you exactly where someone sits without a chart.
   ──────────────────────────────────────────────────────── */
function registerView(pal){
  const base = layout({C:CARD.compact});
  if(!base) return null;
  const idx = buildIndex();
  const onChart = new Set(base.nodes.map(n => n.pid));
  const roots = base.nodes.filter(n => n.depth === 0).sort((a, b) => a.x - b.x).map(n => n.pid);

  const entries = [], seen = new Set(), married = new Set();
  (function seed(){
    let i = 0;
    /* a spouse is listed against their partner, never given a number of
       their own — otherwise the founding couple reads as two families */
    for(const r of roots){ if(!seen.has(r) && !married.has(r)) walk(r, String(++i), 0); }
  })();
  function walk(pid, num, d){
    if(seen.has(pid)) return;
    seen.add(pid);
    const p = P(pid);
    const spouses = [];
    const kids = [];
    for(const uid of idx[pid].unions){
      const u = U(uid), sp = partnerOf(u, pid);
      if(sp && P(sp)){ spouses.push({p:P(sp), u}); married.add(sp); }
      for(const k of (u.children || []).slice().sort(byBirth)) if(onChart.has(k)) kids.push(k);
    }
    const line1 = num + "  " + fullName(p) + (lifeLine(p) ? "   " + lifeLine(p) : "");
    const extra = [];
    for(const s of spouses)
      extra.push((s.u.divorced ? "⚮" : s.u.status === "partners" ? "◇" : "⚭")
        + (yearOf(s.u.date) ? " " + yearOf(s.u.date) : "") + " " + fullName(s.p));
    const meta = [p.place, p.occupation].filter(Boolean).join(" · ");
    if(meta) extra.push(meta);
    entries.push({pid, d, line1, line2:extra.join("   ·   ")});
    let i = 0;
    for(const k of kids) walk(k, num + "." + (++i), d + 1);
  }
  if(!entries.length) return null;

  const LH = 15, GAP = 5, CWID = 330, CGAP = 38;
  entries.forEach(e => { e.h = (e.line2 ? LH * 2 : LH) + GAP; });
  const totalH = entries.reduce((t, e) => t + e.h, 0);
  const N = clamp(Math.round(Math.sqrt(totalH / (CWID * 1.25))), 1, 5);
  const perCol = totalH / N;

  const dl = [], hits = [];
  let col = 0, cy = 0, maxH = 0;
  for(const e of entries){
    if(cy > perCol && col < N - 1){ col++; cy = 0; }
    const cx = col * (CWID + CGAP), ind = Math.min(e.d, 5) * 11;
    dl.push({t:"text", x:cx + ind, y:cy + 11, s:fitTo(e.line1, CWID - ind, 11.5, "ui", 600),
             size:11.5, weight:600, fill:pal.ink});
    if(e.line2)
      dl.push({t:"text", x:cx + ind + 10, y:cy + 11 + LH,
               s:fitTo(e.line2, CWID - ind - 10, 10.5, "ui", 400),
               size:10.5, fill:pal.ink2});
    hits.push({pid:e.pid, x:cx + ind - 3, y:cy, w:CWID - ind, h:e.h, depth:e.d});
    cy += e.h;
    maxH = Math.max(maxH, cy);
  }
  for(let c = 1; c < N; c++)                                   // column rules
    dl.push({t:"path", d:`M${r1(c * (CWID + CGAP) - CGAP/2)} -6 V${r1(maxH)}`,
             stroke:pal.line, sw:1, alpha:.7});
  const W = N * CWID + (N - 1) * CGAP;
  return {kind:"register", dl, hits, nodes:hits, rows:base.rows,
          box:{x:-PAD, y:-PAD - 6, w:W + PAD * 2, h:maxH + PAD * 2 + 6}};
}

/* ── IN-LAW FAMILIES ───────────────────────────────────────
   The families married into, kept off the main descent where
   they would swamp it: each married-in person shown with their
   own parents and their brothers and sisters, and a line
   saying who in the family they married.
   ──────────────────────────────────────────────────────── */
const IL_CW = 158, IL_CH = 42, IL_PAD = 16, IL_SIB = 12, IL_SP = 26, IL_BGAP = 22;

function inlawView(pal){
  const idx = buildIndex();
  const married = Object.keys(INLAW).filter(id => S.people[id]);
  const dl = [], hits = [];

  /* one block per birth family; two siblings who both married in share one */
  const groups = new Map();
  for(const id of married){
    const pu = idx[id].childOf;
    /* if their parents are already on the main chart the tie is drawn there */
    if(pu && (U(pu).children || []).length && [U(pu).a, U(pu).b].some(q => q && ONCHART[q])) continue;
    const key = pu || ("solo:" + id);
    if(!groups.has(key)) groups.set(key, {pu, stars:[], sibs:[], parents:[]});
    groups.get(key).stars.push(id);
  }
  for(const g of groups.values()){
    if(g.pu){
      const u = U(g.pu);
      g.parents = [u.a, u.b].filter(q => q && S.people[q]);
      g.sibs = (u.children || []).filter(k => S.people[k]).slice().sort(byBirth);
      g.union = u;
    }
    if(!g.sibs.length) g.sibs = g.stars.slice();
    for(const s of g.stars) if(!g.sibs.includes(s)) g.sibs.push(s);
  }

  const blocks = [...groups.values()];
  if(!blocks.length){
    const msg = married.length
      ? "Nobody who married in has their own family recorded yet."
      : "No one has married into this family yet.";
    dl.push({t:"text", x:0, y:0, s:msg, size:17, fam:"disp", weight:600, fill:pal.ink});
    dl.push({t:"text", x:0, y:26, s:"Open someone who married in, then add their parents or their",
             size:12.5, fill:pal.ink2});
    dl.push({t:"text", x:0, y:44, s:"brothers and sisters. They stay off the main chart and gather here.",
             size:12.5, fill:pal.ink2});
    return {kind:"inlaws", dl, hits:[], nodes:[], rows:[],
            box:{x:-PAD, y:-PAD - 20, w:520 + PAD * 2, h:64 + PAD * 2}};
  }

  /* name the family after the maiden name where there is one */
  const famName = g => {
    if(g.parents.length && P(g.parents[0]).last) return P(g.parents[0]).last;
    for(const s of g.stars) if(P(s).maiden) return P(s).maiden;
    for(const s of g.stars) if(P(s).last) return P(s).last;
    return "Family";
  };
  for(const g of blocks){
    g.name = "THE " + famName(g).toUpperCase() + " FAMILY";
    g.links = [];
    for(const s of g.stars){
      for(const uid of idx[s].unions){
        const u = U(uid), sp = partnerOf(u, s);
        if(!sp || !P(sp) || INLAW[sp]) continue;
        g.links.push((g.stars.length > 1 || g.sibs.length > 1 ? (P(s).first || fullName(P(s))) + "  " : "")
          + (u.divorced ? "⚮" : u.status === "partners" ? "◇" : "⚭")
          + (yearOf(u.date) ? " " + yearOf(u.date) : "") + "  " + fullName(P(sp)));
      }
    }
    const pw = g.parents.length ? g.parents.length * IL_CW + (g.parents.length - 1) * IL_SP : 0;
    const sw = g.sibs.length * IL_CW + (g.sibs.length - 1) * IL_SIB;
    g.inner = Math.max(pw, sw, 210);
    g.w = g.inner + IL_PAD * 2;
    g.h = IL_PAD + 26 + (g.parents.length ? IL_CH + 24 : 0) + IL_CH
        + (g.links.length ? 10 + g.links.length * 15 : 0) + IL_PAD;
  }

  const colW = Math.max.apply(null, blocks.map(b => b.w));
  const totalH = blocks.reduce((t, b) => t + b.h + IL_BGAP, 0);
  const N = clamp(Math.round(Math.sqrt(totalH / (colW * 1.15))), 1, 4);
  const perCol = totalH / N;

  /* inside their own family they go by the name they were born with */
  const birthName = p => [p.first, p.maiden || p.last].filter(Boolean).join(" ").trim() || "Unnamed";
  function card(pid, x, y, star){
    const p = P(pid);
    dl.push({t:"rect", x, y, w:IL_CW, h:IL_CH, r:6,
             fill: star ? mix(pal.card, pal.accent, .12) : (isDead(p) ? pal.card2 : pal.card),
             stroke: star ? pal.accent : pal.line2, sw: star ? 1.4 : 1});
    dl.push({t:"text", x:x + 10, y:y + 18, s:fitTo(birthName(p), IL_CW - (star ? 32 : 20), 12, "ui", 600),
             size:12, weight:600, fill:pal.ink});
    const life = lifeLine(p);
    if(life) dl.push({t:"text", x:x + 10, y:y + 32, s:fitTo(life, IL_CW - 20, 9.5, "mono"),
                      size:9.5, fam:"mono", fill:pal.ink2});
    if(star) dl.push({t:"text", x:x + IL_CW - 11, y:y + 18, s:"⚭", size:11,
                      fill:pal.brass, anchor:"end"});
    hits.push({pid, x, y, w:IL_CW, h:IL_CH, depth:0});
  }

  let col = 0, cy = 0, maxH = 0;
  for(const g of blocks){
    if(cy > perCol && col < N - 1){ col++; cy = 0; }
    const bx = col * (colW + 34), by = cy;
    dl.push({t:"rect", x:bx, y:by, w:colW, h:g.h, r:10,
             fill:mix(pal.card, pal.paper, .55), stroke:pal.line, sw:1});
    dl.push({t:"text", x:bx + IL_PAD, y:by + IL_PAD + 10, s:g.name, size:9.5, fam:"mono",
             fill:pal.ink3, ls:"1.6px"});
    dl.push({t:"path", d:`M${r1(bx + IL_PAD)} ${r1(by + IL_PAD + 18)} H${r1(bx + colW - IL_PAD)}`,
             stroke:pal.line, sw:1});

    const inner = colW - IL_PAD * 2;
    let y = by + IL_PAD + 26;
    let parentMid = null;
    if(g.parents.length){
      const pw = g.parents.length * IL_CW + (g.parents.length - 1) * IL_SP;
      let px = bx + IL_PAD + (inner - pw) / 2;
      g.parents.forEach((q, i) => {
        if(i){
          const gx = px - IL_SP / 2;
          dl.push({t:"path", d:`M${r1(px - IL_SP)} ${r1(y + IL_CH/2)} H${r1(px)}`,
                   stroke:pal.brass, sw:1.4});
          dl.push({t:"text", x:gx, y:y + IL_CH/2 + 4, s:g.union && g.union.divorced ? "⚮" : "⚭",
                   size:11, fill:pal.brass, anchor:"middle"});
        }
        card(q, px, y, false);
        px += IL_CW + IL_SP;
      });
      parentMid = bx + IL_PAD + inner / 2;
      y += IL_CH;
      dl.push({t:"path", d:`M${r1(parentMid)} ${r1(y)} V${r1(y + 14)}`, stroke:pal.line2, sw:1.4, cap:"round"});
      y += 24;
    }

    const sw2 = g.sibs.length * IL_CW + (g.sibs.length - 1) * IL_SIB;
    /* centred under the parents; ranged left when there are none to sit under */
    let sx = bx + IL_PAD + (g.parents.length ? (inner - sw2) / 2 : 0);
    const anchors = [];
    g.sibs.forEach(s => { anchors.push(sx + IL_CW / 2); card(s, sx, y, g.stars.includes(s)); sx += IL_CW + IL_SIB; });
    if(parentMid != null){
      const lo = Math.min(parentMid, anchors[0]), hi = Math.max(parentMid, anchors[anchors.length - 1]);
      dl.push({t:"path", d:`M${r1(lo)} ${r1(y - 10)} H${r1(hi)}`, stroke:pal.line2, sw:1.4, cap:"round"});
      anchors.forEach(ax => dl.push({t:"path", d:`M${r1(ax)} ${r1(y - 10)} V${r1(y)}`,
                                     stroke:pal.line2, sw:1.4, cap:"round"}));
    }
    y += IL_CH;

    if(g.links.length){
      y += 10;
      g.links.forEach(t => {
        dl.push({t:"text", x:bx + IL_PAD, y:y + 4, s:fitTo(t, inner, 10.5, "ui"),
                 size:10.5, fill:pal.ink2});
        y += 15;
      });
    }
    cy += g.h + IL_BGAP;
    maxH = Math.max(maxH, cy - IL_BGAP);
  }

  const W = N * colW + (N - 1) * 34;
  return {kind:"inlaws", dl, hits, nodes:hits, rows:[],
          box:{x:-PAD, y:-PAD, w:W + PAD * 2, h:maxH + PAD * 2}};
}

/* ── view dispatch ─────────────────────────────────────── */
/**
 * Who married in, agreed once per render so the chart, the other views,
 * the people list and the inspector all say the same thing. Membership
 * follows traversal order, which does not depend on node widths.
 */
function readInlaw(model){
  INLAW = {}; ONCHART = {};
  if(model) model.nodes.forEach(n => { ONCHART[n.pid] = true; if(n.inlaw) INLAW[n.pid] = true; });
  return INLAW;
}
function makeModel(pal){
  pal = pal || activePal();
  try {
    if(ui.view === "chart"){ const m = layout(); readInlaw(m); return m; }
    readInlaw(layout());
    if(ui.view === "tree")     return treeView(pal);
    if(ui.view === "fan")      return fanView(pal);
    if(ui.view === "time")     return timeView(pal);
    if(ui.view === "register") return registerView(pal);
    if(ui.view === "inlaws")   return inlawView(pal);
    return layout();
  } catch(err){
    console.error("view failed", err);
    return layout();
  }
}
function viewPaint(model, scale, palName, title){
  return model.kind === "chart"
    ? renderCanvas(model, scale, palName, title)
    : renderCanvasDL(model, scale, palName, title);
}
function hitsSVG(model){
  if(!model.hits) return "";
  return model.hits.map(h => `<rect class="node hit" data-id="${h.pid}" x="${r1(h.x)}" y="${r1(h.y)}"`
    + ` width="${r1(h.w)}" height="${r1(h.h)}" rx="4"/>`).join("");
}
function selRing(model){
  if(model.kind === "chart" || !ui.sel || !model.hits) return "";
  const h = model.hits.find(h => h.pid === ui.sel);
  if(!h) return "";
  return `<rect class="selring" x="${r1(h.x - 2)}" y="${r1(h.y - 2)}" width="${r1(h.w + 4)}"`
       + ` height="${r1(h.h + 4)}" rx="6"/>`;
}

/* ═══════════════════════════════════════════════════════════
   UI — rail, inspector, forms
   ═══════════════════════════════════════════════════════════ */
function render(){
  warmPhotos();
  drawChart();
  renderRail();
  renderInspector();
  $("#focusName").textContent = ui.focus && P(ui.focus) ? fullName(P(ui.focus)) : "Whole family";
  $("#sampleFlag").hidden = !ui.isSample;
  $("#shareFlag").hidden = !ORIGIN;
  if(ORIGIN){
    const n = addedSince();
    $("#shareFlagText").textContent =
      (ORIGIN.by ? ORIGIN.by + " shared this with you" : "Shared with you")
      + (n ? " · you have added " + n + (n === 1 ? " person" : " people") : " · add what you know");
  }
  $("#btnFocus").disabled = ui.mode === "all";
}

function renderRail(){
  const list = $("#railList");
  const idx = buildIndex();
  const ids = Object.keys(S.people);
  $("#railCount").textContent = ids.length + (ids.length === 1 ? " person" : " people");
  const gens = LAY ? LAY.rows.length : 0;
  $("#railGens").textContent = gens ? gens + " generations" : "—";

  const q = ui.query.trim().toLowerCase();
  const match = ids.filter(id => {
    if(!q) return true;
    const p = P(id);
    return (fullName(p) + " " + (p.maiden||"") + " " + (p.place||"") + " " + (p.occupation||""))
      .toLowerCase().includes(q);
  });
  if(!match.length){
    list.innerHTML = `<div class="rail-empty">${ids.length ? "No one matches that search." : "No one here yet.<br>Add the first person to begin."}</div>`;
    return;
  }
  /* group by the depth the chart gave them, so the rail mirrors the chart */
  const depth = {};
  if(LAY) LAY.nodes.forEach(n => { depth[n.pid] = n.depth; });
  const groups = new Map();
  match.forEach(id => {
    const d = depth[id] == null ? 999 : depth[id];
    if(!groups.has(d)) groups.set(d, []);
    groups.get(d).push(id);
  });
  const keys = [...groups.keys()].sort((a,b) => a - b);
  let html = "";
  for(const d of keys){
    const rows = groups.get(d).sort((a,b) =>
      byBirth(a, b) ||
      fullName(P(a)).localeCompare(fullName(P(b))));
    const label = d === 999 ? "Not on this chart"
      : (LAY && LAY.ancestors ? (ANC_LABELS[d] || "Earlier") : "Generation " + roman(d + 1));
    html += `<div class="rail-gen">${esc(label)}</div>`;
    for(const id of rows){
      const p = P(id), h = hueOf(p);
      const av = p.photo
        ? `<img src="${esc(p.photo)}" alt="">`
        : esc(initials(p));

  <fieldset><legend>Photo</legend>
    <div class="photo-row">
      <div class="photo-prev">${p.photo ? `<img src="${esc(p.photo)}" alt="">` : `<span>no<br>photo</span>`}</div>
      <div style="display:flex;flex-direction:column;gap:6px;flex:1">
        <button class="btn sm" data-act="photo">${p.photo ? "Replace photo" : "Choose photo…"}</button>

      const bits = [u.divorced ? "divorced" : (u.status === "partners" ? "partners" : "married"),

function inspSub(p){
  const a = ageOf(p);
  const age = a ? (a.dead ? "died aged " : "") + (a.exact ? "" : "about ") + a.years
                + (a.dead ? "" : " years old") : "";
  $("#ihSub").innerHTML = esc(lifeLine(p, "short") || "dates unknown")
    + (age ? ` &nbsp;·&nbsp; <span style="color:var(--ink-3)">${esc(age)}</span>` : "")
    + (INLAW[p.id] ? `<br><span class="tag-inlaw">married in</span>` : "");
}
/** Echo back how a typed date was read, so vague entries are not a mystery. */
function dateEcho(v){
  const d = parseDate(v);
  if(!d) return String(v || "").trim() ? "not recognised as a date — kept as typed" : "";
  if(!d.m) return "read as the year " + d.y + (d.approx ? ", approximate" : "");
  return "read as " + fmtDate(d, "long");
}
function relRow(id, kind, uid){
  const p = P(id); if(!p) return "";
  return `<div class="rel-item">
    <span class="txt"><span class="nm">${esc(fullName(p))}</span>
    <span class="meta">${esc(lifeLine(p) || "dates unknown")}</span></span>
    <button class="go" data-act="unlink" data-kind="${kind}" data-id="${id}" data-uid="${esc(uid||"")}" title="Unlink" aria-label="Unlink">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    <button class="go" data-act="goto" data-id="${id}" title="Open" aria-label="Open person">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 3.5l4.5 4.5L6 12.5"/></svg></button>

let fldTimer = null;
$("#inspBody").addEventListener("input", e => {
  const f = e.target.dataset.fld; if(!f || !ui.sel) return;
  const p = P(ui.sel); if(!p) return;
  if(fldTimer === null) snapshot();
  clearTimeout(fldTimer);
  p[f] = e.target.value;
  fldTimer = setTimeout(() => { fldTimer = null; }, 900);
  ui.dirty = true;
  save();
  scheduleRedraw();
  $("#ihName").textContent = fullName(p);
  inspSub(p);
  if(f === "birth" || f === "death"){
    const echo = $(`[data-echo="${f}"]`, $("#inspBody"));
    if(echo) echo.textContent = dateEcho(e.target.value);
  }
});
/** Typing should feel instant, so the chart catches up a beat later. */
let redrawTimer = null;
function scheduleRedraw(){
  clearTimeout(redrawTimer);
  redrawTimer = setTimeout(() => { drawChart(); renderRail(); }, 180);
}
/* leaving a field, or picking from a dropdown, redraws at once */
$("#inspBody").addEventListener("change", e => {
  if(!e.target.dataset.fld || !ui.sel) return;
  clearTimeout(redrawTimer);
  drawChart(); renderRail();
});
$("#inspBody").addEventListener("click", e => {
  const btn = e.target.closest("[data-act]"); if(!btn) return;
  const act = btn.dataset.act;
  const p = ui.sel ? P(ui.sel) : null; if(!p) return;

  if(act === "goto"){ select(btn.dataset.id); centerOn(btn.dataset.id); return; }
  if(act === "go-inlaws"){ setView("inlaws"); render(); fitView(); return; }
  if(act === "focus"){ ui.focus = p.id; ui.mode = ui.mode === "all" ? "desc" : ui.mode; setMode(ui.mode); render(); fitView(); return; }
  if(act === "center"){ centerOn(p.id); return; }
  if(act === "photo"){ pickPhoto(p.id); return; }
  if(act === "photo-clear"){ snapshot(); p.photo = ""; delete photoCache[p.id]; commit("Photo removed"); return; }
  if(act === "delete"){ confirmDelete(p); return; }
  if(act === "edit-union"){ unionDialog(btn.dataset.uid); return; }

  if(act === "add-partner"){
    choosePerson({title:"Add a partner", subtitle:"Pick someone already on the chart, or create a new person.",
      exclude:[p.id], seed:p.last}, id => {
      snapshot();
      if(!unionBetween(p.id, id, false)) addUnion(p.id, id);
      commit("Partner added"); select(id);
    });
    return;
  }
  if(act === "add-child"){
    const idx = buildIndex();
    const unions = idx[p.id].unions;
    const place = (uid) => {
      choosePerson({title:"Add a child", subtitle:"Pick someone already on the chart, or create a new person.",
        exclude:[p.id], seed:p.last}, id => {
        snapshot();
        const u = U(uid) || U(addUnion(p.id, null));
        if(!u.children.includes(id)) u.children.push(id);
        commit("Child added"); select(id);
      });
    };
    if(unions.length <= 1) place(unions[0] || addUnion(p.id, null));
    else chooseUnion(p, unions, place);
    return;
  }
  if(act === "add-parent"){
    choosePerson({title:"Add a parent", subtitle:"Pick someone already on the chart, or create a new person.",
      exclude:[p.id], seed:p.last}, id => {
      snapshot();
      const uid = parentUnion(p.id, true);
      const u = U(uid);
      if(u.a === id || u.b === id){ /* already there */ }
      else if(!u.a) u.a = id;
      else if(!u.b) u.b = id;
      else { toast("Two parents already recorded", true); return; }
      if(!u.children.includes(p.id)) u.children.push(p.id);
      commit("Parent added"); select(id);
    });
    return;
  }
  if(act === "add-sibling"){
    const uid = parentUnion(p.id, true);
    choosePerson({title:"Add a sibling", subtitle:"They will share this person’s parents.",
      exclude:[p.id], seed:p.last}, id => {
      snapshot();
      const u = U(uid);
      if(!u.children.includes(id)) u.children.push(id);
      commit("Sibling added"); select(id);
    });
    return;
  }
  if(act === "unlink"){
    snapshot();
    const other = btn.dataset.id, kind = btn.dataset.kind;
    if(kind === "parent"){
      const u = U(parentUnion(p.id, false));
      if(u){ if(u.a === other) u.a = null; if(u.b === other) u.b = null; }
    } else if(kind === "child"){
      for(const uid in S.unions) S.unions[uid].children = S.unions[uid].children.filter(k => k !== other);
    }
    commit("Unlinked");
    return;
  }
});

}

function choosePerson(opts, done){
  const ids = Object.keys(S.people).filter(id => !(opts.exclude||[]).includes(id));
  openModal(`
    <div class="modal">
      <div class="modal-head"><div style="flex:1">
        <h2>${esc(opts.title)}</h2><p>${esc(opts.subtitle||"")}</p>
      </div></div>
      <div class="modal-body">
        <label class="f"><span>Name</span><input id="pkQ" placeholder="Type a name…" autocomplete="off"></label>
        <button class="picker-new" id="pkNew">＋ Create “<span id="pkNewName">new person</span>”</button>
        <div class="picker-list" id="pkList"></div>
      </div>
      <div class="modal-foot"><button class="btn" data-close>Cancel</button></div>
    </div>`);

  const q = $("#pkQ"), list = $("#pkList");
  function paint(){
    const t = q.value.trim().toLowerCase();
    $("#pkNewName").textContent = q.value.trim() || "new person";
    const hits = ids.filter(id => !t || fullName(P(id)).toLowerCase().includes(t)).slice(0, 60);
    list.innerHTML = hits.length
      ? hits.map(id => {
          const p = P(id), h = hueOf(p);
          return `<button class="prow" data-id="${id}">
            <span class="av" style="background:hsl(${h} 26% 85%);color:hsl(${h} 32% 30%)">${p.photo?`<img src="${esc(p.photo)}" alt="">`:esc(initials(p))}</span>
            <span class="txt"><span class="nm">${esc(fullName(p))}</span></span>
            <span class="dt">${esc(lifeLine(p)||"—")}</span></button>`;
        }).join("")
      : `<div class="rail-empty">${ids.length ? "No match — create them instead." : "No one else on the chart yet."}</div>`;
  }
  paint();
  q.addEventListener("input", paint);
  q.focus();
  list.addEventListener("click", e => {
    const b = e.target.closest("[data-id]"); if(!b) return;
    closeModal(); done(b.dataset.id);
  });
  const create = () => {
    const raw = q.value.trim();
    if(!raw){ q.focus(); return toast("Type a name first", true); }
    const bits = raw.split(/\s+/);
    const first = bits.shift();
    const last = bits.join(" ") || (opts.seed || "");
    snapshot();
    const id = addPerson({first, last});
    closeModal(); done(id);
  };
  $("#pkNew").addEventListener("click", create);
  q.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); create(); } });
}

function pickPhoto(pid){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.addEventListener("change", () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const M = 260;
        const k = Math.min(1, M / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        snapshot();
        P(pid).photo = cv.toDataURL("image/jpeg", 0.82);
        delete photoCache[pid];
        commit("Photo added");
      };
      img.onerror = () => toast("That image could not be read", true);
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  });
  inp.click();
}

  chart   : {label:"A3 chart",    hint:"one sheet, landscape",  paper:"A3", orient:"landscape", fitMode:"fit", margin:12},

};
const TINTS = {white:"#FFFFFF", cream:"#FAF5E9", none:null};

/** the register palette, dropped to greys when printing in one ink */
function greyPal(p){
  const out = Object.assign({}, p);
  for(const k in out){
    if(typeof out[k] === "string" && out[k][0] === "#"){
      let s = out[k].replace("#", "");
      if(s.length === 3) s = s.split("").map(c => c + c).join("");
      const l = Math.round(.299 * parseInt(s.slice(0,2),16)
                         + .587 * parseInt(s.slice(2,4),16)
                         + .114 * parseInt(s.slice(4,6),16));
      out[k] = "#" + [l,l,l].map(v => v.toString(16).padStart(2, "0")).join("");
    }
  }
  out.monoS = 0; out.monoTS = 0;
  return out;
}
let _greyCache = null;
function printPal(){
  if(printOpts.ink !== "mono") return PAL.light;
  return (_greyCache = _greyCache || greyPal(PAL.light));
}
function paperFill(){ return TINTS[printOpts.tint] || "#FFFFFF"; }

function printDialog(){
  if(!LAY){ return toast("Nothing to print yet", true); }

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
/** The commonest field value among everyone on record. */
function commonest(pick){
  const counts = {};
  for(const id in S.people){
    const v = (pick(P(id)) || "").trim();
    if(v) counts[v] = (counts[v] || 0) + 1;
  }
  return Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || "";
}
function familyName(){ return commonest(p => p.last); }
function guessTitle(){
  const n = familyName();
  return n ? "The " + n + " Family" : "Our Family";
}
function yearSpan(){
  const ys = [];
  for(const id in S.people){
    const b = parseDate(P(id).birth); if(b) ys.push(b.y);
    const d = parseDate(P(id).death); if(d) ys.push(d.y);
  }
  return ys.length ? Math.min.apply(null, ys) + "–" + Math.max.apply(null, ys) : "";
}
function guessSubtitle(){
  const gens = LAY ? LAY.rows.length : 0;
  const span = yearSpan();
  if(!span) return gens ? gens + " generations" : "";
  return (gens ? gens + " generations, " : "") + span;
}
/** Headings built from the family's own name, place and founder. */
function titleIdeas(){
  const n = familyName(), place = commonest(p => p.place);
  const root = ui.focus && P(ui.focus) ? P(ui.focus) : null;
  const out = [];
  if(n){
    out.push("The " + n + " Family");
    if(place) out.push("The " + n + "s of " + place);
    out.push(n + " Family Tree");
  }
  if(root) out.push("Descendants of " + fullName(root));
  out.push("Our Family");
  return [...new Set(out)].filter(Boolean).slice(0, 4);
}
function subtitleIdeas(){
  const gens = LAY ? LAY.rows.length : 0;
  const n = Object.keys(S.people).length;
  const span = yearSpan(), place = commonest(p => p.place);
  const out = [];
  if(gens && span) out.push(gens + " generations, " + span);
  if(n) out.push(n + " people" + (gens ? " across " + gens + " generations" : ""));
  if(place && span) out.push("From " + place + ", " + span);
  out.push("Compiled " + new Date().toLocaleDateString(undefined, {month:"long", year:"numeric"}));
  return [...new Set(out)].filter(Boolean).slice(0, 3);
}
/** Forget a heading the user never chose, so it follows the next family in. */
function resetHeading(){
  S.meta.title = ""; S.meta.subtitle = ""; S.meta.note = "";
  printOpts.title = ""; printOpts.subtitle = ""; printOpts.note = "";
}

/** Work out the sheet grid for the current options. */
function planSheets(){
  const [pw0, ph0] = PAPERS[printOpts.paper];
  const land = printOpts.orient === "landscape";
  const pageW = (land ? Math.max(pw0, ph0) : Math.min(pw0, ph0)) * MM;
  const pageH = (land ? Math.min(pw0, ph0) : Math.max(pw0, ph0)) * MM;
  const m     = printOpts.margin * MM;
  const hasTitle = !!(printOpts.title || printOpts.subtitle);
  const anyFoot = printOpts.note || printOpts.crop || printOpts.legend
               || printOpts.stamp || printOpts.count;
  const footH = anyFoot ? (printOpts.legend ? 11 : 7) * MM : 0;
  /* the sheet is always drawn in the register's print palette,
     whatever the screen is showing */
  const model = makeModel(printPal()) || LAY;
  const box   = boxWithTitle(model, hasTitle);
  const availW = pageW - 2*m, availH = pageH - 2*m - footH;

  if(printOpts.fitMode === "fit"){
    const scale = Math.min(availW / box.w, availH / box.h);
    return {pageW, pageH, m, footH, hasTitle, box, model, scale, cols:1, rows:1, tiled:false,
            availW, availH, over:0};
  }
  const over  = printOpts.overlap * MM;
  const stepW = Math.max(40, availW - over), stepH = Math.max(40, availH - over);
  const scale = printOpts.fitMode === "wide"
    ? (clamp(printOpts.sheetsWide, 1, 12) * stepW + over) / box.w
    : printOpts.scale / 100;
  const cols = Math.max(1, Math.ceil((box.w * scale - over) / stepW));
  const rows = Math.max(1, Math.ceil((box.h * scale - over) / stepH));
  return {pageW, pageH, m, footH, hasTitle, box, model, scale, cols, rows, tiled:true,
          availW, availH, stepW, stepH, over};
}

function paintPreview(){
  const plan = planSheets();
  const mount = $("#prevMount");
  const maxW = 268, maxH = 200;
  const gw = plan.pageW * plan.cols, gh = plan.pageH * plan.rows;
  const k = Math.min(maxW / gw, maxH / gh);
  const svgInner = viewSVG(plan.model, {selectable:false, ns:"pv", pal:printPal(),
    title: plan.hasTitle ? {main:printOpts.title, sub:printOpts.subtitle} : null});
  const b = plan.box;

  mount.innerHTML = `<div class="sheetprev${printOpts.ink === "mono" ? " ink-mono" : ""}"
      style="width:${(gw*k).toFixed(1)}px;height:${(gh*k).toFixed(1)}px;background:${paperFill() || "#fff"}">
    <div style="position:absolute;left:${(plan.m*k).toFixed(1)}px;top:${(plan.m*k).toFixed(1)}px;
                width:${((gw - 2*plan.m)*k).toFixed(1)}px;height:${((gh - 2*plan.m)*k).toFixed(1)}px;overflow:hidden">
      <svg width="${(b.w*plan.scale*k).toFixed(1)}" height="${(b.h*plan.scale*k).toFixed(1)}"
           viewBox="${r1(b.x)} ${r1(b.y)} ${r1(b.w)} ${r1(b.h)}">${svgInner}</svg>
    </div>
    ${Array.from({length:plan.cols*plan.rows}, (_,i) => {
      const c = i % plan.cols, r = Math.floor(i / plan.cols);
      return `<div class="pg" style="left:${(c*plan.pageW*k).toFixed(1)}px;top:${(r*plan.pageH*k).toFixed(1)}px;
        width:${(plan.pageW*k).toFixed(1)}px;height:${(plan.pageH*k).toFixed(1)}px"></div>`;
    }).join("")}
  </div>`;

  const n = plan.cols * plan.rows;
  const cm = v => (v / MM / 10).toFixed(0);
  const guide = plan.tiled && printOpts.guide && n > 1 ? 1 : 0;
  /* names print legibly at roughly a third of on-screen size and up */
  const tight = plan.scale < 0.34;
  $("#prevNote").innerHTML = plan.tiled
    ? `<b>${n} sheet${n>1?"s":""}</b>${guide ? " + assembly sheet" : ""} — ${plan.cols} across × ${plan.rows} down<br>`
      + `assembled: <b>${cm(plan.cols*plan.pageW)} × ${cm(plan.rows*plan.pageH)} cm</b> `
      + `<span style="opacity:.7">at ${Math.round(plan.scale*100)}%</span>`
    : `<b>1 sheet</b> · ${printOpts.paper} ${printOpts.orient} — drawn at <b>${Math.round(plan.scale*100)}%</b><br>`
      + (tight ? `<span style="color:var(--danger)">names will be very small — try a poster</span>`
               : `names stay legible`);
}

const LEGEND_TEXT = "∗ born    † died    ⚭ married    ⚮ divorced    ◇ partners";
/** the QR the poster carries, so anyone can scan the tree onto their phone */
function qrShape(text, cell){
  if(typeof qrcode !== "function" || !text) return null;
  try {
    const q = qrcode(0, "M");
    q.addData(text); q.make();
    const n = q.getModuleCount();
    let d = "";
    for(let r = 0; r < n; r++)
      for(let c = 0; c < n; c++)
        if(q.isDark(r, c)) d += `M${c*cell} ${r*cell}h${cell}v${cell}h${-cell}z`;
    return {d, size:n * cell};
  } catch(e){ return null; }
}
function qrBlock(px){
  const q = qrShape(printOpts.qrUrl, 3);
  if(!q) return "";
  const k = px / q.size;
  return `<div style="position:absolute;right:${(planPad())}px;bottom:${(planPad() + 22)}px;text-align:center">
    <svg width="${px}" height="${px}" viewBox="0 0 ${q.size} ${q.size}">
      <rect width="${q.size}" height="${q.size}" fill="#fff"/><path d="${q.d}" fill="#141C22"/></svg>
    <div style="font:400 6.5px ${FAM.mono};color:#4B5A62;margin-top:2px">scan to open the tree</div>
  </div>`;
}
let _planPad = 12;
function planPad(){ return _planPad; }

function buildPrintSheets(){

    + `bottom:${(plan.m*0.55).toFixed(1)}px;border:1px solid ${pal.brass};pointer-events:none"></div>` : "";

  const foot = (left, right) => {
    if(!plan.footH) return "";
    const bits = [];
    if(printOpts.count) bits.push(Object.keys(S.people).length + " people");
    if(printOpts.stamp) bits.push(dateStamp());
    const rightText = [right, bits.join("  ·  ")].filter(Boolean).join("   ");
    return `<div style="position:absolute;left:${plan.m}px;right:${plan.m}px;bottom:${(plan.m*0.5).toFixed(1)}px">
      ${printOpts.legend ? `<div class="pfoot" style="font-size:8px;justify-content:center;color:${pal.ink3};margin-bottom:3px">
        <span style="letter-spacing:.06em">${LEGEND_TEXT}</span></div>` : ""}
      <div class="pfoot" style="font-size:8.5px;color:${pal.ink3}"><span>${esc(left)}</span><span>${esc(rightText)}</span></div>
    </div>`;
  };

  /* an assembly sheet first, so a mural can be laid out before it is glued */
  if(plan.tiled && printOpts.guide && nSheets > 1){
    const gw = 300, gh = gw * (plan.rows * plan.pageH) / (plan.cols * plan.pageW);
    html += `<div class="sheet" style="width:${plan.pageW}px;height:${plan.pageH}px">
      <div style="position:absolute;left:${plan.m}px;top:${plan.m}px;right:${plan.m}px">
        <div class="ptitle" style="font-size:26px">${esc(printOpts.title || "Assembly")}</div>
        <div class="psub" style="font-size:12px;margin-top:4px">
          ${nSheets} sheets · ${plan.cols} across × ${plan.rows} down ·
          finished size ${(plan.cols*plan.pageW/MM/10).toFixed(0)} × ${(plan.rows*plan.pageH/MM/10).toFixed(0)} cm
          ${printOpts.overlap ? " · " + printOpts.overlap + " mm glue overlap" : ""}
        </div>
        <div class="rule" style="margin:10px 0 16px"></div>
        <div style="position:relative;width:${gw}px;height:${gh.toFixed(1)}px;border:1px solid ${pal.line2}">
          ${Array.from({length:nSheets}, (_, i) => {
            const c = i % plan.cols, r = Math.floor(i / plan.cols);
            return `<div style="position:absolute;left:${(c*gw/plan.cols).toFixed(1)}px;top:${(r*gh/plan.rows).toFixed(1)}px;
              width:${(gw/plan.cols).toFixed(1)}px;height:${(gh/plan.rows).toFixed(1)}px;
              border:1px dashed ${pal.line2};display:flex;align-items:center;justify-content:center;
              font:400 13px ${FAM.mono};color:${pal.ink2}">${i+1}</div>`;
          }).join("")}
        </div>
        <div style="font:400 9.5px ${FAM.mono};color:${pal.ink3};margin-top:12px;line-height:1.7">
          Sheets are numbered left to right, top to bottom.<br>
          Trim to the corner marks, overlap each sheet onto the one to its left and above, then tape from behind.
        </div>
      </div>

  }

  if(!plan.tiled){

    const oy = plan.m + (plan.availH - drawnH) / 2;

      for(let c = 0; c < plan.cols; c++){
        const offX = c * plan.stepW, offY = r * plan.stepH;
        const last = r === plan.rows - 1 && c === plan.cols - 1;
        html += `<div class="sheet" style="width:${plan.pageW}px;height:${plan.pageH}px">
          <div class="clipbox" style="left:${plan.m}px;top:${plan.m}px;width:${plan.availW.toFixed(1)}px;height:${plan.availH.toFixed(1)}px">
            <div style="position:absolute;left:${(-offX).toFixed(1)}px;top:${(-offY).toFixed(1)}px">${svgFor(drawnW, drawnH)}</div>
          </div>
          ${printOpts.crop ? cropMarks(plan) : ""}${frame}
          ${printOpts.qr && last ? qrBlock(56) : ""}
          ${foot((printOpts.note ? printOpts.note + "  ·  " : "") + printOpts.title,
                 `row ${r+1} · col ${c+1}   (sheet ${r*plan.cols+c+1} of ${nSheets})`)}
        </div>`;
      }
    }
  }
  root.className = printOpts.ink === "mono" ? "ink-mono" : "";
  root.innerHTML = html;
  return plan;
}
function cropMarks(plan){
  const L = 5 * MM, T = 0.4 * MM, m = plan.m;
  const pts = [[m, m, 1, 1], [plan.pageW - m, m, -1, 1],
               [m, plan.pageH - m, 1, -1], [plan.pageW - m, plan.pageH - m, -1, -1]];
  return pts.map(([x, y, sx, sy]) =>
    `<div class="crop" style="left:${(sx>0?x:x-L).toFixed(1)}px;top:${(y-T/2).toFixed(1)}px;width:${L}px;height:${T}px"></div>`
  + `<div class="crop" style="left:${(x-T/2).toFixed(1)}px;top:${(sy>0?y:y-L).toFixed(1)}px;width:${T}px;height:${L}px"></div>`
  ).join("");
}

async function offer(filename, data, mime){
  if(DL){
    try { await DL.save({filename, data}); return true; }
    catch(err){
      if(err && err.code === "declined") return false;
      toast("Could not save that file", true); return false;
    }
  }
  const blob = data instanceof Blob ? data : new Blob([data], {type:mime || "application/octet-stream"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return true;
}
function slug(){
  const base = (printOpts.title || guessTitle())
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "family-tree";
  if(ui.view === "chart") return base;
  return base + "-" + ui.view + (ui.view === "tree" && ui.treeStyle === "rows" ? "-generations" : "");
}
async function exportPNG(){
  const plan = planSheets();

  const hasTitle = plan.hasTitle;
  const box = plan.box;
  /* the chart is printed at plan.scale CSS px, i.e. plan.scale/MM mm wide;
     rendering that many mm at the chosen dpi gives scale · dpi / 96 */
  const MAXPX = 11000;                      // stay inside the browser's canvas limit
  const scale = Math.max(0.35, Math.min(plan.scale * printOpts.dpi / 96,
                                        MAXPX / box.w, MAXPX / box.h));
  const cv = viewPaint(model, scale, printPal(),
                       hasTitle ? {main:printOpts.title, sub:printOpts.subtitle} : null);
  cv.toBlob(async blob => {
    if(!blob) return toast("Could not build the image", true);
    const ok = await offer(slug() + ".png", blob, "image/png");

function importJSON(mode){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.addEventListener("change", () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const j = JSON.parse(fr.result);
        const d = j && j.data ? j.data : j;
        if(!d || !d.people) throw new Error("no people");
        importDoc(d, mode || "replace");
      } catch(err){ toast("That file isn’t an Heirloom family file", true); }
    };
    fr.readAsText(f);
  });
  inp.click();
}
function normalise(d){
  const out = blankDoc();
  out.meta = Object.assign({title:"", subtitle:"", note:""}, d.meta || {});
  let max = 0;
  for(const id in (d.people||{})){
    const p = d.people[id];
    out.people[id] = Object.assign({id, first:"", last:"", maiden:"", sex:"", birth:"", death:"",
                                    dead:false, place:"", occupation:"", notes:"", photo:""}, p, {id});
    const n = parseInt(String(id).replace(/\D/g, "")); if(n > max) max = n;
  }
  for(const id in (d.unions||{})){
    const u = d.unions[id];
    out.unions[id] = Object.assign({id, a:null, b:null, status:"married", date:"", place:"",
                                    divorced:false, children:[]}, u, {id});
    out.unions[id].children = (out.unions[id].children||[]).filter(k => out.people[k]);
    if(out.unions[id].a && !out.people[out.unions[id].a]) out.unions[id].a = null;
    if(out.unions[id].b && !out.people[out.unions[id].b]) out.unions[id].b = null;
    const n = parseInt(String(id).replace(/\D/g, "")); if(n > max) max = n;
  }
  out.seq = Math.max(d.seq || 1, max + 1);
  return out;
}
